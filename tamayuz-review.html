:root{
  --bg:#070a1f; --bg2:#0e1433; --card:#111a42; --line:#28316e; --ink:#eef0ff; --mut:#9da6d8; --acc:#8f9dff; --acc2:#ff7aa2; --onacc:#0a0f2e; --glow1:rgba(143,157,255,.22); --glow2:rgba(255,122,162,.14);
  --ok:#2ee59d; --ok2:#0f5c43; --bad:#ff6b6b; --bad2:#5c1f27; --warn:#ffc857;
  --r:18px; --fs:1;
  --t1:#22d3ee; --t2:#ff6b9a; --t3:#ffc857; --t4:#7cf29a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--fs))}
@media (min-width:1400px){html{font-size:calc(18px * var(--fs))}}
@media (min-width:1800px){html{font-size:calc(21px * var(--fs))}}
body{font-family:"AB",Arial,Tahoma,sans-serif;font-weight:700;color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.7;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 500px at 85% -10%, var(--glow1), transparent 60%),
  radial-gradient(800px 600px at -10% 110%, var(--glow2), transparent 60%),
  var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.07;background-image:
  linear-gradient(var(--ink) 1px, transparent 1px),linear-gradient(90deg, var(--ink) 1px, transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 50% 30%, #000 0, transparent 75%)}
button{font-family:inherit;font-weight:700;cursor:pointer;border:0;color:inherit;background:none}
input,textarea,select{font-family:inherit;font-weight:700}
.hd{font-family:"HD","AB",Arial,sans-serif}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.logo{width:48px;height:48px;flex:0 0 auto;display:grid;place-items:center;background:#fff;overflow:hidden;box-shadow:0 0 0 2px var(--acc),0 0 18px -4px var(--acc)}
.logo img{width:100%;height:100%;object-fit:contain}
.logo.tile{border-radius:12px;padding:3px}
.logo.circle{border-radius:50%}
.brand-txt{line-height:1.25;min-width:0}
.brand-txt b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{display:block;font-size:.7rem;color:var(--mut);letter-spacing:.04em;direction:ltr;text-align:right}
.tb-spacer{flex:1}
.tb-btns{display:flex;gap:.4rem}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:1.05rem;transition:.2s}
.ib:hover{border-color:var(--acc);box-shadow:0 0 14px -4px var(--acc)}
.ib.off{opacity:.55}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- generic ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:1.2rem 1rem 3rem}
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,var(--acc) 8%),var(--card));border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px -18px #000}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.4rem;border-radius:14px;font-size:1.05rem;transition:.18s;border:1px solid transparent}
.btn-main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);box-shadow:0 8px 24px -10px var(--acc)}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 12px 28px -10px var(--acc)}
.btn-main:disabled{opacity:.4;transform:none;cursor:not-allowed}
.btn-ghost{background:var(--card);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .7rem;border-radius:99px;font-size:.8rem;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.kicker{color:var(--acc);font-size:.85rem;letter-spacing:.02em}
h2.sec{font-size:1.25rem;margin:1.6rem 0 .8rem;display:flex;align-items:center;gap:.6rem}
h2.sec .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--acc);color:var(--onacc);font-size:1rem}

/* ---------- setup ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center;padding:1.6rem;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--glow1),transparent 70%)}
.hero .biglogo{width:120px;height:120px}
.hero h1{font-size:clamp(1.6rem,3.6vw,2.6rem);line-height:1.25}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin-top:.4rem;font-size:1rem}
.hero .tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.grid{display:grid;gap:.9rem}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.pick{position:relative;text-align:right;padding:1.1rem 1.1rem 1rem;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);transition:.2s;display:flex;flex-direction:column;gap:.35rem;min-height:100%}
.pick:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line));transform:translateY(-2px)}
.pick.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent),0 14px 30px -18px var(--acc);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 14%,var(--card)),var(--card))}
.pick .ico{font-size:1.7rem;line-height:1}
.pick b{font-size:1.12rem}
.pick span{color:var(--mut);font-size:.85rem;line-height:1.55}
.pick .min{position:absolute;top:.8rem;left:.8rem}
.pick .big{font-size:2.6rem;line-height:1;color:var(--acc)}
.agenda{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;padding:1rem}
.ag{flex:1 1 140px;padding:.6rem .8rem;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:.85rem}
.ag b{display:block;color:var(--acc);font-size:1rem}
.teams-cfg{padding:1rem;display:grid;gap:.8rem}
.trow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem}
.tin{display:flex;align-items:center;gap:.6rem;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:.45rem .7rem}
.tin i{width:16px;height:16px;border-radius:5px;flex:0 0 auto}
.tin input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font-size:1rem;outline:none}
.sel{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sel label{color:var(--mut);font-size:.9rem}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:.4rem .9rem;border-radius:9px;font-size:.9rem;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--onacc)}
.start-row{display:flex;justify-content:center;margin-top:1.6rem}
.start-row .btn{font-size:1.25rem;padding:1rem 2.6rem}
.foot{margin-top:2rem;text-align:center;color:var(--mut);font-size:.8rem}

/* ---------- play ---------- */
.play{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:1rem;align-items:start}
.strip{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.9rem}
.prog{flex:1 1 200px;height:10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.qcard{padding:1.3rem 1.4rem 1.2rem;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.qhead{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.8rem}
.badge{padding:.25rem .75rem;border-radius:99px;font-size:.82rem;border:1px solid var(--line);background:var(--bg2)}
.badge.type{background:var(--acc);color:var(--onacc);border-color:transparent}
.badge.fast{background:var(--warn);color:#2a1d00;border-color:transparent}
.badge.essay{background:var(--acc2);color:var(--onacc);border-color:transparent}
.badge.pts{margin-inline-start:auto;color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.turn{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;border-radius:12px;margin-bottom:.8rem;font-size:1.05rem;border:1px solid}
.turn i{width:14px;height:14px;border-radius:50%}
.qtext{font-size:1.45rem;line-height:1.9}
.fig{display:block;max-width:340px;width:100%;margin:.8rem auto .2rem}
.fig .fl{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.fig .fdash{fill:none;stroke:var(--mut);stroke-width:2;stroke-dasharray:7 6}
.fig .fs{fill:color-mix(in srgb,var(--acc) 38%,transparent)}
.fig .fw{fill:var(--card)}
.fig .fd{fill:var(--acc)}
.fig .fmk{stroke:var(--acc2);stroke-width:3}
.fig .fmk2{stroke:var(--warn);stroke-width:3}
.fig .ft{fill:var(--ink);font-size:18px;font-family:"AB",Arial,sans-serif;font-weight:700}
.fig .ft.hi{fill:var(--acc)}
table.sl{margin:.8rem auto .2rem;border-collapse:collapse;font-size:1.25rem;min-width:240px}
table.sl th,table.sl td{border:1px solid var(--line);padding:.35rem 1.2rem;text-align:center}
table.sl th{background:var(--bg2);color:var(--acc);font-size:1rem}
table.sl td:first-child{border-left:3px solid var(--acc)}
table.sl td:last-child{letter-spacing:.5em;text-align:right}
.slk{text-align:center;color:var(--mut);font-size:.85rem}

/* math notation */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .14em;line-height:1.08;font-size:.9em}
.fr>.nu{padding:0 .2em .06em;border-bottom:2px solid currentColor}
.fr>.de{padding:.06em .2em 0}
.fr .fr{font-size:.92em}
.mx{display:inline-flex;flex-direction:row;align-items:center;vertical-align:middle;gap:.05em}
.ng{display:inline-flex;align-items:center;vertical-align:middle;white-space:nowrap}
sup{unicode-bidi:isolate;font-size:.62em;line-height:0;position:relative;top:-.55em;vertical-align:baseline;margin:0 .04em}
sub{font-size:.62em}
.rt{display:inline-flex;align-items:stretch;vertical-align:middle;position:relative;margin:0 .12em}
.rs{display:inline-block;transform:scaleX(-1);font-size:1.15em;line-height:1;padding-top:.06em}
.rr{border-top:2px solid currentColor;padding:.08em .22em 0;display:inline-flex;align-items:center;margin-top:.12em}
.rt:has(.fr)>.rs{font-size:2.1em;line-height:.95}
.rt:has(.fr)>.rr{margin-top:.18em}
.rt3 .ri{position:absolute;right:-.15em;top:-.42em;font-size:.55em}
.rt3{margin-right:.32em}
.pt{white-space:nowrap;display:inline-block}
.pi{font-family:"Times New Roman",serif;font-style:italic}

/* options */
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-top:1.1rem}
.opt{display:flex;align-items:center;gap:.8rem;text-align:right;padding:.85rem 1rem;border-radius:14px;background:var(--bg2);border:1.5px solid var(--line);font-size:1.25rem;transition:.15s;min-height:64px}
.opt .k{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:.95rem;color:var(--acc)}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--bg2));box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.opt.right .k{background:var(--ok);color:#03241a;border-color:transparent}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg2));animation:shake .35s}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:transparent}
.opt.dim{opacity:.45}
.opt.x{opacity:.3;text-decoration:line-through}
.tf{grid-template-columns:repeat(2,1fr)}
.tf .opt{justify-content:center;font-size:1.5rem;min-height:84px}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}

.steps{display:grid;gap:.6rem;margin-top:1rem;counter-reset:st}
.step{display:flex;gap:.8rem;align-items:center;text-align:right;padding:.75rem 1rem;border-radius:14px;background:var(--bg2);border:1.5px dashed var(--line);font-size:1.25rem;transition:.15s}
.step .k{flex:0 0 auto;padding:.1rem .6rem;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:.85rem;color:var(--mut)}
.step:hover:not(:disabled){border-color:var(--warn);border-style:solid}
.step.right{border:1.5px solid var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--bg2))}
.step.right .k{background:var(--warn);color:#2a1d00}
.step.wrong{border:1.5px solid var(--bad);animation:shake .35s}
.step.okstep{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}

.inbox{margin-top:1.1rem;display:grid;gap:.7rem;justify-items:center}
.inrow{display:flex;gap:.6rem;width:min(520px,100%)}
.inrow input{flex:1;min-width:0;padding:.75rem 1rem;font-size:1.5rem;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);text-align:center;outline:none}
.inrow input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.inrow input.ok{border-color:var(--ok)}
.inrow input.bad{border-color:var(--bad);animation:shake .35s}
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem;width:min(520px,100%)}
.pad button{padding:.5rem 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:1.1rem}
.pad button:hover{border-color:var(--acc)}
.hint{color:var(--mut);font-size:.82rem;text-align:center}

.essay textarea{width:100%;min-height:120px;margin-top:1rem;padding:.8rem 1rem;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font-size:1.1rem;resize:vertical;outline:none;line-height:1.8}
.essay textarea:focus{border-color:var(--acc2)}
.model{margin-top:1rem;padding:1rem 1.1rem;border-radius:14px;border:1px solid color-mix(in srgb,var(--acc2) 50%,var(--line));background:color-mix(in srgb,var(--acc2) 9%,var(--bg2))}
.model h4{color:var(--acc2);margin-bottom:.4rem;font-size:1rem}
.model ol{list-style:arabic-indic;padding-inline-start:1.6rem;display:grid;gap:.35rem;font-size:1.2rem}
.rubric{margin-top:.7rem;font-size:.9rem;color:var(--mut);border-top:1px dashed var(--line);padding-top:.6rem}
.grade-row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.9rem}
.grade-row .btn{flex:1 1 150px;padding:.7rem 1rem}
.g-full{background:color-mix(in srgb,var(--ok) 20%,var(--card));border-color:var(--ok)!important}
.g-half{background:color-mix(in srgb,var(--warn) 18%,var(--card));border-color:var(--warn)!important}
.g-zero{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad)!important}

.fb{margin-top:1.1rem;border-radius:16px;padding:1rem 1.1rem;border:1px solid var(--line);background:var(--bg2);animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fb.good{border-color:color-mix(in srgb,var(--ok) 60%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--ok) 13%,var(--bg2)),var(--bg2))}
.fb.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 11%,var(--bg2)),var(--bg2))}
.fb.half{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.fb .v{font-size:1.25rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.fb .v .plus{margin-inline-start:auto;color:var(--warn)}
.fb .ans{margin-top:.5rem;font-size:1.15rem}
.fb .ans b{color:var(--ok)}
.key{margin-top:.7rem;padding:.75rem .9rem;border-radius:12px;background:color-mix(in srgb,var(--acc) 9%,var(--card));border-inline-start:4px solid var(--acc);font-size:1.08rem;line-height:1.9}
.key .kt{color:var(--acc);display:block;font-size:.9rem;margin-bottom:.15rem}
.fix{margin-top:.6rem;padding:.6rem .9rem;border-radius:12px;background:color-mix(in srgb,var(--warn) 10%,var(--card));border-inline-start:4px solid var(--warn);font-size:1.05rem}
.fix .kt{color:var(--warn);display:block;font-size:.88rem}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end;margin-top:1rem}

/* side */
.side{display:grid;gap:1rem;position:sticky;top:76px}
.coach{padding:1rem;display:grid;grid-template-columns:96px 1fr;gap:.8rem;align-items:center}
.coach svg{width:96px;height:96px;overflow:visible}
.coach .hex{fill:var(--bg2);stroke:url(#cg);stroke-width:5;transition:.3s}
.coach .eye{fill:var(--acc);transition:all .25s}
.coach .mouth{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;transition:all .25s}
.coach .brow{stroke:var(--acc);stroke-width:4;stroke-linecap:round;transition:all .25s}
.coach[data-s="happy"] .eye,.coach[data-s="fire"] .eye{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round}
.coach[data-s="happy"] .mouth,.coach[data-s="fire"] .mouth{stroke:var(--ok)}
.coach[data-s="happy"] .brow,.coach[data-s="fire"] .brow{stroke:var(--ok)}
.coach[data-s="oops"] .eye{fill:var(--warn)}
.coach[data-s="oops"] .mouth,.coach[data-s="oops"] .brow{stroke:var(--warn)}
.coach[data-s="time"] .eye{fill:var(--bad)}
.coach[data-s="time"] .mouth,.coach[data-s="time"] .brow{stroke:var(--bad)}
.coach[data-s="fire"] svg{filter:drop-shadow(0 0 12px var(--ok))}
.coach .spark{opacity:0;transition:.3s;fill:var(--warn)}
.coach[data-s="fire"] .spark{opacity:1;animation:tw 1s infinite alternate}
@keyframes tw{to{transform:scale(1.25);transform-origin:center}}
.coach .ring{fill:none;stroke:var(--acc);stroke-width:2;opacity:.25;stroke-dasharray:4 7;animation:spin 14s linear infinite;transform-origin:60px 60px}
@keyframes spin{to{transform:rotate(360deg)}}
.coach .who{font-size:.78rem;color:var(--mut)}
.coach .say{font-size:1rem;line-height:1.65;min-height:3.3em}
.coach.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.03)}}

.timers{padding:1rem;display:grid;gap:.8rem}
.tm{display:flex;align-items:center;gap:.8rem}
.tm .lab{font-size:.8rem;color:var(--mut)}
.tm .val{font-size:1.6rem;font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:.03em}
.tm .val.low{color:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.qring{width:64px;height:64px;flex:0 0 auto;position:relative}
.qring svg{width:64px;height:64px;transform:rotate(-90deg)}
.qring circle{fill:none;stroke-width:7}
.qring .bgc{stroke:var(--bg2)}
.qring .fgc{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .3s}
.qring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.1rem}
.tbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.tbtns button{padding:.5rem .3rem;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:.85rem}
.tbtns button:hover{border-color:var(--acc)}
.tbtns button.on{border-color:var(--acc);color:var(--acc)}

.board{padding:1rem;display:grid;gap:.55rem}
.board h3{font-size:.95rem;color:var(--mut);display:flex;justify-content:space-between}
.team{display:grid;grid-template-columns:12px 1fr auto auto;gap:.6rem;align-items:center;padding:.55rem .7rem;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);transition:.25s}
.team i{width:12px;height:36px;border-radius:6px}
.team .nm{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .sc{font-size:1.5rem;min-width:2.5ch;text-align:center}
.team .adj{display:flex;flex-direction:column;gap:2px}
.team .adj button{width:26px;height:20px;border-radius:6px;background:var(--card);border:1px solid var(--line);font-size:.8rem;line-height:1}
.team.now{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 25%,transparent),0 0 22px -8px var(--tc)}
.team.bump .sc{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.4);color:var(--warn)}}
.solo{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:center}
.solo div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:.5rem .2rem}
.solo b{display:block;font-size:1.45rem}
.solo small{color:var(--mut);font-size:.75rem}

/* round interstitial */
.round{max-width:820px;margin:2rem auto;padding:2.2rem;text-align:center;position:relative;overflow:hidden}
.round .num{font-size:5rem;line-height:1;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.round h2{font-size:2rem;margin:.3rem 0}
.round .tops{display:flex;flex-wrap:wrap;justify-content:center;gap:.45rem;margin:1rem 0 1.4rem}
.round .meta{color:var(--mut);margin-bottom:1.2rem}

/* results */
.res-head{padding:1.6rem;display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center}
.score-ring{width:150px;height:150px;position:relative}
.score-ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:12}
.score-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2rem;line-height:1}
.score-ring b small{display:block;font-size:.8rem;color:var(--mut);text-align:center}
.podium{display:grid;gap:.6rem;margin-top:.8rem}
.stu{font-size:1.15rem;margin:.2rem 0}.stu b{color:var(--acc);font-size:1.35rem}
.rate{display:inline-block;margin:.5rem 0 .3rem;padding:.35rem 1rem;border-radius:99px;border:1.5px solid;font-size:1.1rem}
.namecard input{font-size:1.2rem}
.pod{display:grid;grid-template-columns:44px 14px 1fr auto;gap:.7rem;align-items:center;padding:.6rem .9rem;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:1.1rem}
.pod .rk{font-size:1.4rem;text-align:center}
.pod i{width:14px;height:30px;border-radius:5px}
.pod.first{border-color:var(--warn);box-shadow:0 0 22px -10px var(--warn)}
.mast{padding:1.3rem;display:grid;gap:1rem}
.mrow{display:grid;grid-template-columns:150px 1fr 70px;gap:.9rem;align-items:center}
.mrow .bar{height:16px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.mrow .bar i{display:block;height:100%;border-radius:99px;transition:width 1s}
.mrow .pc{font-size:1.2rem;text-align:left}
.mrow small{display:block;color:var(--mut);font-size:.78rem}
.lvl{grid-column:1/-1;font-size:.9rem;padding:.45rem .8rem;border-radius:10px;margin-top:-.4rem}
.review{padding:1.2rem;display:grid;gap:.8rem}
.rv{padding:.8rem 1rem;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.rv .rq{font-size:1.05rem}
.rv .ra{margin-top:.35rem;color:var(--ok);font-size:1rem}
.rv .rw{margin-top:.35rem;color:var(--mut);font-size:.92rem}

.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(250%);opacity:0;background:var(--card);border:1px solid var(--acc);padding:.7rem 1.3rem;border-radius:14px;z-index:60;transition:.35s;box-shadow:0 10px 30px -10px #000;font-size:1rem;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* responsive */
@media (max-width:1050px){.play{grid-template-columns:1fr}.side{position:static;grid-template-columns:1fr 1fr}.side .coach{grid-column:1/-1}.g5{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){
  .g2,.g3,.g5{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .hero .tags{justify-content:center}
  .opts{grid-template-columns:1fr}
  .qtext{font-size:1.2rem}
  .opt{font-size:1.1rem}
  .side{grid-template-columns:1fr}
  .coach{grid-template-columns:70px 1fr}.coach svg{width:70px;height:70px}
  .brand-txt small{display:none}
  .res-head{grid-template-columns:1fr;justify-items:center;text-align:center}
  .mrow{grid-template-columns:1fr 60px}.mrow .bar{grid-column:1/-1;grid-row:2}
  .pad{grid-template-columns:repeat(7,1fr)}
  .tb-btns .ib{width:38px;height:38px}
  #bFsm,#bFsp{display:none}
  .wrap{padding:.9rem .7rem 2.5rem}
}
@media print{
  body{background:#fff;color:#000}body::before,body::after,.topbar,.no-print{display:none!important}
  .card{box-shadow:none;border:1px solid #999;background:#fff}
}
.pick .ico .nb{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ff7aa2,#ffb36b);color:#1a0b1f;font-size:1.75rem;line-height:1;padding-top:.08em;box-shadow:0 0 0 3px rgba(255,255,255,.25),0 8px 18px -6px #ff7aa2}
.pick>span:not([class]):not([style]){color:#ffe08a;font-size:.92rem}
.pick>span[style]{color:#7ee8c9!important}
.pick.on>span:not([class]):not([style]){color:#fff3c4}
</style>
</head>
<body>

, "q": "أي عدد غير الصفر مرفوع إلى الأس صفر يساوي صفرًا.", "w": "نلاحظ النمط: 2<sup>3<\/sup> = 8 ، 2<sup>2<\/sup> = 4 ، 2<sup>1<\/sup> = 2 ، فكل مرة نقسم على 2.<br>إذن 2<sup>0<\/sup> = 2 ÷ 2 = 1.", "pts": 10, "d": 1, "s": 1, "a": false, "fix": "أي عدد غير الصفر مرفوع إلى الأس صفر يساوي 1، مثل 7<sup>0<\/sup> = 1."}, {"id": 67, "type": "input", "u": 2, "t": "الأسس", "q": "أوجد قيمة: 2<sup>3<\/sup> × 3<sup>2<\/sup>", "w": "2<sup>3<\/sup> = 8 و 3<sup>2<\/sup> = 9.<br>8 × 9 = 72.", "pts": 15, "d": 2, "s": 1, "a": 72, "ans": "72"}, {"id": 68, "type": "mcq", "u": 2, "t": "التحليل بالصورة الأسية", "q": "تحليل العدد 72 إلى عوامله الأوّلية بالصورة الأسية:", "w": "72 = 2 × 2 × 2 × 3 × 3 ، والعامل المتكرر نكتبه بالأس.<br>2<sup>2<\/sup> × 3<sup>3<\/sup> = 108 وليس 72، و 8 و 9 ليسا أوّليين.", "pts": 10, "d": 1, "s": 1, "o": ["2<sup>3<\/sup> × 3<sup>2<\/sup>", "2<sup>2<\/sup> × 3<sup>3<\/sup>", "8 × 9", "2<sup>3<\/sup> × 9"], "a": 0}, {"id": 69, "type": "mcq", "u": 2, "t": "الصورة العلمية", "q": "الصورة العلمية (القياسية) للعدد 3200000 هي:", "w": "في الصورة العلمية يكون العدد الأول من 1 إلى أقل من 10.<br>نحرّك الفاصلة 6 منازل لنحصل على 3.2 فيكون الأس 6.", "pts": 10, "d": 1, "s": 1, "o": ["3.2 × 10<sup>6<\/sup>", "32 × 10<sup>5<\/sup>", "3.2 × 10<sup>5<\/sup>", "0.32 × 10<sup>7<\/sup>"], "a": 0}, {"id": 70, "type": "input", "u": 2, "t": "الجذور التربيعية", "q": "أوجد قيمة: <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">144<\/span><\/span>", "w": "12 × 12 = 144، إذن <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">144<\/span><\/span> = 12.<br>الجذر التربيعي هو العدد الذي إذا ضُرب في نفسه أعطى العدد.", "pts": 15, "d": 1, "s": 1, "a": 12, "ans": "12"}, {"id": 71, "type": "mcq", "u": 2, "t": "مربعات الأعداد", "q": "أي الأعداد الآتية مربع كامل؟", "w": "المربع الكامل ناتج ضرب عدد كلي في نفسه.<br>81 = 9 × 9، أما البقية فلا يوجد عدد كلي مربعه يساويها.", "pts": 10, "d": 1, "s": 1, "o": ["24", "48", "81", "90"], "a": 2}, {"id": 72, "type": "input", "u": 2, "t": "ترتيب العمليات", "q": "أوجد قيمة: 8 + 4 × 3", "w": "الضرب قبل الجمع: 4 × 3 = 12.<br>ثم 8 + 12 = 20 (وليس 36).", "pts": 15, "d": 1, "s": 1, "a": 20, "ans": "20"}, {"id": 73, "type": "mcq", "u": 2, "t": "التعبيرات الجبرية", "q": "التعبير الجبري الذي يمثّل «ناتج طرح 5 من ثلاثة أمثال العدد ن» هو:", "w": "«ثلاثة أمثال ن» = 3ن ، و«طرح 5 من» تعني أن 5 هو المطروح.<br>إذن: 3ن − 5.", "pts": 10, "d": 1, "s": 1, "o": ["5 − 3ن", "3ن − 5", "3(ن − 5)", "3 + ن − 5"], "a": 1}, {"id": 74, "type": "error", "u": 2, "t": "ترتيب العمليات", "q": "اكتشف الخطوة الخاطئة في حساب: 20 − 4 × 3 + 2", "w": "ترتيب العمليات: الأقواس ← الأسس ← الضرب والقسمة ← الجمع والطرح.<br>الطرح لا يسبق الضرب حتى لو جاء أولًا في المسألة.", "pts": 15, "d": 2, "s": 1, "a": 0, "fix": "نبدأ بالضرب: 4 × 3 = 12 ، ثم من اليمين: 20 − 12 + 2 = 10.", "steps": ["20 − 4 = 16", "16 × 3 = 48", "48 + 2 = 50"]}, {"id": 75, "type": "mcq", "u": 2, "t": "التعبيرات الجبرية", "q": "قيمة التعبير 2س<sup>2<\/sup> عندما س = 3 هي:", "w": "الأس يخص س فقط: 2 × 3<sup>2<\/sup> = 2 × 9 = 18.<br>الناتج 36 يأتي من الخطأ (2 × 3)<sup>2<\/sup>.", "pts": 10, "d": 2, "s": 1, "o": ["36", "18", "12", "81"], "a": 1}, {"id": 76, "type": "mcq", "u": 2, "t": "الصورة العلمية", "q": "العدد 4.5 × 10<sup>4<\/sup> بالصورة العادية هو:", "w": "10<sup>4<\/sup> = 10000 ، و 4.5 × 10000 = 45000.<br>الأس الموجب يعني عددًا كبيرًا: نحرّك الفاصلة 4 منازل.", "pts": 10, "d": 2, "s": 1, "o": ["45000", "4500", "450000", "0.00045"], "a": 0}, {"id": 77, "type": "tf", "u": 2, "t": "الجذور التربيعية", "q": "<span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">9 + 16<\/span><\/span> = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">9<\/span><\/span> + <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">16<\/span><\/span>", "w": "الجذر التربيعي لا يتوزّع على الجمع.<br>نحسب ما تحت الجذر أولًا ثم نأخذ الجذر.", "pts": 10, "d": 2, "s": 1, "a": false, "fix": "<span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">9 + 16<\/span><\/span> = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">25<\/span><\/span> = 5 ، بينما <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">9<\/span><\/span> + <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">16<\/span><\/span> = 3 + 4 = 7."}, {"id": 78, "type": "input", "u": 2, "t": "ترتيب العمليات", "q": "أوجد قيمة: 3 × (4 + 2)<sup>2<\/sup> ÷ 6", "w": "الأقواس: 4 + 2 = 6 ، ثم الأس: 6<sup>2<\/sup> = 36.<br>ثم من اليمين: 3 × 36 = 108 ، 108 ÷ 6 = 18.", "pts": 15, "d": 2, "s": 1, "a": 18, "ans": "18"}, {"id": 79, "type": "mcq", "u": 2, "t": "التعبيرات الجبرية", "q": "عمر الأب يزيد على 3 أمثال عمر ابنه بـ 4 سنوات. إذا كان عمر الابن ع سنة، فإن عمر الأب:", "w": "«3 أمثال عمر الابن» = 3ع ، و«يزيد عليه بـ 4» = نضيف 4.<br>تحقق: لو كان الابن 10 سنوات ⇐ الأب 34 سنة.", "pts": 10, "d": 2, "s": 1, "o": ["3ع + 4", "4ع + 3", "3(ع + 4)", "ع + 12"], "a": 0}, {"id": 80, "type": "essay", "u": 2, "t": "التحليل والمربع الكامل", "q": "اكتب العدد 180 في صورة حاصل ضرب عوامله الأوّلية بالصورة الأسية، ثم استخدم ذلك لتبيّن هل 180 مربع كامل أم لا، مع ذكر السبب.", "w": "التحليل إلى العوامل الأوّلية يكشف المربعات الكاملة.<br>أسس زوجية لكل العوامل ⇐ مربع كامل.", "pts": 20, "d": 2, "s": 1, "model": ["180 = 2 × 90 = 2 × 2 × 45 = 2 × 2 × 3 × 15 = 2 × 2 × 3 × 3 × 5", "180 = 2<sup>2<\/sup> × 3<sup>2<\/sup> × 5", "العدد ليس مربعًا كاملًا؛ لأن أس العامل 5 فردي (1).", "المربع الكامل تكون جميع أسس عوامله الأوّلية زوجية (مثل 36 = 2<sup>2<\/sup> × 3<sup>2<\/sup>)."], "rubric": "درجة كاملة: تحليل صحيح + الحكم + السبب. نصف الدرجة: تحليل صحيح فقط."}, {"id": 81, "type": "mcq", "u": 2, "t": "جمع الأعداد الصحيحة", "q": "-7 + 3 =", "w": "عددان مختلفا الإشارة: نطرح (7 − 3 = 4) ونأخذ إشارة الأكبر قيمة مطلقة.<br>على خط الأعداد: نبدأ من -7 ونتحرك 3 خطوات نحو الموجب.", "pts": 10, "d": 1, "s": 2, "o": ["-10", "-4", "4", "10"], "a": 1}, {"id": 82, "type": "input", "u": 2, "t": "طرح الأعداد الصحيحة", "q": "أوجد الناتج: 5 − 8", "w": "5 − 8 = 5 + (-8) = -3.<br>طرح عدد يساوي جمع معكوسه الجمعي.", "pts": 15, "d": 1, "s": 2, "a": -3, "ans": "-3"}, {"id": 83, "type": "mcq", "u": 2, "t": "طرح الأعداد الصحيحة", "q": "(-6) − (-4) =", "w": "طرح (-4) يساوي جمع 4: (-6) + 4 = -2.<br>الطرح ⇐ نجمع المعكوس الجمعي.", "pts": 10, "d": 1, "s": 2, "o": ["-10", "-2", "2", "10"], "a": 1}, {"id": 84, "type": "mcq", "u": 2, "t": "ضرب الأعداد الصحيحة", "q": "(-4) × (-5) =", "w": "ناتج ضرب عددين سالبين موجب.<br>4 × 5 = 20 ⇐ الناتج 20.", "pts": 10, "d": 1, "s": 2, "o": ["-20", "20", "-9", "9"], "a": 1}, {"id": 85, "type": "input", "u": 2, "t": "قسمة الأعداد الصحيحة", "q": "أوجد الناتج: -36 ÷ 4", "w": "سالب ÷ موجب = سالب.<br>36 ÷ 4 = 9 ⇐ الناتج -9.", "pts": 15, "d": 1, "s": 2, "a": -9, "ans": "-9"}, {"id": 86, "type": "tf", "u": 2, "t": "ضرب الأعداد الصحيحة", "q": "ناتج ضرب عدد صحيح سالب في عدد صحيح موجب يكون موجبًا.", "w": "متشابهان في الإشارة ⇐ موجب ، مختلفان ⇐ سالب.<br>القاعدة نفسها للقسمة.", "pts": 10, "d": 1, "s": 2, "a": false, "fix": "ناتج ضرب عددين مختلفين في الإشارة يكون سالبًا، مثل: (-3) × 4 = -12."}, {"id": 87, "type": "input", "u": 2, "t": "حل المعادلات", "q": "حلّ المعادلة: س + 9 = 4", "w": "نطرح 9 من الطرفين: س = 4 − 9 = -5.<br>تحقق: -5 + 9 = 4 ✓", "pts": 15, "d": 1, "s": 2, "a": -5, "ans": "س = -5"}, {"id": 88, "type": "input", "u": 2, "t": "حل المعادلات", "q": "حلّ المعادلة: <span class=\"fr\"><span class=\"nu\">ص<\/span><span class=\"de\">3<\/span><\/span> = 7", "w": "نضرب الطرفين في 3 (العملية العكسية للقسمة).<br>ص = 7 × 3 = 21.", "pts": 15, "d": 2, "s": 2, "a": 21, "ans": "ص = 21"}, {"id": 89, "type": "mcq", "u": 2, "t": "حل المعادلات", "q": "حلّ المعادلة: 4ن = -28", "w": "نقسم الطرفين على 4: ن = -28 ÷ 4 = -7.<br>تحقق: 4 × (-7) = -28 ✓", "pts": 10, "d": 1, "s": 2, "o": ["-7", "7", "-24", "-112"], "a": 0}, {"id": 90, "type": "mcq", "u": 2, "t": "الأعداد الصحيحة", "q": "أصغر الأعداد الآتية هو:", "w": "كلما ابتعد العدد السالب عن الصفر صغرت قيمته.<br>على خط الأعداد: -8 يقع يسار -3.", "pts": 10, "d": 1, "s": 2, "o": ["-8", "-3", "0", "2"], "a": 0}, {"id": 91, "type": "error", "u": 2, "t": "حل المعادلات", "q": "اكتشف الخطوة الخاطئة في حل المعادلة: 2س + 7 = -1", "w": "طرح عدد موجب من سالب يزيد القيمة السالبة: -1 − 7 = -8.<br>تحقق دائمًا بالتعويض: 2(-4) + 7 = -1 ✓", "pts": 15, "d": 2, "s": 2, "a": 1, "fix": "-1 − 7 = -8 ، إذن 2س = -8 ومنها س = -4.", "steps": ["2س = -1 − 7", "2س = -6", "س = -3"]}, {"id": 92, "type": "step", "u": 2, "t": "حل المعادلات", "q": "حلّ المعادلة: 5س − 3 = 17. الخطوة الأولى الصحيحة:", "w": "نتخلّص أولًا من الجمع أو الطرح، ثم من الضرب أو القسمة.<br>5س = 20 ⇐ س = 4.", "pts": 15, "d": 2, "s": 2, "o": ["نضيف 3 إلى الطرفين: 5س = 20", "نقسم على 5 أولًا: س − 3 = 17", "نطرح 3 من الطرفين: 5س = 14", "نضرب الطرفين في 5"], "a": 0}, {"id": 93, "type": "mcq", "u": 2, "t": "جمع الأعداد الصحيحة", "q": "كانت درجة الحرارة صباحًا -3° س، ثم ارتفعت 8 درجات ظهرًا. كم أصبحت؟", "w": "الارتفاع يعني الجمع: -3 + 8 = 5.<br>من -3 إلى الصفر 3 درجات، ثم 5 درجات أخرى.", "pts": 10, "d": 2, "s": 2, "o": ["-11° س", "5° س", "-5° س", "11° س"], "a": 1}, {"id": 94, "type": "mcq", "u": 2, "t": "حل المعادلات", "q": "اشترت سارة 3 دفاتر متساوية الثمن وقلمًا بـ 2 دينار، فدفعت 11 دينارًا. ثمن الدفتر الواحد:", "w": "المعادلة: 3س + 2 = 11 ⇐ 3س = 9 ⇐ س = 3.<br>تحقق: 3 × 3 + 2 = 11 ✓", "pts": 10, "d": 2, "s": 2, "o": ["3 دنانير", "4 دنانير", "9 دنانير", "<span class=\"fr\"><span class=\"nu\">13<\/span><span class=\"de\">3<\/span><\/span> دينار"], "a": 0}, {"id": 95, "type": "tf", "u": 2, "t": "طرح الأعداد الصحيحة", "q": "(-2) − (-5) = -7", "w": "طرح سالب = جمع موجب.<br>الخطأ الشائع: جمع الإشارتين بدل تغيير إشارة المطروح.", "pts": 10, "d": 2, "s": 2, "a": false, "fix": "(-2) − (-5) = (-2) + 5 = 3."}, {"id": 96, "type": "essay", "u": 2, "t": "الأعداد الصحيحة", "q": "غوّاص على عمق -12 مترًا تحت سطح البحر، صعد 5 أمتار ثم نزل 9 أمتار. اكتب تعبيرًا بالأعداد الصحيحة يمثّل موقعه النهائي، ثم أوجد قيمته وفسّر معناه.", "w": "الصعود ⇐ جمع عدد موجب ، النزول ⇐ جمع عدد سالب.<br>الإشارة السالبة في الناتج تعني «تحت سطح البحر».", "pts": 20, "d": 2, "s": 2, "model": ["التعبير: -12 + 5 + (-9)", "= -7 + (-9) = -16", "المعنى: أصبح الغوّاص على عمق 16 مترًا تحت سطح البحر."], "rubric": "درجة كاملة: التعبير + القيمة + التفسير. نصف الدرجة: القيمة صحيحة دون تعبير."}, {"id": 97, "type": "essay", "u": 2, "t": "حل المعادلات", "q": "حلّ المعادلة 4س − 9 = 15 موضحًا خطوات الحل، ثم تحقّق من صحة الحل بالتعويض.", "w": "نستخدم العمليات العكسية بترتيب عكسي.<br>التعويض في المعادلة الأصلية يضمن صحة الحل.", "pts": 20, "d": 2, "s": 2, "model": ["4س − 9 + 9 = 15 + 9", "4س = 24", "س = 24 ÷ 4 = 6", "التحقق: 4 × 6 − 9 = 24 − 9 = 15 ✓"], "rubric": "درجة كاملة: الخطوات + الحل + التحقق. نصف الدرجة: الحل صحيح دون تحقق."}, {"id": 98, "type": "input", "u": 3, "t": "المحيط", "q": "مستطيل طوله 12 سم وعرضه 5 سم. أوجد محيطه بالسنتيمتر.", "w": "محيط المستطيل = 2 × (الطول + العرض).<br>2 × (12 + 5) = 34 سم.", "pts": 15, "d": 1, "s": 3, "a": 34, "ans": "34 سم"}, {"id": 99, "type": "mcq", "u": 3, "t": "مساحة المثلث", "q": "مساحة مثلث طول قاعدته 10 سم وارتفاعه 6 سم تساوي:", "w": "مساحة المثلث = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × القاعدة × الارتفاع.<br><span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × 10 × 6 = 30 سم<sup>2<\/sup>.", "pts": 10, "d": 1, "s": 3, "o": ["60 سم<sup>2<\/sup>", "30 سم<sup>2<\/sup>", "16 سم<sup>2<\/sup>", "32 سم<sup>2<\/sup>"], "a": 1}, {"id": 100, "type": "input", "u": 3, "t": "مساحة متوازي الأضلاع", "q": "متوازي أضلاع طول قاعدته 9 سم وارتفاعه 4 سم. أوجد مساحته.", "w": "مساحة متوازي الأضلاع = القاعدة × الارتفاع.<br>9 × 4 = 36 سم<sup>2<\/sup>.", "pts": 15, "d": 2, "s": 3, "a": 36, "ans": "36 سم<sup>2<\/sup>"}, {"id": 101, "type": "mcq", "u": 3, "t": "مساحة شبه المنحرف", "q": "شبه منحرف طولا قاعدتيه المتوازيتين 8 سم و 6 سم، وارتفاعه 5 سم. مساحته:", "w": "مساحة شبه المنحرف = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × (مجموع القاعدتين) × الارتفاع.<br><span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × (8 + 6) × 5 = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × 14 × 5 = 35 سم<sup>2<\/sup>.", "pts": 10, "d": 1, "s": 3, "o": ["70 سم<sup>2<\/sup>", "35 سم<sup>2<\/sup>", "240 سم<sup>2<\/sup>", "19 سم<sup>2<\/sup>"], "a": 1}, {"id": 102, "type": "mcq", "u": 3, "t": "مفاهيم الدائرة", "q": "القطعة المستقيمة الواصلة من مركز الدائرة إلى أي نقطة عليها تُسمّى:", "w": "نصف القطر يبدأ من المركز وينتهي على الدائرة.<br>جميع أنصاف أقطار الدائرة الواحدة متساوية.", "pts": 10, "d": 1, "s": 3, "o": ["القطر", "نصف القطر", "الوتر", "القوس"], "a": 1}, {"id": 103, "type": "mcq", "u": 3, "t": "محيط الدائرة", "q": "محيط دائرة طول قطرها 10 سم يساوي (<span class=\"pi\">π<\/span> = 3.14):", "w": "محيط الدائرة = <span class=\"pi\">π<\/span> × القطر.<br>3.14 × 10 = 31.4 سم.", "pts": 10, "d": 1, "s": 3, "o": ["31.4 سم", "62.8 سم", "78.5 سم", "314 سم"], "a": 0}, {"id": 104, "type": "input", "u": 3, "t": "مساحة الدائرة", "q": "أوجد مساحة دائرة طول نصف قطرها 10 سم (<span class=\"pi\">π<\/span> = 3.14).", "w": "مساحة الدائرة = <span class=\"pi\">π<\/span> × نق<sup>2<\/sup>.<br>3.14 × 10 × 10 = 314 سم<sup>2<\/sup>.", "pts": 15, "d": 1, "s": 3, "a": 314, "ans": "314 سم<sup>2<\/sup>"}, {"id": 105, "type": "tf", "u": 3, "t": "محيط الدائرة", "q": "محيط الدائرة = <span class=\"pi\">π<\/span> × نق<sup>2<\/sup>", "w": "المحيط طول (وحدته سم)، والمساحة سطح (وحدتها سم<sup>2<\/sup>).<br>وجود التربيع يدل على المساحة.", "pts": 10, "d": 1, "s": 3, "a": false, "fix": "<span class=\"pi\">π<\/span> × نق<sup>2<\/sup> هي قانون المساحة، أما المحيط = 2 × <span class=\"pi\">π<\/span> × نق = <span class=\"pi\">π<\/span> × القطر."}, {"id": 106, "type": "error", "u": 3, "t": "مساحة الدائرة", "q": "اكتشف الخطوة الخاطئة: مساحة دائرة طول نصف قطرها 7 سم (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>)", "w": "نق<sup>2<\/sup> تعني نق × نق.<br>الخلط بين التربيع والضرب في 2 من أكثر الأخطاء شيوعًا.", "pts": 15, "d": 2, "s": 3, "a": 1, "fix": "نق<sup>2<\/sup> = 7 × 7 وليس 7 × 2، إذن المساحة = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 7 = 154 سم<sup>2<\/sup>.", "steps": ["المساحة = <span class=\"pi\">π<\/span> × نق<sup>2<\/sup>", "= <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 2", "= 44 سم<sup>2<\/sup>"]}, {"id": 107, "type": "mcq", "u": 3, "t": "المحيط والمساحة", "q": "مربع مساحته 49 سم<sup>2<\/sup>، فإن محيطه:", "w": "طول الضلع = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">49<\/span><\/span> = 7 سم.<br>المحيط = 4 × 7 = 28 سم.", "pts": 10, "d": 2, "s": 3, "o": ["7 سم", "14 سم", "28 سم", "49 سم"], "a": 2}, {"id": 108, "type": "mcq", "u": 3, "t": "مساحة الدائرة", "q": "إذا ضاعفنا طول نصف قطر دائرة، فإن مساحتها:", "w": "المساحة = <span class=\"pi\">π<\/span> × نق<sup>2<\/sup>، فإذا أصبح نق ⇐ 2نق تصبح المساحة <span class=\"pi\">π<\/span> × 4نق<sup>2<\/sup>.<br>أي 4 أمثال المساحة الأصلية.", "pts": 10, "d": 2, "s": 3, "o": ["تتضاعف", "تصبح 4 أمثالها", "تبقى كما هي", "تصبح نصفها"], "a": 1}, {"id": 109, "type": "step", "u": 3, "t": "محيط الدائرة", "q": "دائرة محيطها 44 سم (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>). لإيجاد طول نصف قطرها نبدأ بـ:", "w": "المحيط = 2 <span class=\"pi\">π<\/span> نق ⇐ <span class=\"fr\"><span class=\"nu\">44<\/span><span class=\"de\">7<\/span><\/span> × نق = 44.<br>نق = 44 × <span class=\"fr\"><span class=\"nu\">7<\/span><span class=\"de\">44<\/span><\/span> = 7 سم.", "pts": 15, "d": 2, "s": 3, "o": ["2 × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × نق = 44", "<span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × نق<sup>2<\/sup> = 44", "نق = 44 × 2", "نق = 44 ÷ 22"], "a": 0}, {"id": 110, "type": "input", "u": 3, "t": "المحيط", "q": "حديقة مستطيلة طولها 20 م وعرضها 15 م، يراد إحاطتها بسور. كم مترًا من السور نحتاج؟", "w": "السور يحيط بالحديقة ⇐ نحسب المحيط وليس المساحة.<br>2 × (20 + 15) = 70 م.", "pts": 15, "d": 2, "s": 3, "a": 70, "ans": "70 م"}, {"id": 111, "type": "essay", "u": 3, "t": "مساحة شبه المنحرف", "q": "شبه منحرف مساحته 45 سم<sup>2<\/sup>، وطولا قاعدتيه المتوازيتين 7 سم و 11 سم. أوجد ارتفاعه موضحًا خطوات الحل.", "w": "نعوّض المعطيات في القانون ونحلّ المعادلة لإيجاد المجهول.<br>هذا ربط مباشر بين المساحة وحل المعادلات.", "pts": 20, "d": 2, "s": 3, "model": ["المساحة = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × (ق<sub>1<\/sub> + ق<sub>2<\/sub>) × ع", "45 = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × (7 + 11) × ع", "45 = 9 × ع", "ع = 45 ÷ 9 = 5 سم"], "rubric": "درجة كاملة: القانون + التعويض + الحل. نصف الدرجة: القانون والتعويض فقط."}, {"id": 112, "type": "essay", "u": 3, "t": "مساحة المثلث ومتوازي الأضلاع", "q": "قارن بين مساحة مثلث ومساحة متوازي أضلاع لهما القاعدة نفسها والارتفاع نفسه، وفسّر السبب.", "w": "فهم أصل القانون أهم من حفظه.<br>المثلث نصف متوازي أضلاع له نفس القاعدة والارتفاع.", "pts": 20, "d": 2, "s": 3, "model": ["مساحة المثلث = نصف مساحة متوازي الأضلاع.", "السبب: القطر يقسم متوازي الأضلاع إلى مثلثين متطابقين، لكل منهما القاعدة والارتفاع نفساهما.", "لذلك: مساحة المثلث = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × القاعدة × الارتفاع."], "rubric": "درجة كاملة: المقارنة + التفسير. نصف الدرجة: المقارنة فقط."}, {"id": 113, "type": "mcq", "u": 3, "t": "المساحة المظللة", "q": "في الشكل: دائرة داخل مربع طول ضلعه 10 سم وتمسّ أضلاعه. مساحة المنطقة المظللة (<span class=\"pi\">π<\/span> = 3.14):", "w": "المظلل = مساحة المربع − مساحة الدائرة.<br>100 − (3.14 × 5 × 5) = 100 − 78.5 = 21.5 سم<sup>2<\/sup>.", "pts": 10, "d": 1, "s": 4, "o": ["21.5 سم<sup>2<\/sup>", "78.5 سم<sup>2<\/sup>", "100 سم<sup>2<\/sup>", "31.4 سم<sup>2<\/sup>"], "a": 0, "fig": "<svg class=\"fig\" viewBox=\"0 0 280 205\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect class=\"fs\" x=\"60\" y=\"20\" width=\"160\" height=\"160\"/><circle class=\"fw\" cx=\"140\" cy=\"100\" r=\"80\"/><rect class=\"fl\" x=\"60\" y=\"20\" width=\"160\" height=\"160\"/><circle class=\"fl\" cx=\"140\" cy=\"100\" r=\"80\"/><circle class=\"fd\" cx=\"140\" cy=\"100\" r=\"3\"/><text class=\"ft\" x=\"140\" y=\"198\" text-anchor=\"middle\">10 سم<\/text><\/svg>"}, {"id": 114, "type": "mcq", "u": 3, "t": "المجسمات", "q": "مجسم له قاعدتان دائريتان متطابقتان وسطح جانبي منحنٍ هو:", "w": "الأسطوانة لها قاعدتان دائريتان متوازيتان ومتطابقتان.<br>المخروط له قاعدة دائرية واحدة ورأس.", "pts": 10, "d": 1, "s": 4, "o": ["المخروط", "الأسطوانة", "الكرة", "المنشور"], "a": 1}, {"id": 115, "type": "mcq", "u": 3, "t": "المجسمات", "q": "عدد أوجه الهرم الرباعي (قاعدته مربعة):", "w": "قاعدة مربعة واحدة + 4 أوجه جانبية مثلثة.<br>المجموع 5 أوجه.", "pts": 10, "d": 1, "s": 4, "o": ["4", "5", "6", "8"], "a": 1}, {"id": 116, "type": "tf", "u": 3, "t": "المجسمات", "q": "المكعب حالة خاصة من شبه المكعب جميع أحرفه متساوية في الطول.", "w": "شبه المكعب أوجهه مستطيلات، والمكعب أوجهه مربعات متطابقة.<br>لذلك كل مكعب شبه مكعب، وليس العكس.", "pts": 10, "d": 1, "s": 4, "a": true}, {"id": 117, "type": "input", "u": 3, "t": "مساحة السطح", "q": "أوجد مساحة سطح مكعب طول حرفه 3 سم.", "w": "للمكعب 6 أوجه مربعة متطابقة.<br>6 × (3 × 3) = 54 سم<sup>2<\/sup>.", "pts": 15, "d": 1, "s": 4, "a": 54, "ans": "54 سم<sup>2<\/sup>"}, {"id": 118, "type": "mcq", "u": 3, "t": "مساحة السطح", "q": "مساحة سطح شبه مكعب أبعاده 5 سم ، 4 سم ، 2 سم تساوي:", "w": "مساحة السطح = 2 × (ط × ع + ط × ر + ع × ر).<br>2 × (20 + 10 + 8) = 2 × 38 = 76 سم<sup>2<\/sup> (40 هو الحجم وليس المساحة).", "pts": 10, "d": 1, "s": 4, "o": ["76 سم<sup>2<\/sup>", "40 سم<sup>2<\/sup>", "38 سم<sup>2<\/sup>", "152 سم<sup>2<\/sup>"], "a": 0}, {"id": 119, "type": "mcq", "u": 3, "t": "الشبكات", "q": "شبكة مكوّنة من 6 مربعات متطابقة تُطوى لتكوّن:", "w": "الشبكة تُظهر جميع أوجه المجسم مفرودة.<br>6 أوجه مربعة متطابقة ⇐ مكعب.", "pts": 10, "d": 2, "s": 4, "o": ["مكعبًا", "هرمًا", "أسطوانة", "منشورًا ثلاثيًا"], "a": 0}, {"id": 120, "type": "mcq", "u": 3, "t": "مساحة سطح الأسطوانة", "q": "المساحة الجانبية لأسطوانة نصف قطر قاعدتها 7 سم وارتفاعها 10 سم (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>):", "w": "المساحة الجانبية = 2 × <span class=\"pi\">π<\/span> × نق × ع.<br>2 × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 10 = 440 سم<sup>2<\/sup>.", "pts": 10, "d": 1, "s": 4, "o": ["440 سم<sup>2<\/sup>", "220 سم<sup>2<\/sup>", "154 سم<sup>2<\/sup>", "1540 سم<sup>2<\/sup>"], "a": 0}, {"id": 121, "type": "input", "u": 3, "t": "مساحة سطح الأسطوانة", "q": "أوجد مساحة السطح الكلية لأسطوانة نصف قطرها 7 سم وارتفاعها 10 سم (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>).", "w": "الجانبية = 440 ، والقاعدتان = 2 × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 7 = 308.<br>الكلية = 440 + 308 = 748 سم<sup>2<\/sup>.", "pts": 15, "d": 2, "s": 4, "a": 748, "ans": "748 سم<sup>2<\/sup>"}, {"id": 122, "type": "error", "u": 3, "t": "مساحة سطح الهرم", "q": "اكتشف الخطوة الخاطئة: مساحة سطح هرم رباعي قاعدته مربعة طول ضلعها 6 سم، وارتفاع كل وجه جانبي (مثلث) 5 سم.", "w": "الأوجه الجانبية للهرم مثلثات، ومساحة المثلث نصف القاعدة × الارتفاع.<br>نسيان النصف يضاعف المساحة الجانبية.", "pts": 15, "d": 2, "s": 4, "a": 1, "fix": "الوجه الجانبي مثلث: <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × 6 × 5 = 15 ، فمساحة السطح = 36 + 4 × 15 = 96 سم<sup>2<\/sup>.", "steps": ["مساحة القاعدة = 6 × 6 = 36 سم<sup>2<\/sup>", "مساحة الوجه الجانبي = 6 × 5 = 30 سم<sup>2<\/sup>", "مساحة السطح = 36 + 4 × 30 = 156 سم<sup>2<\/sup>"]}, {"id": 123, "type": "mcq", "u": 3, "t": "المساحة المظللة", "q": "في الشكل: مستطيل بُعداه 12 و 8، قُطع من ركنه مربع طول ضلعه 3. مساحة الشكل المتبقي:", "w": "المساحة المتبقية = مساحة المستطيل − مساحة المربع المقطوع.<br>(12 × 8) − (3 × 3) = 96 − 9 = 87 وحدة مربعة.", "pts": 10, "d": 2, "s": 4, "o": ["87", "93", "105", "84"], "a": 0, "fig": "<svg class=\"fig\" viewBox=\"0 0 345 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><path class=\"fs fl\" d=\"M70 30 H310 V190 H10 V90 H70 Z\"/><rect class=\"fdash\" x=\"10\" y=\"30\" width=\"60\" height=\"60\"/><text class=\"ft\" x=\"160\" y=\"22\" text-anchor=\"middle\">9<\/text><text class=\"ft\" x=\"160\" y=\"210\" text-anchor=\"middle\">12<\/text><text class=\"ft\" x=\"328\" y=\"115\" text-anchor=\"middle\">8<\/text><text class=\"ft\" x=\"40\" y=\"66\" text-anchor=\"middle\">3<\/text><\/svg>"}, {"id": 124, "type": "mcq", "u": 3, "t": "مساحة السطح", "q": "علبة على شكل مكعب مساحة سطحها 96 سم<sup>2<\/sup>. طول حرفها:", "w": "مساحة الوجه الواحد = 96 ÷ 6 = 16 سم<sup>2<\/sup>.<br>طول الحرف = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">16<\/span><\/span> = 4 سم.", "pts": 10, "d": 2, "s": 4, "o": ["4 سم", "16 سم", "6 سم", "8 سم"], "a": 0}, {"id": 125, "type": "tf", "u": 3, "t": "مساحة سطح الأسطوانة", "q": "المساحة الجانبية للأسطوانة = محيط القاعدة × الارتفاع.", "w": "عند فرد السطح الجانبي للأسطوانة نحصل على مستطيل.<br>طوله = محيط القاعدة (2<span class=\"pi\">π<\/span>نق) وعرضه = الارتفاع.", "pts": 10, "d": 2, "s": 4, "a": true}, {"id": 126, "type": "essay", "u": 3, "t": "مساحة سطح الأسطوانة", "q": "علبة أسطوانية نصف قطر قاعدتها 3.5 سم وارتفاعها 10 سم. يراد تغطية سطحها الجانبي بورقة ملصق. (أ) احسب مساحة الورقة. (ب) احسب مساحة السطح الكلية (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>).", "w": "الملصق يغطي الجانب فقط ⇐ المساحة الجانبية.<br>المساحة الكلية = الجانبية + مساحة القاعدتين.", "pts": 20, "d": 2, "s": 4, "model": ["(أ) الجانبية = 2 × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 3.5 × 10 = 220 سم<sup>2<\/sup>", "(ب) مساحة القاعدتين = 2 × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 3.5 × 3.5 = 77 سم<sup>2<\/sup>", "الكلية = 220 + 77 = 297 سم<sup>2<\/sup>"], "rubric": "درجة كاملة: الفرعان. نصف الدرجة: الفرع (أ) فقط."}, {"id": 127, "type": "essay", "u": 3, "t": "المساحة المركبة", "q": "شكل مكوّن من مستطيل بُعداه 14 سم و 10 سم، أُضيف إلى ضلعه الذي طوله 14 سم نصف دائرة قطرها 14 سم (كما في الشكل). أوجد مساحة الشكل كاملًا (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>).", "w": "نقسّم الشكل المركّب إلى أشكال نعرف قوانينها.<br>انتبه: القطر 14 ⇐ نصف القطر 7.", "pts": 20, "d": 2, "s": 4, "model": ["مساحة المستطيل = 14 × 10 = 140 سم<sup>2<\/sup>", "نصف القطر = 7 سم ، مساحة نصف الدائرة = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 7 = 77 سم<sup>2<\/sup>", "المساحة الكلية = 140 + 77 = 217 سم<sup>2<\/sup>"], "rubric": "درجة كاملة: الجزءان والمجموع. نصف الدرجة: جزء واحد صحيح.", "fig": "<svg class=\"fig\" viewBox=\"0 0 330 232\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><path class=\"fs fl\" d=\"M40 90 A120 120 0 0 1 280 90 V200 H40 Z\"/><line class=\"fdash\" x1=\"40\" y1=\"90\" x2=\"280\" y2=\"90\"/><text class=\"ft\" x=\"160\" y=\"222\" text-anchor=\"middle\">14 سم<\/text><text class=\"ft\" x=\"305\" y=\"150\" text-anchor=\"middle\">10 سم<\/text><\/svg>"}, {"id": 128, "type": "mcq", "u": 4, "t": "المستوى الإحداثي", "q": "النقطة <span class=\"pt\">(3 ، -4)<\/span> تقع في الربع:", "w": "الإحداثي السيني موجب (يمين) والصادي سالب (أسفل).<br>(+ ، −) ⇐ الربع الرابع.", "pts": 10, "d": 1, "s": 5, "o": ["الأول", "الثاني", "الثالث", "الرابع"], "a": 3}, {"id": 129, "type": "mcq", "u": 4, "t": "الانعكاس", "q": "صورة النقطة <span class=\"pt\">(2 ، 5)<\/span> بالانعكاس حول محور السينات:", "w": "الانعكاس حول محور السينات يُبقي س كما هي ويغيّر إشارة ص.<br>(س ، ص) ⇐ (س ، -ص).", "pts": 10, "d": 1, "s": 5, "o": ["<span class=\"pt\">(2 ، -5)<\/span>", "<span class=\"pt\">(-2 ، 5)<\/span>", "<span class=\"pt\">(-2 ، -5)<\/span>", "<span class=\"pt\">(5 ، 2)<\/span>"], "a": 0}, {"id": 130, "type": "mcq", "u": 4, "t": "الإزاحة", "q": "صورة النقطة <span class=\"pt\">(1 ، 2)<\/span> بإزاحة 3 وحدات إلى اليمين ووحدتين إلى الأعلى:", "w": "اليمين ⇐ نضيف إلى س ، الأعلى ⇐ نضيف إلى ص.<br>(1 + 3 ، 2 + 2) = (4 ، 4).", "pts": 10, "d": 1, "s": 5, "o": ["<span class=\"pt\">(4 ، 4)<\/span>", "<span class=\"pt\">(-2 ، 4)<\/span>", "<span class=\"pt\">(4 ، 0)<\/span>", "<span class=\"pt\">(3 ، 4)<\/span>"], "a": 0}, {"id": 131, "type": "tf", "u": 4, "t": "الدوران", "q": "الدوران يغيّر أطوال أضلاع الشكل وقياسات زواياه.", "w": "الانعكاس والإزاحة والدوران كلها تحويلات تحافظ على التطابق.<br>يتغيّر الموقع أو الاتجاه فقط.", "pts": 10, "d": 1, "s": 5, "a": false, "fix": "الدوران يحافظ على الأطوال وقياسات الزوايا؛ فالصورة مطابقة للشكل الأصلي."}, {"id": 132, "type": "mcq", "u": 4, "t": "الدوران", "q": "صورة النقطة <span class=\"pt\">(3 ، 1)<\/span> بدوران 180° حول نقطة الأصل:", "w": "الدوران بزاوية 180° حول الأصل يغيّر إشارتي الإحداثيين.<br>(س ، ص) ⇐ (-س ، -ص).", "pts": 10, "d": 1, "s": 5, "o": ["<span class=\"pt\">(-3 ، -1)<\/span>", "<span class=\"pt\">(3 ، -1)<\/span>", "<span class=\"pt\">(-3 ، 1)<\/span>", "<span class=\"pt\">(1 ، 3)<\/span>"], "a": 0}, {"id": 133, "type": "input", "u": 4, "t": "مقاييس النزعة المركزية", "q": "أوجد المتوسط الحسابي للبيانات: 4 ، 8 ، 6 ، 10 ، 7", "w": "المتوسط = مجموع القيم ÷ عددها.<br>(4 + 8 + 6 + 10 + 7) ÷ 5 = 35 ÷ 5 = 7.", "pts": 15, "d": 1, "s": 5, "a": 7, "ans": "7"}, {"id": 134, "type": "mcq", "u": 4, "t": "مقاييس النزعة المركزية", "q": "وسيط البيانات: 3 ، 9 ، 5 ، 7 ، 11 هو:", "w": "نرتّب البيانات أولًا: 3 ، 5 ، 7 ، 9 ، 11.<br>الوسيط هو القيمة الوسطى = 7 (وليس 5 الموجود في المنتصف قبل الترتيب).", "pts": 10, "d": 1, "s": 5, "o": ["5", "7", "9", "11"], "a": 1}, {"id": 135, "type": "mcq", "u": 4, "t": "مقاييس النزعة المركزية", "q": "منوال البيانات: 2 ، 4 ، 4 ، 5 ، 7 ، 4 ، 5 هو:", "w": "المنوال هو القيمة الأكثر تكرارًا.<br>4 تكررت 3 مرات، و 5 مرتين فقط.", "pts": 10, "d": 1, "s": 5, "o": ["2", "4", "5", "7"], "a": 1}, {"id": 136, "type": "input", "u": 4, "t": "المدى", "q": "أوجد مدى البيانات: 12 ، 5 ، 18 ، 9 ، 20", "w": "المدى = أكبر قيمة − أصغر قيمة.<br>20 − 5 = 15.", "pts": 15, "d": 1, "s": 5, "a": 15, "ans": "15"}, {"id": 137, "type": "mcq", "u": 4, "t": "المدرج التكراري", "q": "في المدرّج التكراري تكون الأعمدة:", "w": "المدرّج التكراري يمثّل فئات متصلة من البيانات العددية.<br>لذلك تتلاصق الأعمدة، بعكس التمثيل بالأعمدة للبيانات المنفصلة.", "pts": 10, "d": 2, "s": 5, "o": ["متلاصقة دون فراغات بينها", "منفصلة بفراغات متساوية", "أفقية دائمًا", "متساوية الارتفاع"], "a": 0}, {"id": 138, "type": "mcq", "u": 4, "t": "الساق والأوراق", "q": "من مخطط الساق والأوراق الآتي، وسيط البيانات هو:<table class=\"sl\"><thead><tr><th>الساق<\/th><th>الأوراق<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>2 5 7<\/td><\/tr><tr><td>2<\/td><td>0 3 3 8<\/td><\/tr><tr><td>3<\/td><td>1 4<\/td><\/tr><\/tbody><\/table><div class=\"slk\">المفتاح: 1 | 2 تعني 12<\/div>", "w": "البيانات مرتبة: 12، 15، 17، 20، 23، 23، 28، 31، 34 (9 قيم).<br>الوسيط هو القيمة الخامسة = 23.", "pts": 10, "d": 2, "s": 5, "o": ["20", "23", "28", "3"], "a": 1}, {"id": 139, "type": "tf", "u": 4, "t": "الساق والأوراق", "q": "مدى البيانات في مخطط الساق والأوراق الآتي يساوي 22.<table class=\"sl\"><thead><tr><th>الساق<\/th><th>الأوراق<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>2 5 7<\/td><\/tr><tr><td>2<\/td><td>0 3 3 8<\/td><\/tr><tr><td>3<\/td><td>1 4<\/td><\/tr><\/tbody><\/table><div class=\"slk\">المفتاح: 1 | 2 تعني 12<\/div>", "w": "أكبر قيمة 34 (الساق 3 والورقة 4) وأصغر قيمة 12.<br>المدى = 34 − 12 = 22.", "pts": 10, "d": 2, "s": 5, "a": true}, {"id": 140, "type": "error", "u": 4, "t": "مقاييس النزعة المركزية", "q": "اكتشف الخطوة الخاطئة في إيجاد المتوسط الحسابي للبيانات: 6 ، 8 ، 10 ، 12", "w": "المتوسط لا يمكن أن يكون أكبر من أكبر قيمة (12).<br>هذا اختبار سريع لاكتشاف الخطأ.", "pts": 15, "d": 2, "s": 5, "a": 2, "fix": "نقسم على عدد القيم (4): المتوسط = 36 ÷ 4 = 9.", "steps": ["المجموع = 6 + 8 + 10 + 12 = 36", "عدد القيم = 4", "المتوسط = 36 ÷ 2 = 18"]}, {"id": 141, "type": "mcq", "u": 4, "t": "مقاييس النزعة المركزية", "q": "أُضيفت القيمة 50 إلى البيانات: 4 ، 5 ، 6 ، 5. أكثر مقياس يتأثر بهذه الإضافة:", "w": "المتوسط يعتمد على مجموع كل القيم، فيتأثر بشدة بالقيمة المتطرفة.<br>المتوسط قبل: 5 ، وبعد: 70 ÷ 5 = 14.", "pts": 10, "d": 2, "s": 5, "o": ["المنوال", "الوسيط", "المتوسط الحسابي", "لا يتأثر أي مقياس"], "a": 2}, {"id": 142, "type": "mcq", "u": 4, "t": "الانعكاس", "q": "صورة النقطة ب <span class=\"pt\">(-4 ، 3)<\/span> بالانعكاس حول محور الصادات:", "w": "الانعكاس حول محور الصادات يغيّر إشارة س فقط.<br>(س ، ص) ⇐ (-س ، ص).", "pts": 10, "d": 2, "s": 5, "o": ["<span class=\"pt\">(4 ، 3)<\/span>", "<span class=\"pt\">(-4 ، -3)<\/span>", "<span class=\"pt\">(4 ، -3)<\/span>", "<span class=\"pt\">(3 ، -4)<\/span>"], "a": 0}, {"id": 143, "type": "essay", "u": 4, "t": "الإزاحة", "q": "مثلث رؤوسه أ <span class=\"pt\">(1 ، 1)<\/span> ، ب <span class=\"pt\">(4 ، 1)<\/span> ، جـ <span class=\"pt\">(1 ، 3)<\/span>. أوجد إحداثيات رؤوس صورته بإزاحة وحدتين إلى اليسار و 3 وحدات إلى الأسفل، ثم بيّن ماذا يحدث لأطوال أضلاعه.", "w": "اليسار ⇐ نطرح من س ، الأسفل ⇐ نطرح من ص.<br>الإزاحة نقل فقط دون تغيير في الشكل أو القياسات.", "pts": 20, "d": 2, "s": 5, "model": ["القاعدة: (س ، ص) ⇐ (س − 2 ، ص − 3)", "أ ⇐ <span class=\"pt\">(-1 ، -2)<\/span> ، ب ⇐ <span class=\"pt\">(2 ، -2)<\/span> ، جـ ⇐ <span class=\"pt\">(-1 ، 0)<\/span>", "أطوال الأضلاع لا تتغيّر؛ لأن الإزاحة تحافظ على الأطوال والزوايا (الصورة مطابقة للأصل)."], "rubric": "درجة كاملة: الرؤوس الثلاثة + التفسير. نصف الدرجة: رأسان صحيحان أو الرؤوس دون تفسير."}, {"id": 144, "type": "essay", "u": 4, "t": "مقاييس النزعة المركزية والمدى", "q": "درجات 8 طلاب في اختبار قصير: 7 ، 9 ، 6 ، 10 ، 8 ، 9 ، 5 ، 8. أوجد: المتوسط الحسابي ، الوسيط ، المنوال ، المدى.", "w": "عند عدد زوجي من القيم: الوسي ة.", "pts": 10, "s": 3, "o": ["حاد الزوايا", "قائم الزاوية", "منفرج الزاوية", "لا يمكن تحديده"], "a": 2}, {"id": 181, "type": "tf", "u": 3, "t": "نظرية فيثاغورث", "q": "في المثلث القائم الزاوية، الوتر هو أطول الأضلاع ويقابل الزاوية القائمة.", "w": "الزاوية القائمة هي أكبر زاوية في المثلث القائم.<br>والضلع المقابل لأكبر زاوية هو أطول ضلع.", "pts": 10, "s": 3, "a": true}, {"id": 182, "type": "mcq", "u": 3, "t": "تطبيقات فيثاغورث", "q": "سُلّم طوله 10 م يستند إلى حائط رأسي، وبُعد قاعدته عن الحائط 6 م. ارتفاع النقطة التي يلامس فيها السلم الحائط:", "w": "السلم هو الوتر: (الارتفاع)<sup>2<\/sup> = 10<sup>2<\/sup> − 6<sup>2<\/sup> = 64.<br>الارتفاع = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">64<\/span><\/span> = 8 م.", "pts": 10, "s": 3, "o": ["8 م", "4 م", "16 م", "12 م"], "a": 0}, {"id": 183, "type": "input", "u": 3, "t": "تطبيقات فيثاغورث", "q": "مستطيل طوله 12 سم وعرضه 5 سم. أوجد طول قطره.", "w": "القطر وتر لمثلث قائم ضلعاه الطول والعرض.<br><span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">12<sup>2<\/sup> + 5<sup>2<\/sup><\/span><\/span> = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">169<\/span><\/span> = 13 سم.", "pts": 15, "s": 3, "a": 13, "ans": "13 سم"}, {"id": 184, "type": "error", "u": 3, "t": "نظرية فيثاغورث", "q": "اكتشف الخطوة الخاطئة: طول الوتر في مثلث قائم ضلعا القائمة فيه 9 و 12.", "w": "الوتر يجب أن يكون أطول من كل ضلع، لكن ليس أطول من مجموعهما (21).<br>112.5 مستحيل، وهذا يكشف الخطأ.", "pts": 15, "s": 3, "a": 2, "fix": "نأخذ الجذر التربيعي وليس القسمة على 2: الوتر = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">225<\/span><\/span> = 15.", "steps": ["(الوتر)<sup>2<\/sup> = 9<sup>2<\/sup> + 12<sup>2<\/sup>", "= 81 + 144 = 225", "الوتر = 225 ÷ 2 = 112.5"]}, {"id": 185, "type": "mcq", "u": 3, "t": "مفهوم التطابق", "q": "يتطابق مضلعان إذا:", "w": "التطابق يعني: نفس الشكل ونفس القياسات تمامًا.<br>إذا وُضع أحدهما فوق الآخر انطبق عليه.", "pts": 10, "s": 3, "o": ["تطابقت أضلاعهما المتناظرة وزواياهما المتناظرة", "تساوى عدد أضلاعهما فقط", "تطابقت زواياهما فقط", "تساوى محيطاهما فقط"], "a": 0}, {"id": 186, "type": "tf", "u": 3, "t": "مفهوم التطابق", "q": "إذا تطابق مثلثان فإن محيطيهما متساويان، ومساحتيهما متساويتان.", "w": "الأضلاع المتناظرة متساوية ⇐ المحيطان متساويان.<br>والشكلان منطبقان ⇐ المساحتان متساويتان.", "pts": 10, "s": 3, "a": true}, {"id": 187, "type": "step", "u": 3, "t": "عكس نظرية فيثاغورث", "q": "مثلث أطوال أضلاعه 8 ، 15 ، 17. للتحقق هل هو قائم الزاوية نقوم بـ:", "w": "نقارن مربع الضلع الأطول بمجموع مربعي الضلعين الآخرين.<br>289 = 64 + 225 ⇐ المثلث قائم الزاوية.", "pts": 15, "s": 3, "o": ["مقارنة 17<sup>2<\/sup> مع 8<sup>2<\/sup> + 15<sup>2<\/sup>", "مقارنة 8<sup>2<\/sup> مع 15<sup>2<\/sup> + 17<sup>2<\/sup>", "مقارنة 8 + 15 مع 17", "قسمة 17 على 2"], "a": 0}, {"id": 188, "type": "mcq", "u": 3, "t": "تطبيقات فيثاغورث", "q": "ساحة مستطيلة بُعداها 40 م و 30 م. مشى أحمد قطريًا من ركن إلى الركن المقابل بدل السير على ضلعين. كم مترًا وفّر؟", "w": "القطر = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">40<sup>2<\/sup> + 30<sup>2<\/sup><\/span><\/span> = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">2500<\/span><\/span> = 50 م.<br>على الضلعين: 40 + 30 = 70 م ⇐ وفّر 70 − 50 = 20 م.", "pts": 10, "s": 3, "o": ["20 م", "50 م", "70 م", "10 م"], "a": 0}, {"id": 189, "type": "essay", "u": 3, "t": "نظرية فيثاغورث", "q": "أ ب جـ د مستطيل فيه: أ ب = 8 سم ، ب جـ = 6 سم. (أ) أوجد طول القطر أ جـ. (ب) أوجد محيط المثلث أ ب جـ.", "w": "زوايا المستطيل قوائم، فالقطر يكوّن مثلثًا قائمًا.<br>نستخدم فيثاغورث ثم نجمع الأضلاع للمحيط.", "pts": 20, "s": 3, "model": ["(أ) المثلث أ ب جـ قائم في ب: (أ جـ)<sup>2<\/sup> = 8<sup>2<\/sup> + 6<sup>2<\/sup> = 100 ⇐ أ جـ = 10 سم", "(ب) محيط المثلث = 8 + 6 + 10 = 24 سم"], "rubric": "درجة كاملة: الفرعان مع ذكر القائمة. نصف الدرجة: الفرع (أ) فقط."}, {"id": 190, "type": "essay", "u": 3, "t": "عكس نظرية فيثاغورث", "q": "بيّن هل المثلث الذي أطوال أضلاعه 7 سم ، 24 سم ، 25 سم قائم الزاوية؟ وإذا كان كذلك فحدّد الوتر، والضلعين المحيطين بالزاوية القائمة.", "w": "عكس نظرية فيثاغورث أداة للتحقق من القائمة.<br>الزاوية القائمة تقابل الوتر دائمًا.", "pts": 20, "s": 3, "model": ["25<sup>2<\/sup> = 625 ، 7<sup>2<\/sup> + 24<sup>2<\/sup> = 49 + 576 = 625", "بما أن مربع الضلع الأطول = مجموع مربعي الضلعين الآخرين ⇐ المثلث قائم الزاوية (عكس فيثاغورث).", "الوتر = 25 سم ، والزاوية القائمة محصورة بين الضلعين 7 سم و 24 سم."], "rubric": "درجة كاملة: الحساب + الحكم + التحديد. نصف الدرجة: الحساب والحكم فقط."}, {"id": 191, "type": "mcq", "u": 3, "t": "حالات التطابق", "q": "حالة التطابق التي يُرمز إليها (ض . ض . ض) تعني:", "w": "ض . ض . ض = ضلع ، ضلع ، ضلع.<br>إذا تطابقت الأضلاع الثلاثة تطابقت الزوايا تلقائيًا.", "pts": 10, "s": 4, "o": ["تطابق الأضلاع الثلاثة المتناظرة", "تطابق ضلعين وزاوية", "تطابق الزوايا الثلاث", "تطابق زاويتين وضلع"], "a": 0}, {"id": 192, "type": "mcq", "u": 3, "t": "حالات التطابق", "q": "في حالة التطابق (ض . ز . ض) يجب أن تكون الزاوية:", "w": "الزاوية المحدّدة بالضلعين (بينهما) هي التي تحدّد شكل المثلث.<br>زاوية غير محصورة لا تضمن التطابق.", "pts": 10, "s": 4, "o": ["محصورة بين الضلعين", "مقابلة لأحد الضلعين", "قائمة دائمًا", "أي زاوية في المثلث"], "a": 0}, {"id": 193, "type": "mcq", "u": 3, "t": "حالات التطابق", "q": "مثلثان: في كل منهما ضلعان طولاهما 5 سم و 7 سم، والزاوية المحصورة بينهما 40°. المثلثان متطابقان بحالة:", "w": "المعطى: ضلعان والزاوية المحصورة بينهما.<br>إذن: ضلع ، زاوية ، ضلع.", "pts": 10, "s": 4, "o": ["ض . ض . ض", "ض . ز . ض", "ز . ض . ز", "غير متطابقين"], "a": 1}, {"id": 194, "type": "tf", "u": 3, "t": "حالات التطابق", "q": "تطابق الزوايا الثلاث المتناظرة في مثلثين يكفي لتطابقهما.", "w": "مثال: مثلثان متطابقا الأضلاع، طول ضلع الأول 2 سم والثاني 5 سم، وزواياهما كلها 60°.<br>لكنهما غير متطابقين.", "pts": 10, "s": 4, "a": false, "fix": "تساوي الزوايا لا يكفي؛ فقد يكون أحدهما تكبيرًا للآخر (متشابهان وليسا متطابقين). يلزم ضلع واحد على الأقل."}, {"id": 195, "type": "tf", "u": 3, "t": "حالات التطابق", "q": "القطر في متوازي الأضلاع يقسمه إلى مثلثين متطابقين.", "w": "الضلعان المتقابلان متساويان، والقطر ضلع مشترك.<br>إذن المثلثان متطابقان بحالة (ض . ض . ض).", "pts": 10, "s": 4, "a": true}, {"id": 196, "type": "mcq", "u": 3, "t": "حالات التطابق", "q": "حالة التطابق (ز . ض . ز) تعني تطابق زاويتين والضلع:", "w": "ز . ض . ز = زاويتان وضلع واصل بين رأسيهما.<br>الضلع يقع بين الزاويتين المعلومتين.", "pts": 10, "s": 4, "o": ["الواصل بين رأسيهما", "المقابل لإحداهما", "الأطول في المثلث", "أي ضلع"], "a": 0}, {"id": 197, "type": "input", "u": 3, "t": "حجم الأسطوانة", "q": "أوجد حجم أسطوانة دائرية قائمة نصف قطر قاعدتها 7 سم وارتفاعها 10 سم (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>).", "w": "الحجم = <span class=\"pi\">π<\/span> × نق<sup>2<\/sup> × ع.<br><span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 7 × 10 = 154 × 10 = 1540 سم<sup>3<\/sup>.", "pts": 15, "s": 4, "a": 1540, "ans": "1540 سم<sup>3<\/sup>"}, {"id": 198, "type": "mcq", "u": 3, "t": "حجم الأسطوانة", "q": "حجم أسطوانة نصف قطر قاعدتها 3 سم وارتفاعها 10 سم (<span class=\"pi\">π<\/span> = 3.14):", "w": "3.14 × 3<sup>2<\/sup> × 10 = 3.14 × 90 = 282.6 سم<sup>3<\/sup>.<br>94.2 ناتج الخطأ بضرب نق في 3 بدل تربيعه.", "pts": 10, "s": 4, "o": ["282.6 سم<sup>3<\/sup>", "94.2 سم<sup>3<\/sup>", "188.4 سم<sup>3<\/sup>", "2826 سم<sup>3<\/sup>"], "a": 0}, {"id": 199, "type": "mcq", "u": 3, "t": "حجم المخروط", "q": "حجم المخروط الدائري القائم يساوي ___ حجم الأسطوانة المشتركة معه في القاعدة والارتفاع.", "w": "حجم المخروط = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">3<\/span><\/span> × <span class=\"pi\">π<\/span> × نق<sup>2<\/sup> × ع.<br>ثلاثة مخاريط تملأ أسطوانة لها القاعدة والارتفاع نفساهما.", "pts": 10, "s": 4, "o": ["<span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">3<\/span><\/span>", "<span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span>", "3 أمثال", "نفس"], "a": 0}, {"id": 200, "type": "input", "u": 3, "t": "حجم المخروط", "q": "أوجد حجم مخروط دائري قائم نصف قطر قاعدته 7 سم وارتفاعه 12 سم (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>).", "w": "<span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">3<\/span><\/span> × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 7 × 12 = 154 × 4 = 616 سم<sup>3<\/sup>.<br>نختصر: 12 ÷ 3 = 4 و 49 ÷ 7 = 7.", "pts": 15, "s": 4, "a": 616, "ans": "616 سم<sup>3<\/sup>"}, {"id": 201, "type": "mcq", "u": 3, "t": "حجم المخروط", "q": "حجم مخروط دائري قائم طول قطر قاعدته 12 سم وارتفاعه 10 سم بدلالة <span class=\"pi\">π<\/span>:", "w": "القطر 12 ⇐ نق = 6: <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">3<\/span><\/span> × <span class=\"pi\">π<\/span> × 36 × 10 = 120<span class=\"pi\">π<\/span>.<br>480<span class=\"pi\">π<\/span> ناتج الخطأ باستخدام القطر بدل نصف القطر.", "pts": 10, "s": 4, "o": ["120<span class=\"pi\">π<\/span> سم<sup>3<\/sup>", "480<span class=\"pi\">π<\/span> سم<sup>3<\/sup>", "360<span class=\"pi\">π<\/span> سم<sup>3<\/sup>", "40<span class=\"pi\">π<\/span> سم<sup>3<\/sup>"], "a": 0}, {"id": 202, "type": "error", "u": 3, "t": "حجم الأسطوانة", "q": "اكتشف الخطوة الخاطئة: حجم أسطوانة طول قطر قاعدتها 6 سم وارتفاعها 5 سم (<span class=\"pi\">π<\/span> = 3.14)", "w": "اقرأ المعطى بدقة: «قطر» أم «نصف قطر».<br>استخدام القطر في القانون يضاعف الحجم 4 مرات.", "pts": 15, "s": 4, "a": 0, "fix": "نق = نصف القطر = 3 سم، إذن الحجم = 3.14 × 9 × 5 = 141.3 سم<sup>3<\/sup>.", "steps": ["نق = 6 سم", "الحجم = 3.14 × 36 × 5", "= 565.2 سم<sup>3<\/sup>"]}, {"id": 203, "type": "mcq", "u": 3, "t": "حجم المخروط", "q": "أسطوانة ومخروط لهما القاعدة نفسها والارتفاع نفسه، وحجم الأسطوانة 90 سم<sup>3<\/sup>. حجم المخروط:", "w": "حجم المخروط = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">3<\/span><\/span> حجم الأسطوانة.<br>90 ÷ 3 = 30 سم<sup>3<\/sup>.", "pts": 10, "s": 4, "o": ["30 سم<sup>3<\/sup>", "270 سم<sup>3<\/sup>", "45 سم<sup>3<\/sup>", "90 سم<sup>3<\/sup>"], "a": 0}, {"id": 204, "type": "essay", "u": 3, "t": "إثبات التطابق", "q": "في الشكل: أ ب = أ د ، جـ ب = جـ د. (أ) أثبت أن المثلثين أ ب جـ ، أ د جـ متطابقان. (ب) استنتج أن الزاوية (ب أ جـ) = الزاوية (د أ جـ).", "w": "اكتب كل عنصر مع سببه (معطى / مشترك / بالبرهان).<br>بعد إثبات التطابق نستنتج تساوي العناصر المتناظرة.", "pts": 20, "s": 4, "model": ["(أ) في المثلثين أ ب جـ ، أ د جـ:", "أ ب = أ د (معطى) ، جـ ب = جـ د (معطى) ، أ جـ ضلع مشترك", "إذن المثلثان متطابقان بحالة (ض . ض . ض).", "(ب) من التطابق: الزاويتان المتناظرتان متساويتان ⇐ (ب أ جـ) = (د أ جـ)."], "rubric": "درجة كاملة: العناصر الثلاثة + الحالة + الاستنتاج. نصف الدرجة: إثبات التطابق دون الاستنتاج.", "fig": "<svg class=\"fig\" viewBox=\"0 0 320 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon class=\"fl\" points=\"160,20 250,90 160,220 70,90\"/><line class=\"fdash\" x1=\"160\" y1=\"20\" x2=\"160\" y2=\"220\"/><text class=\"ft\" x=\"160\" y=\"14\" text-anchor=\"middle\">أ<\/text><text class=\"ft\" x=\"266\" y=\"95\" text-anchor=\"middle\">ب<\/text><text class=\"ft\" x=\"160\" y=\"240\" text-anchor=\"middle\">جـ<\/text><text class=\"ft\" x=\"52\" y=\"95\" text-anchor=\"middle\">د<\/text><line class=\"fmk\" x1=\"200\" y1=\"50\" x2=\"210\" y2=\"62\"/><line class=\"fmk\" x1=\"110\" y1=\"50\" x2=\"120\" y2=\"62\" transform=\"rotate(-80 115 56)\"/><line class=\"fmk2\" x1=\"200\" y1=\"150\" x2=\"214\" y2=\"160\"/><line class=\"fmk2\" x1=\"204\" y1=\"146\" x2=\"218\" y2=\"156\"/><line class=\"fmk2\" x1=\"106\" y1=\"160\" x2=\"120\" y2=\"150\"/><line class=\"fmk2\" x1=\"102\" y1=\"156\" x2=\"116\" y2=\"146\"/><\/svg>"}, {"id": 205, "type": "essay", "u": 3, "t": "إثبات التطابق", "q": "في الشكل: القطعتان أ جـ ، ب د متقاطعتان في م، حيث م منتصف كل منهما. أثبت أن المثلثين أ م ب ، جـ م د متطابقان، واذكر حالة التطابق.", "w": "المنتصف يعطي ضلعين متساويين، والتقاطع يعطي زاويتين متقابلتين بالرأس.<br>والزاوية محصورة بين الضلعين ⇐ ض . ز . ض.", "pts": 20, "s": 4, "model": ["أ م = جـ م (م منتصف أ جـ)", "ب م = د م (م منتصف ب د)", "الزاوية (أ م ب) = الزاوية (جـ م د) (متقابلتان بالرأس)", "إذن المثلثان متطابقان بحالة (ض . ز . ض)."], "rubric": "درجة كاملة: العناصر الثلاثة بأسبابها + الحالة. نصف الدرجة: عنصران صحيحان.", "fig": "<svg class=\"fig\" viewBox=\"0 0 320 215\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line class=\"fl\" x1=\"40\" y1=\"30\" x2=\"280\" y2=\"190\"/><line class=\"fl\" x1=\"40\" y1=\"190\" x2=\"280\" y2=\"30\"/><line class=\"fl\" x1=\"40\" y1=\"30\" x2=\"40\" y2=\"190\"/><line class=\"fl\" x1=\"280\" y1=\"30\" x2=\"280\" y2=\"190\"/><circle class=\"fd\" cx=\"160\" cy=\"110\" r=\"4\"/><text class=\"ft\" x=\"28\" y=\"26\" text-anchor=\"middle\">أ<\/text><text class=\"ft\" x=\"28\" y=\"205\" text-anchor=\"middle\">ب<\/text><text class=\"ft\" x=\"294\" y=\"205\" text-anchor=\"middle\">جـ<\/text><text class=\"ft\" x=\"294\" y=\"26\" text-anchor=\"middle\">د<\/text><text class=\"ft hi\" x=\"160\" y=\"140\" text-anchor=\"middle\">م<\/text><\/svg>"}, {"id": 206, "type": "essay", "u": 3, "t": "حجم الأسطوانة", "q": "خزان ماء أسطواني نصف قطر قاعدته 1.4 م وارتفاعه 2 م. (أ) أوجد حجمه بالمتر المكعب (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>). (ب) كم لترًا يتّسع؟ علمًا بأن 1 م<sup>3<\/sup> = 1000 لتر.", "w": "نختصر 1.4 مع 7: 1.4 ÷ 7 = 0.2.<br>التحويل من م<sup>3<\/sup> إلى لتر بالضرب في 1000.", "pts": 20, "s": 4, "model": ["(أ) الحجم = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 1.4 × 1.4 × 2 = 22 × 0.2 × 1.4 × 2 = 12.32 م<sup>3<\/sup>", "(ب) السعة = 12.32 × 1000 = 12320 لترًا"], "rubric": "درجة كاملة: الفرعان. نصف الدرجة: الفرع (أ) فقط."}, {"id": 207, "type": "input", "u": 4, "t": "التناسب", "q": "حلّ التناسب: <span class=\"fr\"><span class=\"nu\">س<\/span><span class=\"de\">12<\/span><\/span> = <span class=\"fr\"><span class=\"nu\">3<\/span><span class=\"de\">4<\/span><\/span>", "w": "حاصل ضرب الطرفين = حاصل ضرب الوسطين: 4 × س = 12 × 3.<br>4س = 36 ⇐ س = 9.", "pts": 15, "s": 5, "a": 9, "ans": "س = 9"}, {"id": 208, "type": "mcq", "u": 4, "t": "التناسب", "q": "في تجربة لصناعة الصابون كانت نسبة هيدروكسيد البوتاسيوم إلى الزيت 1 : 5. إذا كانت كمية الهيدروكسيد 24.5 مل، فإن كمية الزيت:", "w": "<span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">5<\/span><\/span> = <span class=\"fr\"><span class=\"nu\">24.5<\/span><span class=\"de\">س<\/span><\/span> ⇐ س = 24.5 × 5 = 122.5 مل.<br>كمية الزيت 5 أمثال كمية الهيدروكسيد.", "pts": 10, "s": 5, "o": ["122.5 مل", "4.9 مل", "29.5 مل", "120 مل"], "a": 0}, {"id": 209, "type": "mcq", "u": 4, "t": "التناسب العكسي", "q": "12 عاملًا ينجزون عملًا في 10 ساعات. كم عاملًا (بالكفاءة نفسها) ينجزون العمل نفسه في 8 ساعات؟", "w": "تناسب عكسي: عدد العمال × الزمن = ثابت.<br>12 × 10 = 120 ⇐ 120 ÷ 8 = 15 عاملًا.", "pts": 10, "s": 5, "o": ["15", "9.6", "14", "10"], "a": 0}, {"id": 210, "type": "tf", "u": 4, "t": "التناسب العكسي", "q": "إذا زاد عدد العمال قلّ زمن إنجاز العمل؛ فهذا تناسب طردي.", "w": "الطردي: تزيدان معًا أو تنقصان معًا (النسبة ثابتة).<br>العكسي: حاصل الضرب ثابت.", "pts": 10, "s": 5, "a": false, "fix": "زيادة كمية يقابلها نقصان الأخرى ⇐ تناسب عكسي."}, {"id": 211, "type": "input", "u": 4, "t": "النسبة المئوية", "q": "أوجد النسبة المئوية التي يمثّلها العدد 30 من 120.", "w": "<span class=\"fr\"><span class=\"nu\">30<\/span><span class=\"de\">120<\/span><\/span> × 100% = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">4<\/span><\/span> × 100% = 25%.<br>الجزء ÷ الكل × 100.", "pts": 15, "s": 5, "a": 25, "ans": "25%"}, {"id": 212, "type": "input", "u": 4, "t": "النسبة المئوية", "q": "ما العدد الذي يمثّل 45% من 80؟", "w": "<span class=\"fr\"><span class=\"nu\">45<\/span><span class=\"de\">100<\/span><\/span> × 80 = 0.45 × 80 = 36.<br>«من» تعني الضرب.", "pts": 15, "s": 5, "a": 36, "ans": "36"}, {"id": 213, "type": "mcq", "u": 4, "t": "النسبة المئوية", "q": "عدد ما 40% منه يساوي 52. هذا العدد هو:", "w": "0.4 × س = 52 ⇐ س = 52 ÷ 0.4 = 130.<br>تحقق: 40% من 130 = 52 ✓", "pts": 10, "s": 5, "o": ["130", "20.8", "92", "208"], "a": 0}, {"id": 214, "type": "mcq", "u": 4, "t": "النسبة المئوية", "q": "جهاز سعره الأصلي 120 دينارًا، عليه تخفيض بنسبة 25%. سعره بعد التخفيض:", "w": "مقدار التخفيض = 25% × 120 = 30 دينارًا.<br>السعر الجديد = 120 − 30 = 90 (أو 75% × 120).", "pts": 10, "s": 5, "o": ["90 دينارًا", "30 دينارًا", "95 دينارًا", "145 دينارًا"], "a": 0}, {"id": 215, "type": "mcq", "u": 4, "t": "النسبة المئوية للتغيّر", "q": "باعت مكتبة 500 كتاب في فبراير، و 400 كتاب في مارس. نوع التغيّر ونسبته:", "w": "مقدار التغيّر = 500 − 400 = 100 (نقصان).<br>النسبة = <span class=\"fr\"><span class=\"nu\">100<\/span><span class=\"de\">500<\/span><\/span> × 100% = 20% — نقسم دائمًا على القيمة الأصلية.", "pts": 10, "s": 5, "o": ["نقصان 20%", "زيادة 20%", "نقصان 25%", "نقصان 100%"], "a": 0}, {"id": 216, "type": "error", "u": 4, "t": "النسبة المئوية للتغيّر", "q": "اكتشف الخطوة الخاطئة: عدد سكان مدينة 50000 نسمة، زاد بنسبة 8%. كم أصبح العدد؟", "w": "زيادة ⇐ نجمع ، نقصان ⇐ نطرح.<br>أو مباشرة: 108% × 50000 = 54000.", "pts": 15, "s": 5, "a": 1, "fix": "الزيادة تُضاف: العدد الجديد = 50000 + 4000 = 54000 نسمة.", "steps": ["مقدار الزيادة = 50000 × <span class=\"fr\"><span class=\"nu\">8<\/span><span class=\"de\">100<\/span><\/span> = 4000", "العدد الجديد = 50000 − 4000 = 46000"]}, {"id": 217, "type": "mcq", "u": 4, "t": "الانعكاس في نقطة", "q": "صورة النقطة <span class=\"pt\">(-2 ، 4)<\/span> بالانعكاس في نقطة الأصل:", "w": "الانعكاس في نقطة الأصل: (س ، ص) ⇐ (-س ، -ص).<br>نأخذ المعكوس الجمعي لكل إحداثي.", "pts": 10, "s": 5, "o": ["<span class=\"pt\">(2 ، -4)<\/span>", "<span class=\"pt\">(-2 ، -4)<\/span>", "<span class=\"pt\">(2 ، 4)<\/span>", "<span class=\"pt\">(4 ، -2)<\/span>"], "a": 0}, {"id": 218, "type": "mcq", "u": 4, "t": "الانعكاس في محور", "q": "صورة النقطة <span class=\"pt\">(5 ، -3)<\/span> بالانعكاس في محور الصادات:", "w": "الانعكاس في محور الصادات: (س ، ص) ⇐ (-س ، ص).<br>الإحداثي الصادي يبقى كما هو.", "pts": 10, "s": 5, "o": ["<span class=\"pt\">(-5 ، -3)<\/span>", "<span class=\"pt\">(5 ، 3)<\/span>", "<span class=\"pt\">(-5 ، 3)<\/span>", "<span class=\"pt\">(-3 ، 5)<\/span>"], "a": 0}, {"id": 219, "type": "mcq", "u": 4, "t": "الإزاحة", "q": "صورة النقطة <span class=\"pt\">(-3 ، 5)<\/span> بإزاحة 4 وحدات إلى اليمين ثم وحدتين إلى الأسفل:", "w": "اليمين ⇐ س + 4 ، الأسفل ⇐ ص − 2.<br>(-3 + 4 ، 5 − 2) = (1 ، 3).", "pts": 10, "s": 5, "o": ["<span class=\"pt\">(1 ، 3)<\/span>", "<span class=\"pt\">(-7 ، 3)<\/span>", "<span class=\"pt\">(1 ، 7)<\/span>", "<span class=\"pt\">(-7 ، 7)<\/span>"], "a": 0}, {"id": 220, "type": "tf", "u": 4, "t": "الإزاحة", "q": "الإزاحة تحافظ على قياسات الأطوال والزوايا والتوازي.", "w": "الإزاحة تنقل كل نقاط الشكل المسافة نفسها وفي الاتجاه نفسه.<br>الصورة مطابقة للأصل تمامًا.", "pts": 10, "s": 5, "a": true}, {"id": 221, "type": "mcq", "u": 4, "t": "التناظر حول نقطة", "q": "أي الأشكال الآتية متناظر حول نقطة تقاطع قطريه؟", "w": "قطرا متوازي الأضلاع ينصّف كل منهما الآخر.<br>لذلك صورته بالانعكاس في نقطة تقاطع القطرين هي الشكل نفسه.", "pts": 10, "s": 5, "o": ["الطائرة الورقية", "متوازي الأضلاع", "شبه المنحرف", "المثلث"], "a": 1}, {"id": 222, "type": "essay", "u": 4, "t": "النسبة المئوية", "q": "علبة عصير سعتها الأصلية 2.5 لتر، وعليها عرض «زيادة مجانية 20%». (أ) أوجد السعة الزائدة. (ب) أوجد سعة علبة العرض.", "w": "النسبة المئوية تُحسب من الكمية الأصلية.<br>السعة الجديدة = الأصلية + الزيادة = 120% من الأصلية.", "pts": 20, "s": 5, "model": ["(أ) السعة الزائدة = 20% × 2.5 = <span class=\"fr\"><span class=\"nu\">20<\/span><span class=\"de\">100<\/span><\/span> × 2.5 = 0.5 لتر", "(ب) سعة علبة العرض = 2.5 + 0.5 = 3 لترات"], "rubric": "درجة كاملة: الفرعان. نصف الدرجة: الفرع (أ) فقط."}, {"id": 223, "type": "essay", "u": 4, "t": "الانعكاس والإزاحة", "q": "المثلث س ص ع رؤوسه: س <span class=\"pt\">(1 ، 2)<\/span> ، ص <span class=\"pt\">(3 ، 5)<\/span> ، ع <span class=\"pt\">(4 ، 1)<\/span>. (أ) أوجد صورته بالانعكاس في نقطة الأصل. (ب) أوجد صورة المثلث الأصلي بالإزاحة: (س ، ص) ⇐ (س + 2 ، ص − 1).", "w": "الانعكاس في الأصل: نغيّر الإشارتين.<br>الإزاحة: نطبّق القاعدة على كل رأس.", "pts": 20, "s": 5, "model": ["(أ) س′ <span class=\"pt\">(-1 ، -2)<\/span> ، ص′ <span class=\"pt\">(-3 ، -5)<\/span> ، ع′ <span class=\"pt\">(-4 ، -1)<\/span>", "(ب) س″ <span class=\"pt\">(3 ، 1)<\/span> ، ص″ <span class=\"pt\">(5 ، 4)<\/span> ، ع″ <span class=\"pt\">(6 ، 0)<\/span>"], "rubric": "درجة كاملة: الفرعان (6 نقاط). نصف الدرجة: فرع واحد كامل."}]}};
</script>
<script>
(function(){
"use strict";
/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const AR = '٠١٢٣٤٥٦٧٨٩';
function localize(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const p = n.parentNode; if (!p || p.closest && p.closest('.nolocal')) return;

const Snd = {

  init(){ if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ this.ctx = null; } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, t0, dur, type='sine', g=0.18, f2){
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), gn = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, c.currentTime + t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + t0 + dur);
    gn.gain.setValueAtTime(0.0001, c.currentTime + t0);
    gn.gain.exponentialRampToValueAtTime(g, c.currentTime + t0 + 0.012);
    gn.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
    o.connect(gn); gn.connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.03);
  },
  play(name){
    if (!this.on) return; this.init(); if (!this.ctx) return;

      case 'select': this.tone(880, 0, .06, 'triangle', .1); this.tone(1320, .04, .06, 'triangle', .07); break;

function buildPool(){
  const m = mode(), bank = C.banks[S.grade];
  let items;
  if (m.duel){
    let src = bank.filter(q => S.duelPool === 'all' || String(q.d) === String(S.duelPool));
    const per = Math.ceil(S.duelCount / 3); items = [];
    [2,3,4].forEach(u => { const us = shuffle(src.filter(q => q.u === u)).slice(0, per); us.sort((a,b) => (a.d||0)-(b.d||0)); items.push(...us); });
    items = items.slice(0, S.duelCount);
  } else {
    items = bank.filter(q => q[m.filter.k] === m.filter.v);
  }
  const ord = {2:0,3:1,4:2};
  return items.map((q,i) => ({q, i})).sort((a,b) => ord[a.q.u]-ord[b.q.u] || a.i-b.i).map(x => x.q);
}

  const bd = el('div', 'card board'); bd.id = 'board';
  side.append(co, tm, bd);
  renderBoard(); updTimers();
  $('#tPause').onclick = togglePause; $('#tToggle').onclick = toggleTimers; $('#tSkip').onclick = skipQ;
  $('#tAdd').onclick = () => { S.q += 30; S.qMax = Math.max(S.qMax, S.q); updTimers(); Snd.play('click'); };

  syncPauseBtn();

}
