:root{
  --bg:#061318; --bg2:#0b2029; --card:#0e2833; --line:#1d4352; --ink:#e9f8fb; --mut:#8db3bd; --acc:#22d3e6; --acc2:#5eead4; --onacc:#02161b; --glow1:rgba(34,211,230,.20); --glow2:rgba(30,90,110,.45);
  --ok:#2ee59d; --ok2:#0f5c43; --bad:#ff6b6b; --bad2:#5c1f27; --warn:#ffc857;
  --r:18px; --fs:1;
  --t1:#22d3ee; --t2:#ff6b9a; --t3:#ffc857; --t4:#7cf29a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--fs))}
@media (min-width:1400px){html{font-size:calc(18px * var(--fs))}}
@media (min-width:1800px){html{font-size:calc(21px * var(--fs))}}
body{font-family:"AB",Arial,Tahoma,sans-serif;font-weight:700;color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.7;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 500px at 85% -10%, var(--glow1), transparent 60%),
  radial-gradient(800px 600px at -10% 110%, var(--glow2), transparent 60%),
  var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.07;background-image:
  linear-gradient(var(--ink) 1px, transparent 1px),linear-gradient(90deg, var(--ink) 1px, transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 50% 30%, #000 0, transparent 75%)}
button{font-family:inherit;font-weight:700;cursor:pointer;border:0;color:inherit;background:none}
input,textarea,select{font-family:inherit;font-weight:700}
.hd{font-family:"HD","AB",Arial,sans-serif}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.logo{width:48px;height:48px;flex:0 0 auto;display:grid;place-items:center;background:#fff;overflow:hidden;box-shadow:0 0 0 2px var(--acc),0 0 18px -4px var(--acc)}
.logo img{width:100%;height:100%;object-fit:contain}
.logo.tile{border-radius:12px;padding:3px}
.logo.circle{border-radius:50%}
.brand-txt{line-height:1.25;min-width:0}
.brand-txt b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{display:block;font-size:.7rem;color:var(--mut);letter-spacing:.04em;direction:ltr;text-align:right}
.tb-spacer{flex:1}
.tb-btns{display:flex;gap:.4rem}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:1.05rem;transition:.2s}
.ib:hover{border-color:var(--acc);box-shadow:0 0 14px -4px var(--acc)}
.ib.off{opacity:.55}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- generic ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:1.2rem 1rem 3rem}
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,var(--acc) 8%),var(--card));border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px -18px #000}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.4rem;border-radius:14px;font-size:1.05rem;transition:.18s;border:1px solid transparent}
.btn-main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);box-shadow:0 8px 24px -10px var(--acc)}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 12px 28px -10px var(--acc)}
.btn-main:disabled{opacity:.4;transform:none;cursor:not-allowed}
.btn-ghost{background:var(--card);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .7rem;border-radius:99px;font-size:.8rem;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.kicker{color:var(--acc);font-size:.85rem;letter-spacing:.02em}
h2.sec{font-size:1.25rem;margin:1.6rem 0 .8rem;display:flex;align-items:center;gap:.6rem}
h2.sec .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--acc);color:var(--onacc);font-size:1rem}

/* ---------- setup ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center;padding:1.6rem;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--glow1),transparent 70%)}
.hero .biglogo{width:120px;height:120px}
.hero h1{font-size:clamp(1.6rem,3.6vw,2.6rem);line-height:1.25}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin-top:.4rem;font-size:1rem}
.hero .tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.grid{display:grid;gap:.9rem}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.pick{position:relative;text-align:right;padding:1.1rem 1.1rem 1rem;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);transition:.2s;display:flex;flex-direction:column;gap:.35rem;min-height:100%}
.pick:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line));transform:translateY(-2px)}
.pick.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent),0 14px 30px -18px var(--acc);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 14%,var(--card)),var(--card))}
.pick .ico{font-size:1.7rem;line-height:1}
.pick b{font-size:1.12rem}
.pick span{color:var(--mut);font-size:.85rem;line-height:1.55}
.pick .min{position:absolute;top:.8rem;left:.8rem}
.pick .big{font-size:2.6rem;line-height:1;color:var(--acc)}
.agenda{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;padding:1rem}
.ag{flex:1 1 140px;padding:.6rem .8rem;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:.85rem}
.ag b{display:block;color:var(--acc);font-size:1rem}
.teams-cfg{padding:1rem;display:grid;gap:.8rem}
.trow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem}
.tin{display:flex;align-items:center;gap:.6rem;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:.45rem .7rem}
.tin i{width:16px;height:16px;border-radius:5px;flex:0 0 auto}
.tin input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font-size:1rem;outline:none}
.sel{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sel label{color:var(--mut);font-size:.9rem}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:.4rem .9rem;border-radius:9px;font-size:.9rem;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--onacc)}
.start-row{display:flex;justify-content:center;margin-top:1.6rem}
.start-row .btn{font-size:1.25rem;padding:1rem 2.6rem}
.foot{margin-top:2rem;text-align:center;color:var(--mut);font-size:.8rem}

/* ---------- play ---------- */
.play{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:1rem;align-items:start}
.strip{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.9rem}
.prog{flex:1 1 200px;height:10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.qcard{padding:1.3rem 1.4rem 1.2rem;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.qhead{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.8rem}
.badge{padding:.25rem .75rem;border-radius:99px;font-size:.82rem;border:1px solid var(--line);background:var(--bg2)}
.badge.type{background:var(--acc);color:var(--onacc);border-color:transparent}
.badge.fast{background:var(--warn);color:#2a1d00;border-color:transparent}
.badge.essay{background:var(--acc2);color:var(--onacc);border-color:transparent}
.badge.pts{margin-inline-start:auto;color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.turn{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;border-radius:12px;margin-bottom:.8rem;font-size:1.05rem;border:1px solid}
.turn i{width:14px;height:14px;border-radius:50%}
.qtext{font-size:1.45rem;line-height:1.9}
.fig{display:block;max-width:340px;width:100%;margin:.8rem auto .2rem}
.fig .fl{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.fig .fdash{fill:none;stroke:var(--mut);stroke-width:2;stroke-dasharray:7 6}
.fig .fs{fill:color-mix(in srgb,var(--acc) 38%,transparent)}
.fig .fw{fill:var(--card)}
.fig .fd{fill:var(--acc)}
.fig .fmk{stroke:var(--acc2);stroke-width:3}
.fig .fmk2{stroke:var(--warn);stroke-width:3}
.fig .ft{fill:var(--ink);font-size:18px;font-family:"AB",Arial,sans-serif;font-weight:700}
.fig .ft.hi{fill:var(--acc)}
table.sl{margin:.8rem auto .2rem;border-collapse:collapse;font-size:1.25rem;min-width:240px}
table.sl th,table.sl td{border:1px solid var(--line);padding:.35rem 1.2rem;text-align:center}
table.sl th{background:var(--bg2);color:var(--acc);font-size:1rem}
table.sl td:first-child{border-left:3px solid var(--acc)}
table.sl td:last-child{letter-spacing:.5em;text-align:right}
.slk{text-align:center;color:var(--mut);font-size:.85rem}

/* math notation */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .14em;line-height:1.08;font-size:.9em}
.fr>.nu{padding:0 .2em .06em;border-bottom:2px solid currentColor}
.fr>.de{padding:.06em .2em 0}
.fr .fr{font-size:.92em}
.mx{display:inline-flex;flex-direction:row;align-items:center;vertical-align:middle;gap:.05em}
.ng{display:inline-flex;align-items:center;vertical-align:middle;white-space:nowrap}
sup{unicode-bidi:isolate;font-size:.62em;line-height:0;position:relative;top:-.55em;vertical-align:baseline;margin:0 .04em}
sub{font-size:.62em}
.rt{display:inline-flex;align-items:stretch;vertical-align:middle;position:relative;margin:0 .12em}
.rs{display:inline-block;transform:scaleX(-1);font-size:1.15em;line-height:1;padding-top:.06em}
.rr{border-top:2px solid currentColor;padding:.08em .22em 0;display:inline-flex;align-items:center;margin-top:.12em}
.rt:has(.fr)>.rs{font-size:2.1em;line-height:.95}
.rt:has(.fr)>.rr{margin-top:.18em}
.rt3 .ri{position:absolute;right:-.15em;top:-.42em;font-size:.55em}
.rt3{margin-right:.32em}
.pt{white-space:nowrap;display:inline-block}
.pi{font-family:"Times New Roman",serif;font-style:italic}

/* options */
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-top:1.1rem}
.opt{display:flex;align-items:center;gap:.8rem;text-align:right;padding:.85rem 1rem;border-radius:14px;background:var(--bg2);border:1.5px solid var(--line);font-size:1.25rem;transition:.15s;min-height:64px}
.opt .k{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:.95rem;color:var(--acc)}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--bg2));box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.opt.right .k{background:var(--ok);color:#03241a;border-color:transparent}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg2));animation:shake .35s}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:transparent}
.opt.dim{opacity:.45}
.opt.x{opacity:.3;text-decoration:line-through}
.tf{grid-template-columns:repeat(2,1fr)}
.tf .opt{justify-content:center;font-size:1.5rem;min-height:84px}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}

.steps{display:grid;gap:.6rem;margin-top:1rem;counter-reset:st}
.step{display:flex;gap:.8rem;align-items:center;text-align:right;padding:.75rem 1rem;border-radius:14px;background:var(--bg2);border:1.5px dashed var(--line);font-size:1.25rem;transition:.15s}
.step .k{flex:0 0 auto;padding:.1rem .6rem;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:.85rem;color:var(--mut)}
.step:hover:not(:disabled){border-color:var(--warn);border-style:solid}
.step.right{border:1.5px solid var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--bg2))}
.step.right .k{background:var(--warn);color:#2a1d00}
.step.wrong{border:1.5px solid var(--bad);animation:shake .35s}
.step.okstep{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}

.inbox{margin-top:1.1rem;display:grid;gap:.7rem;justify-items:center}
.inrow{display:flex;gap:.6rem;width:min(520px,100%)}
.inrow input{flex:1;min-width:0;padding:.75rem 1rem;font-size:1.5rem;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);text-align:center;outline:none}
.inrow input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.inrow input.ok{border-color:var(--ok)}
.inrow input.bad{border-color:var(--bad);animation:shake .35s}
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem;width:min(520px,100%)}
.pad button{padding:.5rem 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:1.1rem}
.pad button:hover{border-color:var(--acc)}
.hint{color:var(--mut);font-size:.82rem;text-align:center}

.essay textarea{width:100%;min-height:120px;margin-top:1rem;padding:.8rem 1rem;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font-size:1.1rem;resize:vertical;outline:none;line-height:1.8}
.essay textarea:focus{border-color:var(--acc2)}
.model{margin-top:1rem;padding:1rem 1.1rem;border-radius:14px;border:1px solid color-mix(in srgb,var(--acc2) 50%,var(--line));background:color-mix(in srgb,var(--acc2) 9%,var(--bg2))}
.model h4{color:var(--acc2);margin-bottom:.4rem;font-size:1rem}
.model ol{list-style:arabic-indic;padding-inline-start:1.6rem;display:grid;gap:.35rem;font-size:1.2rem}
.rubric{margin-top:.7rem;font-size:.9rem;color:var(--mut);border-top:1px dashed var(--line);padding-top:.6rem}
.grade-row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.9rem}
.grade-row .btn{flex:1 1 150px;padding:.7rem 1rem}
.g-full{background:color-mix(in srgb,var(--ok) 20%,var(--card));border-color:var(--ok)!important}
.g-half{background:color-mix(in srgb,var(--warn) 18%,var(--card));border-color:var(--warn)!important}
.g-zero{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad)!important}

.fb{margin-top:1.1rem;border-radius:16px;padding:1rem 1.1rem;border:1px solid var(--line);background:var(--bg2);animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fb.good{border-color:color-mix(in srgb,var(--ok) 60%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--ok) 13%,var(--bg2)),var(--bg2))}
.fb.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 11%,var(--bg2)),var(--bg2))}
.fb.half{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.fb .v{font-size:1.25rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.fb .v .plus{margin-inline-start:auto;color:var(--warn)}
.fb .ans{margin-top:.5rem;font-size:1.15rem}
.fb .ans b{color:var(--ok)}
.key{margin-top:.7rem;padding:.75rem .9rem;border-radius:12px;background:color-mix(in srgb,var(--acc) 9%,var(--card));border-inline-start:4px solid var(--acc);font-size:1.08rem;line-height:1.9}
.key .kt{color:var(--acc);display:block;font-size:.9rem;margin-bottom:.15rem}
.fix{margin-top:.6rem;padding:.6rem .9rem;border-radius:12px;background:color-mix(in srgb,var(--warn) 10%,var(--card));border-inline-start:4px solid var(--warn);font-size:1.05rem}
.fix .kt{color:var(--warn);display:block;font-size:.88rem}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end;margin-top:1rem}

/* side */
.side{display:grid;gap:1rem;position:sticky;top:76px}
.coach{padding:1rem;display:grid;grid-template-columns:96px 1fr;gap:.8rem;align-items:center}
.coach svg{width:96px;height:96px;overflow:visible}
.coach .hex{fill:var(--bg2);stroke:url(#cg);stroke-width:5;transition:.3s}
.coach .eye{fill:var(--acc);transition:all .25s}
.coach .mouth{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;transition:all .25s}
.coach .brow{stroke:var(--acc);stroke-width:4;stroke-linecap:round;transition:all .25s}
.coach[data-s="happy"] .eye,.coach[data-s="fire"] .eye{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round}
.coach[data-s="happy"] .mouth,.coach[data-s="fire"] .mouth{stroke:var(--ok)}
.coach[data-s="happy"] .brow,.coach[data-s="fire"] .brow{stroke:var(--ok)}
.coach[data-s="oops"] .eye{fill:var(--warn)}
.coach[data-s="oops"] .mouth,.coach[data-s="oops"] .brow{stroke:var(--warn)}
.coach[data-s="time"] .eye{fill:var(--bad)}
.coach[data-s="time"] .mouth,.coach[data-s="time"] .brow{stroke:var(--bad)}
.coach[data-s="fire"] svg{filter:drop-shadow(0 0 12px var(--ok))}
.coach .spark{opacity:0;transition:.3s;fill:var(--warn)}
.coach[data-s="fire"] .spark{opacity:1;animation:tw 1s infinite alternate}
@keyframes tw{to{transform:scale(1.25);transform-origin:center}}
.coach .ring{fill:none;stroke:var(--acc);stroke-width:2;opacity:.25;stroke-dasharray:4 7;animation:spin 14s linear infinite;transform-origin:60px 60px}
@keyframes spin{to{transform:rotate(360deg)}}
.coach .who{font-size:.78rem;color:var(--mut)}
.coach .say{font-size:1rem;line-height:1.65;min-height:3.3em}
.coach.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.03)}}

.timers{padding:1rem;display:grid;gap:.8rem}
.tm{display:flex;align-items:center;gap:.8rem}
.tm .lab{font-size:.8rem;color:var(--mut)}
.tm .val{font-size:1.6rem;font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:.03em}
.tm .val.low{color:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.qring{width:64px;height:64px;flex:0 0 auto;position:relative}
.qring svg{width:64px;height:64px;transform:rotate(-90deg)}
.qring circle{fill:none;stroke-width:7}
.qring .bgc{stroke:var(--bg2)}
.qring .fgc{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .3s}
.qring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.1rem}
.tbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.tbtns button{padding:.5rem .3rem;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:.85rem}
.tbtns button:hover{border-color:var(--acc)}
.tbtns button.on{border-color:var(--acc);color:var(--acc)}

.board{padding:1rem;display:grid;gap:.55rem}
.board h3{font-size:.95rem;color:var(--mut);display:flex;justify-content:space-between}
.team{display:grid;grid-template-columns:12px 1fr auto auto;gap:.6rem;align-items:center;padding:.55rem .7rem;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);transition:.25s}
.team i{width:12px;height:36px;border-radius:6px}
.team .nm{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .sc{font-size:1.5rem;min-width:2.5ch;text-align:center}
.team .adj{display:flex;flex-direction:column;gap:2px}
.team .adj button{width:26px;height:20px;border-radius:6px;background:var(--card);border:1px solid var(--line);font-size:.8rem;line-height:1}
.team.now{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 25%,transparent),0 0 22px -8px var(--tc)}
.team.bump .sc{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.4);color:var(--warn)}}
.solo{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:center}
.solo div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:.5rem .2rem}
.solo b{display:block;font-size:1.45rem}
.solo small{color:var(--mut);font-size:.75rem}

/* round interstitial */
.round{max-width:820px;margin:2rem auto;padding:2.2rem;text-align:center;position:relative;overflow:hidden}
.round .num{font-size:5rem;line-height:1;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.round h2{font-size:2rem;margin:.3rem 0}
.round .tops{display:flex;flex-wrap:wrap;justify-content:center;gap:.45rem;margin:1rem 0 1.4rem}
.round .meta{color:var(--mut);margin-bottom:1.2rem}

/* results */
.res-head{padding:1.6rem;display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center}
.score-ring{width:150px;height:150px;position:relative}
.score-ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:12}
.score-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2rem;line-height:1}
.score-ring b small{display:block;font-size:.8rem;color:var(--mut);text-align:center}
.podium{display:grid;gap:.6rem;margin-top:.8rem}
.stu{font-size:1.15rem;margin:.2rem 0}.stu b{color:var(--acc);font-size:1.35rem}
.rate{display:inline-block;margin:.5rem 0 .3rem;padding:.35rem 1rem;border-radius:99px;border:1.5px solid;font-size:1.1rem}
.namecard input{font-size:1.2rem}
.pod{display:grid;grid-template-columns:44px 14px 1fr auto;gap:.7rem;align-items:center;padding:.6rem .9rem;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:1.1rem}
.pod .rk{font-size:1.4rem;text-align:center}
.pod i{width:14px;height:30px;border-radius:5px}
.pod.first{border-color:var(--warn);box-shadow:0 0 22px -10px var(--warn)}
.mast{padding:1.3rem;display:grid;gap:1rem}
.mrow{display:grid;grid-template-columns:150px 1fr 70px;gap:.9rem;align-items:center}
.mrow .bar{height:16px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.mrow .bar i{display:block;height:100%;border-radius:99px;transition:width 1s}
.mrow .pc{font-size:1.2rem;text-align:left}
.mrow small{display:block;color:var(--mut);font-size:.78rem}
.lvl{grid-column:1/-1;font-size:.9rem;padding:.45rem .8rem;border-radius:10px;margin-top:-.4rem}
.review{padding:1.2rem;display:grid;gap:.8rem}
.rv{padding:.8rem 1rem;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.rv .rq{font-size:1.05rem}
.rv .ra{margin-top:.35rem;color:var(--ok);font-size:1rem}
.rv .rw{margin-top:.35rem;color:var(--mut);font-size:.92rem}

.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(250%);opacity:0;background:var(--card);border:1px solid var(--acc);padding:.7rem 1.3rem;border-radius:14px;z-index:60;transition:.35s;box-shadow:0 10px 30px -10px #000;font-size:1rem;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* responsive */
@media (max-width:1050px){.play{grid-template-columns:1fr}.side{position:static;grid-template-columns:1fr 1fr}.side .coach{grid-column:1/-1}.g5{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){
  .g2,.g3,.g5{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .hero .tags{justify-content:center}
  .opts{grid-template-columns:1fr}
  .qtext{font-size:1.2rem}
  .opt{font-size:1.1rem}
  .side{grid-template-columns:1fr}
  .coach{grid-template-columns:70px 1fr}.coach svg{width:70px;height:70px}
  .brand-txt small{display:none}
  .res-head{grid-template-columns:1fr;justify-items:center;text-align:center}
  .mrow{grid-template-columns:1fr 60px}.mrow .bar{grid-column:1/-1;grid-row:2}
  .pad{grid-template-columns:repeat(7,1fr)}
  .tb-btns .ib{width:38px;height:38px}
  #bFsm,#bFsp{display:none}
  .wrap{padding:.9rem .7rem 2.5rem}
}
@media print{
  body{background:#fff;color:#000}body::before,body::after,.topbar,.no-print{display:none!important}
  .card{box-shadow:none;border:1px solid #999;background:#fff}
}
</style>
</head>
<body>

ر يمرّ بالمركز ويتكوّن من نصفي قطر.", "pts": 10, "d": 1, "o": ["3.5 سم", "7 سم", "14 سم", "21 سم"], "a": 2}, {"id": 2, "type": "mcq", "u": 2, "t": "مفاهيم الدائرة", "q": "القطعة المستقيمة التي تصل بين أي نقطتين على الدائرة تُسمّى:", "w": "الوتر يصل بين نقطتين على الدائرة.<br>إذا مرّ الوتر بالمركز سُمّي قطرًا، وهو أطول وتر.", "pts": 10, "d": 1, "o": ["نصف قطر", "وترًا", "مركزًا", "قوسًا"], "a": 1}, {"id": 3, "type": "tf", "u": 2, "t": "مفاهيم الدائرة", "q": "كل قطر في الدائرة هو وتر.", "w": "القطر يصل بين نقطتين على الدائرة مثل الوتر تمامًا، لكنه يمرّ بالمركز.<br>إذن كل قطر وتر، وليس كل وتر قطرًا.", "pts": 10, "d": 1, "a": true}, {"id": 4, "type": "input", "u": 2, "t": "الزوايا المتتامة والمتكاملة", "q": "زاويتان متتامتان، قياس إحداهما 35°. أوجد قياس الأخرى بالدرجات.", "w": "الزاويتان المتتامتان مجموع قياسيهما 90°.<br>90 − 35 = 55°.", "pts": 15, "d": 1, "a": 55, "ans": "55°"}, {"id": 5, "type": "input", "u": 2, "t": "الزوايا المتتامة والمتكاملة", "q": "زاويتان متكاملتان، قياس إحداهما 120°. أوجد قياس الأخرى بالدرجات.", "w": "الزاويتان المتكاملتان مجموع قياسيهما 180°.<br>180 − 120 = 60°.", "pts": 15, "d": 1, "a": 60, "ans": "60°"}, {"id": 6, "type": "mcq", "u": 2, "t": "الزوايا المتقابلة بالرأس", "q": "في الشكل: مستقيمان متقاطعان، إذا كان قياس الزاوية (1) = 70° فإن قياس الزاوية (3) المقابلة لها بالرأس يساوي:", "w": "الزاويتان المتقابلتان بالرأس متساويتان في القياس.<br>أما الزاويتان (1) و(2) فمتجاورتان على مستقيم ومجموعهما 180°.", "pts": 10, "d": 1, "o": ["20°", "70°", "110°", "180°"], "a": 1, "fig": "<svg class=\"fig\" viewBox=\"0 0 320 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line class=\"fl\" x1=\"30\" y1=\"40\" x2=\"290\" y2=\"160\"/><line class=\"fl\" x1=\"40\" y1=\"170\" x2=\"280\" y2=\"30\"/><circle class=\"fd\" cx=\"160\" cy=\"100\" r=\"4\"/><text class=\"ft hi\" x=\"215\" y=\"108\" text-anchor=\"middle\">1<\/text><text class=\"ft\" x=\"160\" y=\"60\" text-anchor=\"middle\">2<\/text><text class=\"ft\" x=\"105\" y=\"104\" text-anchor=\"middle\">3< ازية.", "pts": 10, "d": 2, "o": ["متوازي أضلاع", "معيّن", "شبه منحرف", "مستطيل"], "a": 2}, {"id": 36, "type": "tf", "u": 2, "t": "تصنيف الأشكال الرباعية", "q": "كل مربع مستطيل، وكل مستطيل مربع.", "w": "المربع مستطيل خاص أضلاعه الأربعة متساوية.<br>الخاصية تنتقل من العام إلى الخاص فقط.", "pts": 10, "d": 2, "a": false, "fix": "كل مربع مستطيل، لكن ليس كل مستطيل مربعًا؛ لأن أضلاع المستطيل ليست بالضرورة متساوية."}, {"id": 37, "type": "input", "u": 2, "t": "زوايا الشكل الرباعي", "q": "شكل رباعي قياسات ثلاث زوايا فيه: 80° ، 95° ، 105°. أوجد قياس الزاوية الرابعة.", "w": "مجموع زوايا الشكل الرباعي 360°.<br>80 + 95 + 105 = 280 ، ثم 360 − 280 = 80°.", "pts": 15, "d": 2, "a": 80, "ans": "80°"}, {"id": 38, "type": "step", "u": 2, "t": "الزوايا المتجاورة", "q": "زاويتان متجاورتان على مستقيم واحد، قياساهما س و 2س. ما الخطوة الأولى الصحيحة لإيجاد س؟", "w": "الزاويتان المتجاورتان على مستقيم متكاملتان (مجموعهما 180°).<br>3س = 180 ⇐ س = 60°، والأخرى 120°.", "pts": 15, "d": 2, "o": ["س + 2س = 90", "س + 2س = 180", "س = 2س", "2س − س = 180"], "a": 1}, {"id": 39, "type": "mcq", "u": 2, "t": "زوايا المثلث", "q": "المثلث المتطابق الأضلاع قياس كل زاوية من زواياه يساوي:", "w": "زوايا المثلث المتطابق الأضلاع متساوية.<br>180 ÷ 3 = 60°.", "pts": 10, "d": 2, "o": ["45°", "60°", "90°", "180°"], "a": 1}, {"id": 40, "type": "mcq", "u": 2, "t": "خط التناظر", "q": "عدد خطوط التناظر في المستطيل (غير المربع):", "w": "للمستطيل خطّا تناظر يمرّان بمنتصفات الأضلاع المتقابلة.<br>القطران ليسا خطّي تناظر لأن الطول لا يساوي العرض.", "pts": 10, "d": 2, "o": ["1", "2", "4", "0"], "a": 1}, {"id": 41, "type": "mcq", "u": 2, "t": "حركة الأشكال", "q": "أي العبارات الآتية صحيحة عن الانعكاس؟", "w": "في الانعكاس تكون الصورة مطابقة للأصل (نفس الأطوال والزوايا).<br>لكن اتجاهها ينقلب كما في المرآة حول محور الانعكاس.", "pts": 10, "d": 2, "o": ["يغيّر قياسات الشكل", "الصورة مطابقة للشكل ومقلوبة كصورة المرآة", "يدوّر الشكل حول نقطة ثابتة", "يكبّر الشكل إلى الضعف"], "a": 1}, {"id": 42, "type": "essay", "u": 2, "t": "الزوايا المتقابلة بالرأس", "q": "في الشكل: مستقيمان متقاطعان، قياس الزاوية أ = 40°. أوجد قياسات الزوايا ب ، جـ ، د مع ذكر السبب في كل حالة.", "w": "الزوايا حول نقطة التقاطع مجموعها 360°.<br>المتقابلتان بالرأس متساويتان، والمتجاورتان على مستقيم متكاملتان.", "pts": 20, "d": 2, "model": ["الزاوية جـ = 40° ؛ لأنها تقابل الزاوية أ بالرأس (المتقابلتان بالرأس متساويتان).", "الزاوية ب = 180 − 40 = 140° ؛ لأنها مجاورة لـ أ على مستقيم (متكاملتان).", "الزاوية د = 140° ؛ لأنها تقابل ب بالرأس.", "تحقق: 40 + 140 + 40 + 140 = 360° ✓"], "rubric": "درجة كاملة: القياسات الثلاثة صحيحة مع الأسباب. نصف الدرجة: القياسات صحيحة بلا تعليل.", "fig": "<svg class=\"fig\" viewBox=\"0 0 320 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line class=\"fl\" x1=\"30\" y1=\"40\" x2=\"290\" y2=\"160\"/><line class=\"fl\" x1=\"40\" y1=\"170\" x2=\"280\" y2=\"30\"/><circle class=\"fd\" cx=\"160\" cy=\"100\" r=\"4\"/><text class=\"ft hi\" x=\"222\" y=\"96\" text-anchor=\"middle\">أ<\/text><text class=\"ft hi\" x=\"222\" y=\"118\" text-anchor=\"middle\">40°<\/text><text class=\"ft\" x=\"160\" y=\"60\" text-anchor=\"middle\">ب<\/text><text class=\"ft\" x=\"100\" y=\"106\" text-anchor=\"middle\">جـ<\/text><text class=\"ft\" x=\"160\" y=\"150\" text-anchor=\"middle\">د<\/text><\/svg>"}, {"id": 43, "type": "essay", "u": 2, "t": "تصنيف الأشكال الرباعية", "q": "اذكر خاصيتين لمتوازي الأضلاع، ثم وضّح الفرق بينه وبين شبه المنحرف.", "w": "التصنيف يعتمد على عدد أزواج الأضلاع المتوازية.<br>زوجان ⇐ متوازي أضلاع ، زوج واحد ⇐ شبه منحرف.", "pts": 20, "d": 2, "model": ["خصائص متوازي الأضلاع: كل ضلعين متقابلين متوازيان ومتساويان في الطول.", "كل زاويتين متقابلتين متساويتان في القياس.", "الفرق: متوازي الأضلاع فيه زوجان من الأضلاع المتوازية، بينما شبه المنحرف فيه زوج واحد فقط."], "rubric": "درجة كاملة: خاصيتان صحيحتان + الفرق. نصف الدرجة: خاصية واحدة أو الفرق فقط."}, {"id": 44, "type": "error", "u": 3, "t": "التحليل إلى العوامل الأولية", "q": "اكتشف الخطوة الخاطئة في تحليل العدد 60 إلى عوامله الأوّلية:", "w": "نجمع كل العوامل ا "rr\">144<\/span><\/span> = 12.<br>الجذر التربيعي هو العدد الذي إذا ضُرب في نفسه أعطى العدد.", "pts": 15, "d": 1, "s": 1, "a": 12, "ans": "12"}, {"id": 71, "type": "mcq", "u": 2, "t": "مربعات الأعداد", "q": "أي الأعداد الآتية مربع كامل؟", "w": "المربع الكامل ناتج ضرب عدد كلي في نفسه.<br>81 = 9 × 9، أما البقية فلا يوجد عدد كلي مربعه يساويها.", "pts": 10, "d": 1, "s": 1, "o": ["24", "48", "81", "90"], "a": 2}, {"id": 72, "type": "input", "u": 2, "t": "ترتيب العمليات", "q": "أوجد قيمة: 8 + 4 × 3", "w": "الضرب قبل الجمع: 4 × 3 = 12.<br>ثم 8 + 12 = 20 (وليس 36).", "pts": 15, "d": 1, "s": 1, "a": 20, "ans": "20"}, {"id": 73, "type": "mcq", "u": 2, "t": "التعبيرات الجبرية", "q": "التعبير الجبري الذي يمثّل «ناتج طرح 5 من ثلاثة أمثال العدد ن» هو:", "w": "«ثلاثة أمثال ن» = 3ن ، و«طرح 5 من» تعني أن 5 هو المطروح.<br>إذن: 3ن − 5.", "pts": 10, "d": 1, "s": 1, "o": ["5 − 3ن", "3ن − 5", "3(ن − 5)", "3 + ن − 5"], "a": 1}, {"id": 74, "type": "error", "u": 2, "t": "ترتيب العمليات", "q": "اكتشف الخطوة الخاطئة في حساب: 20 − 4 × 3 + 2", "w": "ترتيب العمليات: الأقواس ← الأسس ← الضرب والقسمة ← الجمع والطرح.<br>الطرح لا يسبق الضرب حتى لو جاء أولًا في المسألة.", "pts": 15, "d": 2, "s": 1, "a": 0, "fix": "نبدأ بالضرب: 4 × 3 = 12 ، ثم من اليمين: 20 − 12 + 2 = 10.", "steps": ["20 − 4 = 16", "16 × 3 = 48", "48 + 2 = 50"]}, {"id": 75, "type": "mcq", "u": 2, "t": "التعبيرات الجبرية", "q": "قيمة التعبير 2س<sup>2<\/sup> عندما س = 3 هي:", "w": "الأس يخص س فقط: 2 × 3<sup>2<\/sup> = 2 × 9 = 18.<br>الناتج 36 يأتي من الخطأ (2 × 3)<sup>2<\/sup>.", "pts": 10, "d": 2, "s": 1, "o": ["36", "18", "12", "81"], "a": 1}, {"id": 76, "type": "mcq", "u": 2, "t": "الصورة العلمية", "q": "العدد 4.5 × 10<sup>4<\/sup> بالصورة العادية هو:", "w": "10<sup>4<\/sup> = 10000 ، و 4.5 × 10000 = 45000.<br>الأس الموجب يعني عددًا كبيرًا: نحرّك الفاصلة 4 منازل.", "pts": 10, "d": 2, "s": 1, "o": ["45000", "4500", "450000", "0.00045"], "a": 0}, {"id": 77, "type": "tf", "u": 2, "t": "الجذور التربيعية", "q": "<span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">9 + 16<\/span><\/span> = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">9<\/span><\/span> + <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">16<\/span><\/span>", "w": "الجذر التربيعي لا يتوزّع على الجمع.<br>نحسب ما تحت الجذر أولًا ثم نأخذ الجذر.", "pts": 10, "d": 2, "s": 1, "a": false, "fix": "<span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">9 + 16<\/span><\/span> = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">25<\/span><\/span> = 5 ، بينما <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">9<\/span><\/span> + <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">16<\/span><\/span> = 3 + 4 = 7."}, {"id": 78, "type": "input", "u": 2, "t": "ترتيب العمليات", "q": "أوجد قيمة: 3 × (4 + 2)<sup>2<\/sup> ÷ 6", "w": "الأقواس: 4 + 2 = 6 ، ثم الأس: 6<sup>2<\/sup> = 36.<br>ثم من اليمين: 3 × 36 = 108 ، 108 ÷ 6 = 18.", "pts": 15, "d": 2, "s": 1, "a": 18, "ans": "18"}, {"id": 79, "type": "mcq", "u": 2, "t": "التعبيرات الجبرية", "q": "عمر الأب يزيد على 3 أمثال عمر ابنه بـ 4 سنوات. إذا كان عمر الابن ع سنة، فإن عمر الأب:", "w": "«3 أمثال عمر الابن» = 3ع ، و«يزيد عليه بـ 4» = نضيف 4.<br>تحقق: لو كان الابن 10 سنوات ⇐ الأب 34 سنة.", "pts": 10, "d": 2, "s": 1, "o": ["3ع + 4", "4ع + 3", "3(ع + 4)", "ع + 12"], "a": 0}, {"id": 80, "type": "essay", "u": 2, "t": "التحليل والمربع الكامل", "q": "اكتب العدد 180 في صورة حاصل ضرب عوامله الأوّلية بالصورة الأسية، ثم استخدم ذلك لتبيّن هل 180 مربع كامل أم لا، مع ذكر السبب.", "w": "التحليل إلى العوامل الأوّلية يكشف المربعات الكاملة.<br>أسس زوجية لكل العوامل ⇐ مربع كامل.", "pts": 20, "d": 2, "s": 1, "model": ["180 = 2 × 90 = 2 × 2 × 45 = 2 × 2 × 3 × 15 = 2 × 2 × 3 × 3 × 5", "180 = 2<sup>2<\/sup> × 3<sup>2<\/sup> × 5", "العدد ليس مربعًا كاملًا؛ لأن أس العامل 5 فردي (1).", "المربع الكامل تكون جميع أسس عوامله الأوّلية زوجية (مثل 36 = 2<sup>2<\/sup> × 3<sup>2<\/sup>)."], "rubric": "درجة كاملة: تحليل صحيح + الحكم + السبب. نصف الدرجة: تحليل صحيح فقط."}, {"id": 81, "type": "mcq", "u": 2, "t": "جمع الأعداد الصحيحة", "q": "-7 + 3 =", "w": "عددان مختلفا الإشارة: نطرح (7 − 3 = 4) ونأخذ إشارة الأكبر قيمة مطلقة.<br>على خط الأعداد: نبدأ من -7 ونتحرك 3 خطوات نحو الموجب.", "pts": 10, "d": 1, "s": 2, "o": ["-10", "-4", "4", "10"], "a": 1}, {"id": 82, "type": "input", "u": 2, "t": "طرح الأعداد الصحيحة", "q": "أوجد الناتج: 5 − 8", "w": "5 − 8 = 5 + (-8) = -3.<br>طرح عدد يساوي جمع معكوسه الجمعي.", "pts": 15, "d": 1, "s": 2, "a": -3, "ans": "-3"}, {"id": 83, "type": "mcq", "u": 2, "t": "طرح الأعداد الصحيحة", "q": "(-6) − (-4) =", "w": "طرح (-4) يساوي جمع 4: (-6) + 4 = -2.<br>الطرح ⇐ نجمع المعكوس الجمعي.", "pts": 10, "d": 1, "s": 2, "o": ["-10", "-2", "2", "10"], "a": 1}, {"id": 84, "type": "mcq", "u": 2, "t": "ضرب الأعداد الصحيحة", "q": "(-4) × (-5) =", "w": "ناتج ضرب عددين سالبين موجب.<br>4 × 5 = 20 ⇐ الناتج 20.", "pts": 10, "d": 1, "s": 2, "o": ["-20", "20", "-9", "9"], "a": 1}, {"id": 85, "type": "input", "u": 2, "t": "قسمة الأعداد الصحيحة", "q": "أوجد الناتج: -36 ÷ 4", "w": "سالب ÷ موجب = سالب.<br>36 ÷ 4 = 9 ⇐ الناتج -9.", "pts": 15, "d": 1, "s": 2, "a": -9, "ans": "-9"}, {"id": 86, "type": "tf", "u": 2, "t": "ضرب الأعداد الصحيحة", "q": "ناتج ضرب عدد صحيح سالب في عدد صحيح موجب يكون موجبًا.", "w": "متشابهان في الإشارة ⇐ موجب ، مختلفان ⇐ سالب.<br>القاعدة نفسها للقسمة.", "pts": 10, "d": 1, "s": 2, "a": false, "fix": "ناتج ضرب عددين مختلفين في الإشارة يكون سالبًا، مثل: (-3) × 4 = -12."}, {"id": 87, "type": "input", "u": 2, "t": "حل المعادلات", "q": "حلّ المعادلة: س + 9 = 4", "w": "نطرح 9 من الطرفين: س = 4 − 9 = -5.<br>تحقق: -5 + 9 = 4 ✓", "pts": 15, "d": 1, "s": 2, "a": -5, "ans": "س = -5"}, {"id": 88, "type": "input", "u": 2, "t": "حل المعادلات", "q": "حلّ المعادلة: <span class=\"fr\"><span class=\"nu\">ص<\/span><span class=\"de\">3<\/span><\/span> = 7", "w": "نضرب الطرفين في 3 (العملية العكسية للقسمة).<br>ص = 7 × 3 = 21.", "pts": 15, "d": 2, "s": 2, "a": 21, "ans": "ص = 21"}, {"id": 89, "type": "mcq", "u": 2, "t": "حل المعادلات", "q": "حلّ المعادلة: 4ن = -28", "w": "نقسم الطرفين على 4: ن = -28 ÷ 4 = -7.<br>تحقق: 4 × (-7) = -28 ✓", "pts": 10, "d": 1, "s": 2, "o": ["-7", "7", "-24", "-112"], "a": 0}, {"id": 90, "type": "mcq", "u": 2, "t": "الأعداد الصحيحة", "q": "أصغر الأعداد الآتية هو:", "w": "كلما ابتعد العدد السالب عن الصفر صغرت قيمته.<br>على خط الأعداد: -8 يقع يسار -3.", "pts": 10, "d": 1, "s": 2, "o": ["-8", "-3", "0", "2"], "a": 0}, {"id": 91, "type": "error", "u": 2, "t": "حل المعادلات", "q": "اكتشف الخطوة الخاطئة في حل المعادلة: 2س + 7 = -1", "w": "طرح عدد موجب من سالب يزيد القيمة السالبة: -1 − 7 = -8.<br>تحقق دائمًا بالتعويض: 2(-4) + 7 = -1 ✓", "pts": 15, "d": 2, "s": 2, "a": 1, "fix": "-1 − 7 = -8 ، إذن 2س = -8 ومنها س = -4.", "steps": ["2س = -1 − 7", "2س = -6", "س = -3"]}, {"id": 92, "type": "step", "u": 2, "t": "حل المعادلات", "q": "حلّ المعادلة: 5س − 3 = 17. الخطوة الأولى الصحيحة:", "w": "نتخلّص أولًا من الجمع أو الطرح، ثم من الضرب أو القسمة.<br>5س = 20 ⇐ س = 4.", "pts": 15, "d": 2, "s": 2, "o": ["نضيف 3 إلى الطرفين: 5س = 20", "نقسم على 5 أولًا: س − 3 = 17", "نطرح 3 من الطرفين: 5س = 14", "نضرب الطرفين في 5"], "a": 0}, {"id": 93, "type": "mcq", "u": 2, "t": "جمع الأعداد الصحيحة", "q": "كانت درجة الحرارة صباحًا -3° س، ثم ارتفعت 8 درجات ظهرًا. كم أصبحت؟", "w": "الارتفاع يعني الجمع: -3 + 8 = 5.<br>من -3 إلى الصفر 3 درجات، ثم 5 درجات أخرى.", "pts": 10, "d": 2, "s": 2, "o": ["-11° س", "5° س", "-5° س", "11° س"], "a": 1}, {"id": 94, "type": "mcq", "u": 2, "t": "حل المعادلات", "q": "اشترت سارة 3 دفاتر متساوية الثمن وقلمًا بـ 2 دينار، فدفعت 11 دينارًا. ثمن الدفتر الواحد:", "w": "المعادلة: 3س + 2 = 11 ⇐ 3س = 9 ⇐ س = 3.<br>تحقق: 3 × 3 + 2 = 11 ✓", "pts": 10, "d": 2, "s": 2, "o": ["3 دنانير", "4 دنانير", "9 دنانير", "<span class=\"fr\"><span class=\"nu\">13<\/span><span class=\"de\">3<\/span><\/span> دينار"], "a": 0}, {"id": 95, "type": "tf", "u": 2, "t": "طرح الأعداد الصحيحة", "q": "(-2) − (-5) = -7", "w": "طرح سالب = جمع موجب.<br>الخطأ الشائع: جمع الإشارتين بدل تغيير إشارة المطروح.", "pts": 10, "d": 2, "s": 2, "a": false, "fix": "(-2) − (-5) = (-2) + 5 = 3."}, {"id": 96, "type": "essay", "u": 2, "t": "الأعداد الصحيحة", "q": "غوّاص على عمق -12 مترًا تحت سطح البحر، صعد 5 أمتار ثم نزل 9 أمتار. اكتب تعبيرًا بالأعداد الصحيحة يمثّل موقعه النهائي، ثم أوجد قيمته وفسّر معناه.", "w": "الصعود ⇐ جمع عدد موجب ، النزول ⇐ جمع عدد سالب.<br>الإشارة السالبة في الناتج تعني «تحت سطح البحر».", "pts": 20, "d": 2, "s": 2, "model": ["التعبير: -12 + 5 + (-9)", "= -7 + (-9) = -16", "المعنى: أصبح الغوّاص على عمق 16 مترًا تحت سطح البحر."], "rubric": "درجة كاملة: التعبير + القيمة + التفسير. نصف الدرجة: القيمة صحيحة دون تعبير."}, {"id": 97, "type": "essay", "u": 2, "t": "حل المعادلات", "q": "حلّ المعادلة 4س − 9 = 15 موضحًا خطوات الحل، ثم تحقّق من صحة الحل بالتعويض.", "w": "نستخدم العمليات العكسية بترتيب عكسي.<br>التعويض في المعادلة الأصلية يضمن صحة الحل.", "pts": 20, "d": 2, "s": 2, "model": ["4س − 9 + 9 = 15 + 9", "4س = 24", "س = 24 ÷ 4 = 6", "التحقق: 4 × 6 − 9 = 24 − 9 = 15 ✓"], "rubric": "درجة كاملة: الخطوات + الحل + التحقق. نصف الدرجة: الحل صحيح دون تحقق."}, {"id": 98, "type": "input", "u": 3, "t": "المحيط", "q": "مستطيل طوله 12 سم وعرضه 5 سم. أوجد محيطه بالسنتيمتر.", "w": "محيط المستطيل = 2 × (الطول + العرض).<br>2 × (12 + 5) = 34 سم.", "pts": 15, "d": 1, "s": 3, "a": 34, "ans": "34 سم"}, {"id": 99, "type": "mcq", "u": 3, "t": "مساحة المثلث", "q": "مساحة مثلث طول قاعدته 10 سم وارتفاعه 6 سم تساوي:", "w": "مساحة المثلث = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × القاعدة × الارتفاع.<br><span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × 10 × 6 = 30 سم<sup>2<\/sup>.", "pts": 10, "d": 1, "s": 3, "o": ["60 سم<sup>2<\/sup>", "30 سم<sup>2<\/sup>", "16 سم<sup>2<\/sup>", "32 سم<sup>2<\/sup>"], "a": 1}, {"id": 100, "type": "input", "u": 3, "t": "مساحة متوازي الأضلاع", "q": "متوازي أضلاع طول قاعدته 9 سم وارتفاعه 4 سم. أوجد مساحته.", "w": "مساحة متوازي الأضلاع = القاعدة × الارتفاع.<br>9 × 4 = 36 سم<sup>2<\/sup>.", "pts": 15, "d": 2, "s": 3, "a": 36, "ans": "36 سم<sup>2<\/sup>"}, {"id": 101, "type": "mcq", "u": 3, "t": "مساحة شبه المنحرف", "q": "شبه منحرف طولا قاعدتيه المتوازيتين 8 سم و 6 سم، وارتفاعه 5 سم. مساحته:", "w": "مساحة شبه المنحرف = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × (مجموع القاعدتين) × الارتفاع.<br><span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × (8 + 6) × 5 = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × 14 × 5 = 35 سم<sup>2<\/sup>.", "pts": 10, "d": 1, "s": 3, "o": ["70 سم<sup>2<\/sup>", "35 سم<sup>2<\/sup>", "240 سم<sup>2<\/sup>", "19 سم<sup>2<\/sup>"], "a": 1}, {"id": 102, "type": "mcq", "u": 3, "t": "مفاهيم الدائرة", "q": "القطعة المستقيمة الواصلة من مركز الدائرة إلى أي نقطة عليها تُسمّى:", "w": "نصف القطر يبدأ من المركز وينتهي على الدائرة.<br>جميع أنصاف أقطار الدائرة الواحدة متساوية.", "pts": 10, "d": 1, "s": 3, "o": ["القطر", "نصف القطر", "الوتر", "القوس"], "a": 1}, {"id": 103, "type": "mcq", "u": 3, "t": "محيط الدائرة", "q": "محيط دائرة طول قطرها 10 سم يساوي (<span class=\"pi\">π<\/span> = 3.14):", "w": "محيط الدائرة = <span class=\"pi\">π<\/span> × القطر.<br>3.14 × 10 = 31.4 سم.", "pts": 10, "d": 1, "s": 3, "o": ["31.4 سم", "62.8 سم", "78.5 سم", "314 سم"], "a": 0}, {"id": 104, "type": "input", "u": 3, "t": "مساحة الدائرة", "q": "أوجد مساحة دائرة طول نصف قطرها 10 سم (<span class=\"pi\">π<\/span> = 3.14).", "w": "مساحة الدائرة = <span class=\"pi\">π<\/span> × نق<sup>2<\/sup>.<br>3.14 × 10 × 10 = 314 سم<sup>2<\/sup>.", "pts": 15, "d": 1, "s": 3, "a": 314, "ans": "314 سم<sup>2<\/sup>"}, {"id": 105, "type": "tf", "u": 3, "t": "محيط الدائرة", "q": "محيط الدائرة = <span class=\"pi\">π<\/span> × نق<sup>2<\/sup>", "w": "المحيط طول (وحدته سم)، والمساحة سطح (وحدتها سم<sup>2<\/sup>).<br>وجود التربيع يدل على المساحة.", "pts": 10, "d": 1, "s": 3, "a": false, "fix": "<span class=\"pi\">π<\/span> × نق<sup>2<\/sup> هي قانون المساحة، أما المحيط = 2 × <span class=\"pi\">π<\/span> × نق = <span class=\"pi\">π<\/span> × القطر."}, {"id": 106, "type": "error", "u": 3, "t": "مساحة الدائرة", "q": "اكتشف الخطوة الخاطئة: مساحة دائرة طول نصف قطرها 7 سم (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>)", "w": "نق<sup>2<\/sup> تعني نق × نق.<br>الخلط بين التربيع والضرب في 2 من أكثر الأخطاء شيوعًا.", "pts": 15, "d": 2, "s": 3, "a": 1, "fix": "نق<sup>2<\/sup> = 7 × 7 وليس 7 × 2، إذن المساحة = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 7 = 154 سم<sup>2<\/sup>.", "steps": ["المساحة = <span class=\"pi\">π<\/span> × نق<sup>2<\/sup>", "= <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 2", "= 44 سم<sup>2<\/sup>"]}, {"id": 107, "type": "mcq", "u": 3, "t": "المحيط والمساحة", "q": "مربع مساحته 49 سم<sup>2<\/sup>، فإن محيطه:", "w": "طول الضلع = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">49<\/span><\/span> = 7 سم.<br>المحيط = 4 × 7 = 28 سم.", "pts": 10, "d": 2, "s": 3, "o": ["7 سم", "14 سم", "28 سم", "49 سم"], "a": 2}, {"id": 108, "type": "mcq", "u": 3, "t": "مساحة الدائرة", "q": "إذا ضاعفنا طول نصف قطر دائرة، فإن مساحتها:", "w": "المساحة = <span class=\"pi\">π<\/span> × نق<sup>2<\/sup>، فإذا أصبح نق ⇐ 2نق تصبح المساحة <span class=\"pi\">π<\/span> × 4نق<sup>2<\/sup>.<br>أي 4 أمثال المساحة الأصلية.", "pts": 10, "d": 2, "s": 3, "o": ["تتضاعف", "تصبح 4 أمثالها", "تبقى كما هي", "تصبح نصفها"], "a": 1}, {"id": 109, "type": "step", "u": 3, "t": "محيط الدائرة", "q": "دائرة محيطها 44 سم (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>). لإيجاد طول نصف قطرها نبدأ بـ:", "w": "المحيط = 2 <span class=\"pi\">π<\/span> نق ⇐ <span class=\"fr\"><span class=\"nu\">44<\/span><span class=\"de\">7<\/span><\/span> × نق = 44.<br>نق = 44 × <span class=\"fr\"><span class=\"nu\">7<\/span><span class=\"de\">44<\/span><\/span> = 7 سم.", "pts": 15, "d": 2, "s": 3, "o": ["2 × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × نق = 44", "<span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × نق<sup>2<\/sup> = 44", "نق = 44 × 2", "نق = 44 ÷ 22"], "a": 0}, {"id": 110, "type": "input", "u": 3, "t": "المحيط", "q": "حديقة مستطيلة طولها 20 م وعرضها 15 م، يراد إحاطتها بسور. كم مترًا من السور نحتاج؟", "w": "السور يحيط بالحديقة ⇐ نحسب المحيط وليس المساحة.<br>2 × (20 + 15) = 70 م.", "pts": 15, "d": 2, "s": 3, "a": 70, "ans": "70 م"}, {"id": 111, "type": "essay", "u": 3, "t": "مساحة شبه المنحرف", "q": "شبه منحرف مساحته 45 سم<sup>2<\/sup>، وطولا قاعدتيه المتوازيتين 7 سم و 11 سم. أوجد ارتفاعه موضحًا خطوات الحل.", "w": "نعوّض المعطيات في القانون ونحلّ المعادلة لإيجاد المجهول.<br>هذا ربط مباشر بين المساحة وحل المعادلات.", "pts": 20, "d": 2, "s": 3, "model": ["المساحة = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × (ق<sub>1<\/sub> + ق<sub>2<\/sub>) × ع", "45 = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × (7 + 11) × ع", "45 = 9 × ع", "ع = 45 ÷ 9 = 5 سم"], "rubric": "درجة كاملة: القانون + التعويض + الحل. نصف الدرجة: القانون والتعويض فقط."}, {"id": 112, "type": "essay", "u": 3, "t": "مساحة المثلث ومتوازي الأضلاع", "q": "قارن بين مساحة مثلث ومساحة متوازي أضلاع لهما القاعدة نفسها والارتفاع نفسه، وفسّر السبب.", "w": "فهم أصل القانون أهم من حفظه.<br>المثلث نصف متوازي أضلاع له نفس القاعدة والارتفاع.", "pts": 20, "d": 2, "s": 3, "model": ["مساحة المثلث = نصف مساحة متوازي الأضلاع.", "السبب: القطر يقسم متوازي الأضلاع إلى مثلثين متطابقين، لكل منهما القاعدة والارتفاع نفساهما.", "لذلك: مساحة المثلث = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × القاعدة × الارتفاع."], "rubric": "درجة كاملة: المقارنة + التفسير. نصف الدرجة: المقارنة فقط."}, {"id": 113, "type": "mcq", "u": 3, "t": "المساحة المظللة", "q": "في الشكل: دائرة داخل مربع طول ضلعه 10 سم وتمسّ أضلاعه. مساحة المنطقة المظللة (<span class=\"pi\">π<\/span> = 3.14):", "w": "المظلل = مساحة المربع − مساحة الدائرة.<br>100 − (3.14 × 5 × 5) = 100 − 78.5 = 21.5 سم<sup>2<\/sup>.", "pts": 10, "d": 1, "s": 4, "o": ["21.5 سم<sup>2<\/sup>", "78.5 سم<sup>2<\/sup>", "100 سم<sup>2<\/sup>", "31.4 سم<sup>2<\/sup>"], "a": 0, "fig": "<svg class=\"fig\" viewBox=\"0 0 280 205\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect class=\"fs\" x=\"60\" y=\"20\" width=\"160\" height=\"160\"/><circle class=\"fw\" cx=\"140\" cy=\"100\" r=\"80\"/><rect class=\"fl\" x=\"60\" y=\"20\" width=\"160\" height=\"160\"/><circle class=\"fl\" cx=\"140\" cy=\"100\" r=\"80\"/><circle class=\"fd\" cx=\"140\" cy=\"100\" r=\"3\"/><text class=\"ft\" x=\"140\" y=\"198\" text-anchor=\"middle\">10 سم<\/text><\/svg>"}, {"id": 114, "type": "mcq", "u": 3, "t": "المجسمات", "q": "مجسم له قاعدتان دائريتان متطابقتان وسطح جانبي منحنٍ هو:", "w": "الأسطوانة لها قاعدتان دائريتان متوازيتان ومتطابقتان.<br>المخروط له قاعدة دائرية واحدة ورأس.", "pts": 10, "d": 1, "s": 4, "o": ["المخروط", "الأسطوانة", "الكرة", "المنشور"], "a": 1}, {"id": 115, "type": "mcq", "u": 3, "t": "المجسمات", "q": "عدد أوجه الهرم الرباعي (قاعدته مربعة):", "w": "قاعدة مربعة واحدة + 4 أوجه جانبية مثلثة.<br>المجموع 5 أوجه.", "pts": 10, "d": 1, "s": 4, "o": ["4", "5", "6", "8"], "a": 1}, {"id": 116, "type": "tf", "u": 3, "t": "المجسمات", "q": "المكعب حالة خاصة من شبه المكعب جميع أحرفه متساوية في الطول.", "w": "شبه المكعب أوجهه مستطيلات، والمكعب أوجهه مربعات متطابقة.<br>لذلك كل مكعب شبه مكعب، وليس العكس.", "pts": 10, "d": 1, "s": 4, "a": true}, {"id": 117, "type": "input", "u": 3, "t": "مساحة السطح", "q": "أوجد مساحة سطح مكعب طول حرفه 3 سم.", "w": "للمكعب 6 أوجه مربعة متطابقة.<br>6 × (3 × 3) = 54 سم<sup>2<\/sup>.", "pts": 15, "d": 1, "s": 4, "a": 54, "ans": "54 سم<sup>2<\/sup>"}, {"id": 118, "type": "mcq", "u": 3, "t": "مساحة السطح", "q": "مساحة سطح شبه مكعب أبعاده 5 سم ، 4 سم ، 2 سم تساوي:", "w": "مساحة السطح = 2 × (ط × ع + ط × ر + ع × ر).<br>2 × (20 + 10 + 8) = 2 × 38 = 76 سم<sup>2<\/sup> (40 هو الحجم وليس المساحة).", "pts": 10, "d": 1, "s": 4, "o": ["76 سم<sup>2<\/sup>", "40 سم<sup>2<\/sup>", "38 سم<sup>2<\/sup>", "152 سم<sup>2<\/sup>"], "a": 0}, {"id": 119, "type": "mcq", "u": 3, "t": "الشبكات", "q": "شبكة مكوّنة من 6 مربعات متطابقة تُطوى لتكوّن:", "w": "الشبكة تُظهر جميع أوجه المجسم مفرودة.<br>6 أوجه مربعة متطابقة ⇐ مكعب.", "pts": 10, "d": 2, "s": 4, "o": ["مكعبًا", "هرمًا", "أسطوانة", "منشورًا ثلاثيًا"], "a": 0}, {"id": 120, "type": "mcq", "u": 3, "t": "مساحة سطح الأسطوانة", "q": "المساحة الجانبية لأسطوانة نصف قطر قاعدتها 7 سم وارتفاعها 10 سم (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>):", "w": "المساحة الجانبية = 2 × <span class=\"pi\">π<\/span> × نق × ع.<br>2 × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 10 = 440 سم<sup>2<\/sup>.", "pts": 10, "d": 1, "s": 4, "o": ["440 سم<sup>2<\/sup>", "220 سم<sup>2<\/sup>", "154 سم<sup>2<\/sup>", "1540 سم<sup>2<\/sup>"], "a": 0}, {"id": 121, "type": "input", "u": 3, "t": "مساحة سطح الأسطوانة", "q": "أوجد مساحة السطح الكلية لأسطوانة نصف قطرها 7 سم وارتفاعها 10 سم (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>).", "w": "الجانبية = 440 ، والقاعدتان = 2 × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 7 = 308.<br>الكلية = 440 + 308 = 748 سم<sup>2<\/sup>.", "pts": 15, "d": 2, "s": 4, "a": 748, "ans": "748 سم<sup>2<\/sup>"}, {"id": 122, "type": "error", "u": 3, "t": "مساحة سطح الهرم", "q": "اكتشف الخطوة الخاطئة: مساحة سطح هرم رباعي قاعدته مربعة طول ضلعها 6 سم، وارتفاع كل وجه جانبي (مثلث) 5 سم.", "w": "الأوجه الجانبية للهرم مثلثات، ومساحة المثلث نصف القاعدة × الارتفاع.<br>نسيان النصف يضاعف المساحة الجانبية.", "pts": 15, "d": 2, "s": 4, "a": 1, "fix": "الوجه الجانبي مثلث: <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × 6 × 5 = 15 ، فمساحة السطح = 36 + 4 × 15 = 96 سم<sup>2<\/sup>.", "steps": ["مساحة القاعدة = 6 × 6 = 36 سم<sup>2<\/sup>", "مساحة الوجه الجانبي = 6 × 5 = 30 سم<sup>2<\/sup>", "مساحة السطح = 36 + 4 × 30 = 156 سم<sup>2<\/sup>"]}, {"id": 123, "type": "mcq", "u": 3, "t": "المساحة المظللة", "q": "في الشكل: مستطيل بُعداه 12 و 8، قُطع من ركنه مربع طول ضلعه 3. مساحة الشكل المتبقي:", "w": "المساحة المتبقية = مساحة المستطيل − مساحة المربع المقطوع.<br>(12 × 8) − (3 × 3) = 96 − 9 = 87 وحدة مربعة.", "pts": 10, "d": 2, "s": 4, "o": ["87", "93", "105", "84"], "a": 0, "fig": "<svg class=\"fig\" viewBox=\"0 0 345 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><path class=\"fs fl\" d=\"M70 30 H310 V190 H10 V90 H70 Z\"/><rect class=\"fdash\" x=\"10\" y=\"30\" width=\"60\" height=\"60\"/><text class=\"ft\" x=\"160\" y=\"22\" text-anchor=\"middle\">9<\/text><text class=\"ft\" x=\"160\" y=\"210\" text-anchor=\"middle\">12<\/text><text class=\"ft\" x=\"328\" y=\"115\" text-anchor=\"middle\">8<\/text><text class=\"ft\" x=\"40\" y=\"66\" text-anchor=\"middle\">3<\/text><\/svg>"}, {"id": 124, "type": "mcq", "u": 3, "t": "مساحة السطح", "q": "علبة على شكل مكعب مساحة سطحها 96 سم<sup>2<\/sup>. طول حرفها:", "w": "مساحة الوجه الواحد = 96 ÷ 6 = 16 سم<sup>2<\/sup>.<br>طول الحرف = <span class=\"rt\"><span class=\"rs\">√<\/span><span class=\"rr\">16<\/span><\/span> = 4 سم.", "pts": 10, "d": 2, "s": 4, "o": ["4 سم", "16 سم", "6 سم", "8 سم"], "a": 0}, {"id": 125, "type": "tf", "u": 3, "t": "مساحة سطح الأسطوانة", "q": "المساحة الجانبية للأسطوانة = محيط القاعدة × الارتفاع.", "w": "عند فرد السطح الجانبي للأسطوانة نحصل على مستطيل.<br>طوله = محيط القاعدة (2<span class=\"pi\">π<\/span>نق) وعرضه = الارتفاع.", "pts": 10, "d": 2, "s": 4, "a": true}, {"id": 126, "type": "essay", "u": 3, "t": "مساحة سطح الأسطوانة", "q": "علبة أسطوانية نصف قطر قاعدتها 3.5 سم وارتفاعها 10 سم. يراد تغطية سطحها الجانبي بورقة ملصق. (أ) احسب مساحة الورقة. (ب) احسب مساحة السطح الكلية (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>).", "w": "الملصق يغطي الجانب فقط ⇐ المساحة الجانبية.<br>المساحة الكلية = الجانبية + مساحة القاعدتين.", "pts": 20, "d": 2, "s": 4, "model": ["(أ) الجانبية = 2 × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 3.5 × 10 = 220 سم<sup>2<\/sup>", "(ب) مساحة القاعدتين = 2 × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 3.5 × 3.5 = 77 سم<sup>2<\/sup>", "الكلية = 220 + 77 = 297 سم<sup>2<\/sup>"], "rubric": "درجة كاملة: الفرعان. نصف الدرجة: الفرع (أ) فقط."}, {"id": 127, "type": "essay", "u": 3, "t": "المساحة المركبة", "q": "شكل مكوّن من مستطيل بُعداه 14 سم و 10 سم، أُضيف إلى ضلعه الذي طوله 14 سم نصف دائرة قطرها 14 سم (كما في الشكل). أوجد مساحة الشكل كاملًا (<span class=\"pi\">π<\/span> = <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span>).", "w": "نقسّم الشكل المركّب إلى أشكال نعرف قوانينها.<br>انتبه: القطر 14 ⇐ نصف القطر 7.", "pts": 20, "d": 2, "s": 4, "model": ["مساحة المستطيل = 14 × 10 = 140 سم<sup>2<\/sup>", "نصف القطر = 7 سم ، مساحة نصف الدائرة = <span class=\"fr\"><span class=\"nu\">1<\/span><span class=\"de\">2<\/span><\/span> × <span class=\"fr\"><span class=\"nu\">22<\/span><span class=\"de\">7<\/span><\/span> × 7 × 7 = 77 سم<sup>2<\/sup>", "المساحة الكلية = 140 + 77 = 217 سم<sup>2<\/sup>"], "rubric": "درجة كاملة: الجزءان والمجموع. نصف الدرجة: جزء واحد صحيح.", "fig": "<svg class=\"fig\" viewBox=\"0 0 330 232\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><path class=\"fs fl\" d=\"M40 90 A120 120 0 0 1 280 90 V200 H40 Z\"/><line class=\"fdash\" x1=\"40\" y1=\"90\" x2=\"280\" y2=\"90\"/><text class=\"ft\" x=\"160\" y=\"222\" text-anchor=\"middle\">14 سم<\/text><text class=\"ft\" x=\"305\" y=\"150\" text-anchor=\"middle\">10 سم<\/text><\/svg>"}, {"id": 128, "type": "mcq", "u": 4, "t": "المستوى الإحداثي", "q": "النقطة <span class=\"pt\">(3 ، -4)<\/span> تقع في الربع:", "w": "الإحداثي السيني موجب (يمين) والصادي سالب (أسفل).<br>(+ ، −) ⇐ الربع الرابع.", "pts": 10, "d": 1, "s": 5, "o": ["الأول", "الثاني", "الثالث", "الرابع"], "a": 3}, {"id": 129, "type": "mcq", "u": 4, "t": "الانعكاس", "q": "صورة النقطة <span class=\"pt\">(2 ، 5)<\/span> بالانعكاس حول محور السينات:", "w": "الانعكاس حول محور السينات يُبقي س كما هي ويغيّر إشارة ص.<br>(س ، ص) ⇐ (س ، -ص).", "pts": 10, "d": 1, "s": 5, "o": ["<span class=\"pt\">(2 ، -5)<\/span>", "<span class=\"pt\">(-2 ، 5)<\/span>", "<span class=\"pt\">(-2 ، -5)<\/span>", "<span class=\"pt\">(5 ، 2)<\/span>"], "a": 0}, {"id": 130, "type": "mcq", "u": 4, "t": "الإزاحة", "q": "صورة النقطة <span class=\"pt\">(1 ، 2)<\/span> بإزاحة 3 وحدات إلى اليمين ووحدتين إلى الأعلى:", "w": "اليمين ⇐ نضيف إلى س ، الأعلى ⇐ نضيف إلى ص.<br>(1 + 3 ، 2 + 2) = (4 ، 4).", "pts": 10, "d": 1, "s": 5, "o": ["<span class=\"pt\">(4 ، 4)<\/span>", "<span class=\"pt\">(-2 ، 4)<\/span>", "<span class=\"pt\">(4 ، 0)<\/span>", "<span class=\"pt\">(3 ، 4)<\/span>"], "a": 0}, {"id": 131, "type": "tf", "u": 4, "t": "الدوران", "q": "الدوران يغيّر أطوال أضلاع الشكل وقياسات زواياه.", "w": "الانعكاس والإزاحة والدوران كلها تحويلات تحافظ على التطابق.<br>يتغيّر الموقع أو الاتجاه فقط.", "pts": 10, "d": 1, "s": 5, "a": false, "fix": "الدوران يحافظ على الأطوال وقياسات الزوايا؛ فالصورة مطابقة للشكل الأصلي."}, {"id": 132, "type": "mcq", "u": 4, "t": "الدوران", "q": "صورة النقطة <span class=\"pt\">(3 ، 1)<\/span> بدوران 180° حول نقطة الأصل:", "w": "الدوران بزاوية 180° حول الأصل يغيّر إشارتي الإحداثيين.<br>(س ، ص) ⇐ (-س ، -ص).", "pts": 10, "d": 1, "s": 5, "o": ["<span class=\"pt\">(-3 ، -1)<\/span>", "<span class=\"pt\">(3 ، -1)<\/span>", "<span class=\"pt\">(-3 ، 1)<\/span>", "<span class=\"pt\">(1 ، 3)<\/span>"], "a": 0}, {"id": 133, "type": "input", "u": 4, "t": "مقاييس النزعة المركزية", "q": "أوجد المتوسط الحسابي للبيانات: 4 ، 8 ، 6 ، 10 ، 7", "w": "المتوسط = مجموع القيم ÷ عددها.<br>(4 + 8 + 6 + 8<\/td><\/tr><tr><td>3<\/td><td>1 4<\/td><\/tr><\/tbody><\/table><div class=\"slk\">المفتاح: 1 | 2 تعني 12<\/div>", "w": "أكبر قيمة 34 (الساق 3 والورقة 4) وأصغر قيمة 12.<br>المدى = 34 − 12 = 22.", "pts": 10, "d": 2, "s": 5, "a": true}, {"id": 140, "type": "error", "u": 4, "t": "مقاييس النزعة المركزية", "q": "اكتشف الخطوة الخاطئة في إيجاد المتوسط الحسابي للبيانات: 6 ، 8 ، 10 ، 12", "w": "المتوسط لا يمكن أن يكون أكبر من أكبر قيمة (12).<br>هذا اختبار سريع لاكتشاف الخطأ.", "pts": 15, "d": 2, "s": 5, "a": 2, "fix": "نقسم على عدد القيم (4): المتوسط = 36 ÷ 4 = 9.", "steps": ["المجموع = 6 + 8 + 10 + 12 = 36", "عدد القيم = 4", "المتوسط = 36 ÷ 2 = 18"]}, {"id": 141, "type": "mcq", "u": 4, "t": "مقاييس النزعة المركزية", "q": "أُضيفت القيمة 50 إلى البيانات: 4 ، 5 ، 6 ، 5. أكثر مقياس يتأثر بهذه الإضافة:", "w": "المتوسط يعتمد على مجموع كل القيم، فيتأثر بشدة بالقيمة المتطرفة.<br>المتوسط قبل: 5 ، وبعد: 70 ÷ 5 = 14.", "pts": 10, "d": 2, "s": 5, "o": ["المنوال", "الوسيط", "المتوسط الحسابي", "لا يتأثر أي مقياس"], "a": 2}, {"id": 142, "type": "mcq", "u": 4, "t": "الانعكاس", "q": "صورة النقطة ب <span class=\"pt\">(-4 ، 3)<\/span> بالانعكاس حول محور الصادات:", "w": "الانعكاس حول محور الصادات يغيّر إشارة س فقط.<br>(س ، ص) ⇐ (-س ، ص).", "pts": 10, "d": 2, "s": 5, "o": ["<span class=\"pt\">(4 ، 3)<\/span>", "<span class=\"pt\">(-4 ، -3)<\/span>", "<span class=\"pt\">(4 ، -3)<\/span>", "<span class=\"pt\">(3 ، -4)<\/span>"], "a": 0}, {"id": 143, "type": "essay", "u": 4, "t": "الإزاحة", "q": "مثلث رؤوسه أ <span class=\"pt\">(1 ، 1)<\/span> ، ب <span class=\"pt\">(4 ، 1)<\/span> ، جـ <span class=\"pt\">(1 ، 3)<\/span>. أوجد إحداثيات رؤوس صورته بإزاحة وحدتين إلى اليسار و 3 وحدات إلى الأسفل، ثم بيّن ماذا يحدث لأطوال أضلاعه.", "w": "اليسار ⇐ نطرح من س ، الأسفل ⇐ نطرح من ص.<br>الإزاحة نقل فقط دون تغيير في الشكل أو القياسات.", "pts": 20, "d": 2, "s": 5, "model": ["القاعدة: (س ، ص) ⇐ (س − 2 ، ص − 3)", "أ ⇐ <span class=\"pt\">(-1 ، -2)<\/span> ، ب ⇐ <span class=\"pt\">(2 ، -2)<\/span> ، جـ ⇐ <span cl <script>

const AR = '٠١٢٣٤٥٦٧٨٩';
function localize(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const p = n.parentNode; if (!p || p.closest && p.closest('.nolocal')) return;
    let t = n.nodeValue;
    if (!/[0-9%]/.test(t)) return;
    t = t.replace(/(\d)\.(\d)/g, '$1٫$2').replace(/\d/g, d => AR[d]).replace(/%/g, '٪');
    n.nodeValue = t;
  });
}
const toAr = s => String(s).replace(/(\d)\.(\d)/g, '$1٫$2').replace(/\d/g, d => AR[d]);
const fmtTime = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60), x = s%60; return toAr(String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0')); };

  tone(f, t0, dur, type='sine', g=0.18, f2){

    }
  }

/* ================= game flow ================= */
function buildPool(){
  const m = mode(), bank = C.banks[S.grade];
  let items;
  if (m.duel){
    let src = bank.filter(q => S.duelPool === 'all' || String(q.d) === String(S.duelPool));
    const per = Math.ceil(S.duelCount / 3); items = [];
    [2,3,4].forEach(u => { const us = shuffle(src.filter(q => q.u === u)).slice(0, per); us.sort((a,b) => (a.d||0)-(b.d||0)); items.push(...us); });
    items = items.slice(0, S.duelCount);
  } else {
    items = bank.filter(q => q[m.filter.k] === m.filter.v);
  }
  const ord = {2:0,3:1,4:2};
  return items.map((q,i) => ({q, i})).sort((a,b) => ord[a.q.u]-ord[b.q.u] || a.i-b.i).map(x => x.q);
}
function startGame(){
  const m = mode();

  S.sess = m.minutes * 60; S.sessRun = true; S.sessWarned = false; S.timersOn = true;

}

/* ================= answering ================= */
function parseNum(s){
  s = String(s).replace(/[٠-٩]/g, d => AR.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٫,،]/g, '.').replace(/[−–—]/g, '-').replace(/⁄|÷/g, '/').replace(/[^\d.\/\- ]/g, ' ').trim();
  if (!s) return NaN;
  const neg = (s.match(/-/g) || []).length % 2 === 1;
  s = s.replace(/-/g, ' ').trim().replace(/\s*\/\s*/g, '/');
  const parts = s.split(/\s+/).filter(Boolean);
  const val = p => { if (p.includes('/')){ const [a,b] = p.split('/').map(Number); return b ? a/b : NaN; } return Number(p); };
  let v;
  if (parts.length === 1) v = val(parts[0]);
  else if (parts.length === 2){
    const fi = parts.findIndex(p => p.includes('/'));
    if (fi < 0) return NaN;
    v = val(parts[1-fi]) + val(parts[fi]);
  } else return NaN;
  return neg ? -v : v;
}
function checkInput(q){
  if (S.phase !== 'ask') return;
  const inp = $('#inp'); const v = parseNum(inp.value);
  if (isNaN(v)){ toast('اكتب إجابة رقمية صحيحة الصيغة'); inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad'); return; }
  const acc = Array.isArray(q.a) ? q.a : [q.a];
  const ok = acc.some(a => Math.abs(a - v) <= 0.01 + Math.abs(a) * 1e-6);
  inp.classList.remove('ok','bad'); void inp.offsetWidth; inp.classList.add(ok ? 'ok' : 'bad');
  settle(q, ok, inp.value);
}
function answerChoice(q, val, btn){
  if (S.phase !== 'ask') return;
  let ok;
  if (q.type === 'tf') ok = (val === q.a);
  else ok = (val === q.a);
  const area = $('#area');
  area.querySelectorAll('button.opt,button.step').forEach(b => b.disabled = true);
  if (ok){ btn.classList.add('right'); }
  else { btn.classList.add('wrong'); if (q.type !== 'tf') S.wrongPicks.push(val); }
  settle(q, ok, val);
}
function revealCorrect(q){
  const area = $('#area'); if (!area) return;
  if (q.type === 'mcq' || q.type === 'step') area.querySelectorAll('.opt').forEach(b => { if (+b.dataset.oi === q.a) b.classList.add('right'); else if (!b.classList.contains('wrong')) b.classList.add('dim'); });
  if (q.type === 'tf') area.querySelectorAll('.opt').forEach(b => { if (String(q.a) === b.dataset.v) b.classList.add('right'); });
  if (q.type === 'error') area.querySelectorAll('.step').forEach(b => { if (+b.dataset.k === q.a) b.classList.add('right'); else if (!b.classList.contains('wrong')) b.classList.add('okstep'); });
  area.querySelectorAll('button.opt,button.step').forEach(b => b.disabled = true);
  const inGo = $('#inGo'); if (inGo){ inGo.disabled = true; $('#inp').disabled = true; area.querySelectorAll('.pad button').forEach(b => b.disabled = true); }
}
function correctText(q){
  if (q.type === 'mcq' || q.type === 'step') return q.o[q.a];
  if (q.type === 'tf') return q.a ? 'صح' : 'خطأ';
  if (q.type === 'error') return `الخطوة ${q.a+1}`;

}
function award(teamIdx, pts){
  if (teamIdx == null) return;
  S.teams[teamIdx].score += pts; renderBoard(teamIdx);
}
function track(q, earned, ok){
  const u = S.unit[q.u] || (S.unit[q.u] = {earned:0, possible:0, n:0, ok:0});
  u.earned += earned; u.possible += q.pts; u.n++; if (ok) u.ok++;
  S.points += earned; S.possible += q.pts; S.answered++; if (ok) S.correct++;
}
function settle(q, ok, given){
  S.qRun = false;
  const team = isTeam() ? (S.attempt === 1 ? S.turn : S.stealer) : null;
  if (ok){
    const pts = S.attempt === 1 ? q.pts : Math.round(q.pts / 2);
    award(team, pts); track(q, pts, true);
    S.streak++; S.best = Math.max(S.best, S.streak);
    S.log.push({q, res: S.attempt === 1 ? 'ok' : 'steal', given});
    Snd.play('ok');
    const fire = S.streak >= 3 && !isTeam();
    coach(fire ? 'fire' : 'happy', fire ? `سلسلة ${S.streak} إجابات صحيحة! أداء أبطال 🏆` : (S.attempt > 1 ? `سرقة ناجحة لـ ${S.teams[S.stealer].name}! 🎯` : pick(SAY.ok)));
    if (S.streak >= 3 && S.streak % 3 === 0) confetti(40);
    showFeedback(q, 'good', pts);
    revealCorrect(q);
  } else {
    S.streak = 0;
    Snd.play('bad');
    const canSteal = isTeam() && S.attempt === 1 && q.type !== 'tf' && q.type !== 'essay';
    if (canSteal){
      S.phase = 'stealq';
      coach('oops', 'إجابة غير صحيحة… هل تُمنح فرصة السرقة؟');
      const fb = $('#fbx'); const nxt = (S.turn + 1) % S.teams.length;
      fb.className = 'fb bad'; fb.innerHTML = `<div class="v">✘ إجابة غير صحيحة من ${S.teams[S.turn].name}</div>
        <div class="actions"><button class="btn btn-main" id="doSteal" style="background:${S.teams[nxt].c};color:#111">🎯 فرصة سرقة: ${S.teams[nxt].name} (${Math.round(q.pts/2)} نقطة)</button><button class="btn btn-ghost" id="doReveal">كشف الإجابة</button></div>`;
      localize(fb);
      $('#doSteal').onclick = () => startSteal(q, nxt);
      $('#doReveal').onclick = () => { track(q, 0, false); S.log.push({q, res:'bad', given}); coach('oops', pick(SAY.bad)); showFeedback(q, 'bad', 0); revealCorrect(q); };
      return;
    }
    track(q, 0, false); S.log.push({q, res: given === '__timeout' ? 'time' : 'bad', given});
    coach(given === '__timeout' ? 'time' : 'oops', given === '__timeout' ? pick(SAY.time) : pick(SAY.bad));
    showFeedback(q, 'bad', 0);
    revealCorrect(q);
  }
}

  if (q.fix) h += `<div class="fix"><span class="kt">🛠 تصحيح الفكرة</span>${q.fix}</div>`;

function showModel(q){

    <div class="kicker" style="margin-top:.8rem">${isTeam() ? 'قيّم إجابة ' + S.teams[S.turn].name + ':' : 'قيّم إجابتك بصدق:'}</div>
    <div class="grade-row"><button class="btn g-full" data-g="1">✔ إجابة كاملة (${q.pts})</button><button class="btn g-half" data-g=".5">◐ إجابة جزئية (${q.pts/2})</button><button class="btn g-zero" data-g="0">✘ لم تكتمل (0)</button></div>`;
  $('#area .essay').appendChild(box); localize(box);
  coach('think', 'قارن إجابتك بالنموذج خطوة بخطوة، ثم قيّمها.');
  box.querySelectorAll('.grade-row button').forEach(b => b.onclick = () => {
    const g = +b.dataset.g, pts = Math.round(q.pts * g);
    box.querySelectorAll('.grade-row button').forEach(x => x.disabled = true); b.style.outline = '3px solid var(--ink)';
    award(isTeam() ? S.turn : null, pts);
    const ok = g === 1;
    track(q, pts, ok);
    S.log.push({q, res: g === 1 ? 'ok' : g > 0 ? 'half' : 'bad'});
    if (g > 0){ S.streak = g === 1 ? S.streak + 1 : 0; Snd.play('ok'); coach('happy', g === 1 ? pick(SAY.ok) : 'خطوة جيدة! أكمل ما نقص في المرة القادمة.'); }
    else { S.streak = 0; Snd.play('bad'); coach('oops', 'راجع الإجابة النموذجية جيدًا — الطريقة أهم من الناتج.'); }
    S.best = Math.max(S.best, S.streak);
    showFeedback(q, g === 1 ? 'good' : g > 0 ? 'half' : 'bad', pts);
  });
}
function nextQ(){
  Snd.play('click');
  if (isTeam()) S.turn = (S.turn + 1) % S.teams.length;
  S.i++;
  if (S.i >= S.pool.length) return finish();
  if (S.pool[S.i].u !== S.pool[S.i-1].u){ Snd.play('round'); showRound(); }
  else renderPlay();
}
function skipQ(){
  if (S.screen !== 'play') return;
  if (S.phase === 'done'){ nextQ(); return; }
  if (S.phase === 'stealq' || S.phase === 'grading'){ toast('أكمل التقييم أو اكشف الإجابة أولًا'); return; }
  const q = S.pool[S.i]; S.log.push({q, res:'skip'});
  toast('تم تخطّي السؤال (لا يُحتسب في الإتقان)');
  nextQ();
}

/* ================= board & timers ================= */
function renderBoard(bumpIdx){
  const bd = $('#board'); if (!bd) return;
  if (isTeam()){
    const cur = S.attempt > 1 && S.stealer != null ? S.stealer : S.turn;
    bd.innerHTML = `<h3><span>🏆 لوحة النقاط</span><span>${mode().teams === 2 ? 'مبارزة' : 'مجموعات'}</span></h3>` + S.teams.map((t,i) => `
      <div class="team${i === cur && S.screen === 'play' ? ' now' : ''}${i === bumpIdx ? ' bump' : ''}" style="--tc:${t.c}"><i style="background:${t.c}"></i><span class="nm">${t.name}</span><b class="sc">${t.score}</b>
      <span class="adj no-print"><button data-i="${i}" data-d="5" title="+٥">+</button><button data-i="${i}" data-d="-5" title="−٥">−</button></span></div>`).join('');
    bd.querySelectorAll('.adj button').forEach(b => b.onclick = () => { const i = +b.dataset.i; S.teams[i].score = Math.max(0, S.teams[i].score + (+b.dataset.d)); Snd.play('click'); renderBoard(i); });
  } else {
    const acc = S.possible ? Math.round(S.points / S.possible * 100) : 0;
    bd.innerHTML = `<h3><span>${needName() ? '👤 ' + esc(S.student) : '📊 أداء الصف'}</span><span>🔥 ${S.streak}</span></h3><div class="solo"><div><b>${S.points}</b><small>النقاط</small></div><div><b>${acc}%</b><small>الإتقان</small></div><div><b>${S.best}</b><small>أطول سلسلة</small></div></div>`;
  }
  localize(bd);
}
let ticker = null;
function startTicker(){ if (ticker) clearInterval(ticker); ticker = setInterval(tick, 1000); }
function stopTimers(){ if (ticker) clearInterval(ticker); ticker = null; }
function tick(){
  if (S.sessRun && S.sess > 0){
    S.sess--;
    if (S.sess === 300 && !S.sessWarned){ S.sessWarned = true; toast('⏳ بقيت ٥ دقائق على نهاية الحصة'); Snd.play('bell'); }
    if (S.sess === 0){ toast('🔔 انتهى وقت الحصة! أكمل السؤال الحالي ثم اعرض النتائج.', 5000); Snd.play('bell'); }
  }
  if (S.screen === 'play' && S.qRun && S.phase === 'ask'){
    S.q--;
    const q = S.pool[S.i];
    if (S.q > 0){ if (q.type === 'tf' || S.q <= 5) Snd.play(S.q <= 5 ? 'tock' : 'tick'); }
    if (S.q <= 0){ S.q = 0; S.qRun = false; Snd.play('timeout'); timeout(q); }
  }
  updTimers();
}
function timeout(q){
  const area = $('#area'); if (area) area.querySelectorAll('button.opt,button.step').forEach(b => b.disabled = true);
  if (q.type === 'essay'){ coach('time', 'انتهى الوقت! اعرض الإجابة النموذجية وقيّم ما كُتب.'); S.q = 0; updTimers(); return; }
  settle(q, false, '__timeout');
}
function updTimers(){
  const sv = $('#sVal'); if (!sv) return;
  sv.textContent = fmtTime(S.sess); sv.classList.toggle('low', S.sess <= 300);
  const qv = $('#qVal'), arc = $('#qArc');
  qv.textContent = toAr(Math.max(0, S.q));
  const frac = S.qMax ? Math.max(0, S.q) / S.qMax : 0;
  arc.style.strokeDashoffset = String(169.6 * (1 - frac));
  arc.style.stroke = frac < .25 ? 'var(--bad)' : frac < .5 ? 'var(--warn)' : 'var(--acc)';
}
function togglePause(){
  const running = S.sessRun || S.qRun;
  if (running){ S.sessRun = false; S.qRun = false; S._paused = true; toast('⏸ تم إيقاف المؤقت — وقت الشرح'); }
  else { S.sessRun = true; if (S.phase === 'ask' && S.timersOn && S.q > 0) S.qRun = true; S._paused = false; toast('▶ استئناف'); }
  Snd.play('click'); syncPauseBtn();
}
function syncPauseBtn(){ const b = $('#tPause'); if (!b) return; const running = S.sessRun || S.qRun; b.textContent = running ? '⏸ إيقاف' : '▶ تشغيل'; b.classList.toggle('on', !running); }
function toggleTimers(){
  S.timersOn = !S.timersOn;
  S.qRun = S.timersOn && S.phase === 'ask' && !S._paused;
  const b = $('#tToggle'); b.textContent = S.timersOn ? '⏱ المؤقت: يعمل' : '⏱ المؤقت: متوقف'; b.classList.toggle('on', S.timersOn);
  toast(S.timersOn ? 'مؤقت الأسئلة مفعّل' : 'مؤقت الأسئلة متوقف — أجب براحتك');
  Snd.play('click');
}

/* ================= results ================= */
function finish(){
  S.screen = 'results'; S.qRun = false; S.sessRun = false; stopTimers();
  Snd.play('done'); confetti(90);
  const g = grade(), m = mode();
  const app = $('#app'); app.innerHTML = '';
  const pct = S.possible ? Math.round(S.points / S.possible * 100) : 0;
  const head = el('section', 'card res-head');
  const circ = 2 * Math.PI * 62;
  const rate = pct >= 90 ? ['ممتاز 🏆','var(--ok)'] : pct >= 75 ? ['جيد جدًا 🌟','var(--acc)'] : pct >= 60 ? ['جيد 👍','var(--warn)'] : ['تحتاج مزيدًا من المراجعة 💪','var(--bad)'];
  const today = new Date().toLocaleDateString('ar-KW', {year:'numeric', month:'long', day:'numeric'});
  let right;
  if (needName()){
    right = `<div><div class="kicker">${m.title} • ${g.label} • ${today}</div>
      <div class="stu">اسم الطالب: <b>${esc(S.student)}</b></div>
      <h1 class="hd" style="font-size:clamp(1.5rem,3vw,2.2rem)">🏁 نتيجتك: ${S.points} من ${S.possible} نقطة</h1>
      <div class="rate" style="color:${rate[1]};border-color:${rate[1]}">التقدير: ${rate[0]} — ${pct}%</div>
      <p style="color:var(--mut)">أجبت عن ${S.answered} سؤالًا • صحيحة بالكامل: ${S.correct} • أطول سلسلة: ${S.best}</p>`;
  } else {
    right = `<div><div class="kicker">${m.title} • ${g.label}</div><h1 class="hd" style="font-size:clamp(1.5rem,3vw,2.2rem)">🏁 انتهت الجولة!</h1>
    <p style="color:var(--mut)">أُجيب عن ${S.answered} سؤالًا • صحيحة بالكامل: ${S.correct} • أطول سلسلة: ${S.best}</p>`;
  }
  if (isTeam()){
    const ranked = S.teams.map((t,i) => ({...t, i})).sort((a,b) => b.score - a.score);
    const medals = ['🥇','🥈','🥉','🏅'];
    right += `<div class="podium">${ranked.map((t,k) => `<div class="pod${k === 0 ? ' first' : ''}"><span class="rk">${medals[k]}</span><i style="background:${t.c}"></i><b>${t.name}</b><b>${t.score} نقطة</b></div>`).join('')}</div>`;
  }
  right += '</div>';
  head.innerHTML = `<div class="score-ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" stroke="var(--bg2)"/><circle cx="75" cy="75" r="62" stroke="url(#rg)" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct/100)}"/><defs><linearGradient id="rg"><stop offset="0" stop-color="var(--acc)"/><stop offset="1" stop-color="var(--acc2)"/></linearGradient></defs></svg><b>${pct}%<small>${needName() ? 'نسبة الإتقان' : 'إتقان الصف'}</small></b></div>` + right;
  app.appendChild(head);

  app.appendChild(el('h2', 'sec hd', '📈 مستوى الإتقان لكل وحدة'));
  const ms = el('section', 'card mast');
  const units = [2,3,4].filter(u => S.unit[u]);
  if (!units.length) ms.innerHTML = '<div class="hint">لم تتم الإجابة عن أسئلة بعد.</div>';
  units.forEach(u => {
    const d = S.unit[u], p = d.possible ? Math.round(d.earned / d.possible * 100) : 0;
    const lv = p >= 80 ? ['متقن ✅ — حافظوا على المستوى بتدريبات سريعة.', 'var(--ok)'] : p >= 60 ? ['جيد 👍 — يحتاج تثبيتًا لبعض المفاهيم.', 'var(--warn)'] : ['يحتاج تركيزًا إضافيًا ⚠️ — أعد شرح القواعد الأساسية لهذه الوحدة.', 'var(--bad)'];
    const missed = [...new Set(S.log.filter(x => x.q.u === u && x.res !== 'ok' && x.res !== 'skip').map(x => x.q.t))];
    const row = el('div', 'mrow');
    row.innerHTML = `<div><b>الوحدة ${UNITN[u]}</b><small>${g.units[u]}</small></div><div class="bar"><i style="width:0;background:${lv[1]}"></i></div><b class="pc">${p}%</b>
      <div class="lvl" style="background:color-mix(in srgb,${lv[1]} 12%,transparent);border:1px solid color-mix(in srgb,${lv[1]} 45%,transparent)">${lv[0]}${missed.length ? '<br><span style="color:var(--mut)">مفاهيم للمراجعة: </span>' + missed.join(' • ') : ''}</div>`;
    ms.appendChild(row);
    setTimeout(() => { row.querySelector('.bar i').style.width = p + '%'; }, 200);
  });
  app.appendChild(ms);

  const miss = S.log.filter(x => x.res !== 'ok' && x.res !== 'skip');
  if (miss.length){
    app.appendChild(el('h2', 'sec hd', '🧠 مراجعة الأسئلة التي تحتاج تثبيتًا'));
    const rv = el('section', 'card review');
    miss.forEach(x => {
      const q = x.q;
      const ans = q.type === 'essay' ? q.model.join('<br>') : correctText(q);
      rv.appendChild(el('div', 'rv', `<div class="rq"><span class="badge">${TYPE_L[q.type]}</span> ${q.q.replace(/<table[\s\S]*<\/div>$/, '')}</div><div class="ra">✔ ${ans}</div><div class="rw">🔑 ${q.w}</div>`));
    });
    app.appendChild(rv);
  }
  const act = el('div', 'actions no-print'); act.style.justifyContent = 'center';
  act.innerHTML = `<button class="btn btn-main" id="again">🔁 إعادة الجولة</button><button class="btn btn-ghost" id="home">🏠 اختيار جولة أخرى</button><button class="btn btn-ghost" id="prn">🖨 طباعة التقرير</button>${needName() ? '<button class="btn btn-ghost" id="newStu">👤 طالب جديد</button>' : ''}`;
  app.appendChild(act);
  app.appendChild(el('div', 'foot', C.footer));
  $('#again').onclick = () => { Snd.play('round'); startGame(); };
  $('#home').onclick = () => { Snd.play('click'); renderSetup(); };
  $('#prn').onclick = () => window.print();
  if ($('#newStu')) $('#newStu').onclick = () => { Snd.play('click'); S.student = ''; store.set('stu_'+C.key, ''); renderSetup(); setTimeout(() => { const i = $('#stuName'); if (i){ i.scrollIntoView({block:'center'}); i.focus(); } }, 80); };
  localize(app);
  window.scrollTo({top:0, behavior:'smooth'});
}
function confetti(n){
  const box = $('#confetti'); const cols = ['var(--acc)','var(--acc2)','var(--warn)','var(--ok)','#fff'];
  for (let k = 0; k < n; k++){
    const i = document.createElement('i');
    i.style.left = Math.random()*100 + 'vw'; i.style.background = pick(cols);
    i.style.animationDuration = (1.8 + Math.random()*1.8) + 's'; i.style.animationDelay = (Math.random()*.4) + 's';
    i.style.transform = `rotate(${Math.random()*360}deg)`;
    box.appendChild(i); setTimeout(() => i.remove(), 4200);
  }
}

/* ================= global controls ================= */
let fs = store.get('fs_'+C.key, 1);
const applyFs = () => document.documentElement.style.setProperty('--fs', fs);
applyFs();
$('#bFsp').onclick = () => { fs = Math.min(1.5, +(fs + .1).toFixed(2)); applyFs(); store.set('fs_'+C.key, fs); Snd.play('click'); };
$('#bFsm').onclick = () => { fs = Math.max(.8, +(fs - .1).toFixed(2)); applyFs(); store.set('fs_'+C.key, fs); Snd.play('click'); };
$('#bFull').onclick = () => { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch(e){} };
$('#bSnd').onclick = () => { Snd.on = !Snd.on; store.set('snd_on', Snd.on); sndIcon(); if (Snd.on){ Snd.init(); Snd.play('select'); } toast(Snd.on ? '🔊 الصوت مفعّل' : '🔇 تم كتم الصوت'); };
$('#bHome').onclick = () => { if (S.screen === 'play' || S.screen === 'round'){ if (!confirm('العودة للرئيسية؟ سيتم إنهاء الجولة الحالية.')) return; } renderSetup(); };
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (S.screen !== 'play') return;
  if (e.code === 'Space'){ e.preventDefault(); togglePause(); }
  else if (e.key === 'Enter'){ const n = $('#nextQ'); if (n) n.click(); }
  else if (e.key.toLowerCase() === 'm'){ $('#bSnd').click(); }
  else if (/^[1-4]$/.test(e.key) && $('#area')){ const all = $('#area').querySelectorAll('button.opt,button.step'); const b = all[+e.key - 1]; if (b && !b.disabled) b.click(); }
});
sndIcon();
renderSetup();
})();
</script>
</body>
</html>
