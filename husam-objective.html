:root{--p:#0f2a5c;--p2:#1d3f86;--acc:#c9a24a;--bg:#f4f6fb;--card:#fff;--ink:#14213a;--mut:#62708a;--line:#dfe5ef;--ok:#14a05a;--okbg:#e6f7ee;--bad:#d6334a;--badbg:#fdecef;--fs:1}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--fs))}
body{font-family:"AB",Arial,Tahoma,sans-serif;font-weight:700;background:var(--bg);color:var(--ink);line-height:1.75;min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;font-weight:700;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:.55rem .9rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 4px 18px -8px rgba(0,0,0,.4)}
.lg{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px var(--acc)}
.lg img{width:100%;height:100%;object-fit:contain}
.bt{flex:1;min-width:0;line-height:1.3}
.bt b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small{display:block;font-size:.72rem;opacity:.85}
.hb{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;font-size:1.05rem;flex:0 0 auto}
.hb svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hb.off{opacity:.55}
main{max-width:760px;margin:0 auto;padding:1rem .85rem 3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px -20px rgba(20,33,58,.45)}
.hero{text-align:center;padding:1.6rem 1.2rem 1.3rem;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--p),var(--acc))}
.hero .big{width:118px;height:118px;margin:0 auto .7rem;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--acc),0 10px 26px -12px var(--p);overflow:hidden;display:grid;place-items:center;padding:4px}
.hero .big img{width:100%;height:100%;object-fit:contain}
.hero h1{font-size:1.9rem;color:var(--p);line-height:1.3}
.hero p{color:var(--mut);margin-top:.25rem}
.pill{display:inline-block;margin-top:.6rem;padding:.25rem .9rem;border-radius:99px;background:color-mix(in srgb,var(--acc) 16%,#fff);color:var(--p);font-size:.85rem;border:1px solid color-mix(in srgb,var(--acc) 45%,#fff)}
.sec{margin:1.2rem .2rem .55rem;font-size:1.05rem;color:var(--p);display:flex;gap:.5rem;align-items:center}
.sec i{font-style:normal;width:28px;height:28px;border-radius:9px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:.9rem}
.namebox{padding:1rem}
.namebox input{width:100%;padding:.85rem 1rem;border-radius:14px;border:2px solid var(--line);font-size:1.15rem;outline:none;background:#fbfcfe}
.namebox input:focus{border-color:var(--acc)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem}
.gr{padding:.6rem .3rem;border-radius:16px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.gr b{font-size:1.7rem;color:var(--p)}.gr span{font-size:.78rem;color:var(--mut)}
.gr.on{border-color:var(--p);background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 18%,#fff),#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.pimg{display:block;max-width:100%;height:auto;margin:.6rem auto .2rem;border-radius:10px;mix-blend-mode:multiply}
.oimg{max-width:100%;height:auto;mix-blend-mode:multiply;vertical-align:middle}
.ang{white-space:nowrap}
.units{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.unit{padding:.85rem .9rem;border-radius:16px;border:2px solid var(--line);background:#fff;text-align:right;display:flex;flex-direction:column;gap:.15rem;transition:.15s}
.unit b{font-size:1.02rem;color:var(--p)}
.unit span{font-size:.8rem;color:var(--mut);line-height:1.5}
.unit em{font-style:normal;font-size:.78rem;color:var(--acc)}
.unit.all{grid-column:1/-1;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 8%,#fff),#fff)}
.unit.on{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.go{display:block;width:100%;margin-top:1.1rem;padding:1rem;border-radius:16px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:1.2rem;box-shadow:0 10px 22px -12px var(--p)}
.go:disabled{opacity:.45}
.foot{text-align:center;color:var(--mut);font-size:.8rem;margin-top:1.4rem;line-height:1.8}
.top{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem;flex-wrap:wrap}
.chip{padding:.2rem .75rem;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:.82rem;color:var(--mut)}
.chip.sc{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,#fff)}
.prog{flex:1 1 100%;height:9px;border-radius:99px;background:#e8edf5;overflow:hidden;order:9}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--acc));transition:width .35s;border-radius:99px}
.qc{padding:1.1rem 1.05rem 1.1rem;position:relative}
.qtag{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.55rem}
.tag{font-size:.78rem;padding:.15rem .65rem;border-radius:99px;background:color-mix(in srgb,var(--p) 9%,#fff);color:var(--p)}
.tag.t2{background:color-mix(in srgb,var(--acc) 16%,#fff)}
.secnote{font-size:.85rem;color:var(--mut);background:#f6f8fc;border-radius:12px;padding:.45rem .7rem;margin-bottom:.6rem}
.qn{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 .4rem;border-radius:50%;background:var(--p);color:#fff;font-size:.95rem;margin-inline-end:.45rem;vertical-align:middle}
.qt{font-size:1.28rem;line-height:2}
.fig{display:block;width:100%;max-width:360px;margin:.7rem auto .2rem}
.fig .fl{fill:none;stroke:var(--ink);stroke-width:2.4}
.fig .fred{stroke:#e0262f;stroke-width:3.5;fill:none}
.fig .fopen{fill:#fff;stroke:#e0262f;stroke-width:2.5}
.fig .ft{fill:var(--ink);font-size:17px;font-family:"AB",Arial,sans-serif;font-weight:700}
.fig .ft.sm{font-size:13px}.fig .ft.hi{fill:var(--p)}
.fig .fbox1{fill:#16b1e8;stroke:var(--ink);stroke-width:1.5}.fig .fbox2{fill:#9e1c66;stroke:var(--ink);stroke-width:1.5}
.fig .fgrid{stroke:#b9c3d3;stroke-width:1;stroke-dasharray:2 3}
.fig .fpoly{fill:none;stroke:#1a8ad8;stroke-width:2.5}.fig .fdot{fill:var(--ink)}
.fig .farr{fill:none;stroke:var(--ink);stroke-width:2}
table.tb{border-collapse:collapse;margin:.7rem auto .2rem;font-size:1.05rem}
table.tb th,table.tb td{border:2px solid #29a6e0;padding:.3rem .8rem;text-align:center}
table.tb th{background:#d8f0fb;color:var(--ink)}
.opts{display:grid;gap:.6rem;margin-top:.9rem}
.opts.two{grid-template-columns:1fr 1fr}
.op{display:flex;align-items:center;gap:.7rem;text-align:right;padding:.7rem .85rem;border-radius:15px;border:2px solid var(--line);background:#fbfcfe;font-size:1.18rem;min-height:58px;transition:.15s}
.op .k{flex:0 0 auto;width:36px;height:36px;border-radius:11px;border:2px solid #9aa6ba;display:grid;place-items:center;font-size:1rem;color:var(--ink);background:#fff}
.op:active:not(:disabled){transform:scale(.98)}
@media (hover:hover){.op:hover:not(:disabled){border-color:var(--acc);background:#fff}}
.op:disabled{cursor:default}
.op.right{border-color:var(--ok);background:var(--okbg)}.op.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.op.wrong{border-color:var(--bad);background:var(--badbg);animation:sh .35s}.op.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.op.dim{opacity:.5}
@keyframes sh{25%{transform:translateX(5px)}50%{transform:translateX(-5px)}75%{transform:translateX(3px)}}
.fb{margin-top:.9rem;border-radius:16px;padding:.85rem .95rem;animation:up .3s ease;border:2px solid}
.fb.good{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 45%,#fff)}
.fb.bad{background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 40%,#fff)}
.fb .v{font-size:1.15rem}.fb.good .v{color:var(--ok)}.fb.bad .v{color:var(--bad)}
.fb .ca{margin-top:.3rem;font-size:1.05rem}
.fb .why{margin-top:.5rem;padding-top:.5rem;border-top:1px dashed rgba(0,0,0,.15);font-size:1.02rem;line-height:1.95}
.fb .why b{color:var(--p)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav{display:flex;gap:.6rem;margin-top:1rem}
.nx{flex:1;padding:.85rem;border-radius:15px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:1.1rem}
.nx.ghost{flex:0 0 auto;background:#fff;color:var(--p);border:2px solid var(--line)}
/* math */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .14em;line-height:1.1;font-size:.88em}
.fr>.nu{padding:0 .22em .05em;border-bottom:2px solid currentColor}.fr>.de{padding:.05em .22em 0}
.mx{display:inline-flex;align-items:center;vertical-align:middle;gap:.04em}
.ng{display:inline-flex;align-items:center;vertical-align:middle;white-space:nowrap}
sup{unicode-bidi:isolate;font-size:.62em;line-height:0;position:relative;top:-.55em;vertical-align:baseline;margin:0 .04em}
.rt{display:inline-flex;align-items:stretch;vertical-align:middle;position:relative;margin:0 .12em}
.rs{display:inline-block;transform:scaleX(-1);font-size:1.15em;line-height:1;padding-top:.06em}
.rr{border-top:2px solid currentColor;padding:.08em .22em 0;display:inline-flex;align-items:center;margin-top:.12em}
.rt:has(.fr)>.rs{font-size:2em;line-height:.95}
.pt{white-space:nowrap;display:inline-block}
.ov{text-decoration:overline;text-decoration-thickness:2px}
.ovl{border-top:2px solid currentColor;padding-top:1px}
.ab{display:inline-block;transform:scaleY(1.25);margin:0 .12em}
.tri{font-family:Arial,sans-serif}
/* result */
.res{padding:1.4rem 1.1rem;text-align:center;position:relative;overflow:hidden}
.res::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--p),var(--acc))}
.res .nm{font-size:1.05rem;color:var(--mut)}.res .nm b{color:var(--p);font-size:1.35rem}
.ring{width:170px;height:170px;margin:.9rem auto .4rem;position:relative}
.ring svg{width:170px;height:170px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;color:var(--p);line-height:1.1}
.ring b small{display:block;font-size:.85rem;color:var(--mut)}
.res h2{font-size:1.45rem}
.rate{display:inline-block;margin-top:.5rem;padding:.3rem 1.1rem;border-radius:99px;font-size:1.05rem;border:2px solid}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem}
.stats div{background:#f6f8fc;border-radius:14px;padding:.55rem .2rem}
.stats b{display:block;font-size:1.4rem}.stats small{color:var(--mut);font-size:.78rem}
.ub{padding:1rem 1.05rem;display:grid;gap:.85rem}
.ur{display:grid;grid-template-columns:1fr auto;gap:.3rem .7rem;align-items:center}
.ur .bar{grid-column:1/-1;height:12px;border-radius:99px;background:#e8edf5;overflow:hidden}
.ur .bar i{display:block;height:100%;border-radius:99px;transition:width 1s}
.ur small{color:var(--mut);font-size:.8rem}
.acts{display:grid;gap:.6rem;margin-top:1rem}
.acts button{padding:.85rem;border-radius:15px;font-size:1.05rem;border:2px solid var(--line);background:#fff;color:var(--p)}
.acts button.pri{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0}
.rv{padding:.8rem .95rem;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:.6rem}
.rv .q{font-size:1rem;line-height:1.9}.rv .a{color:var(--ok);margin-top:.25rem}.rv .y{color:var(--bad);font-size:.92rem}
.rv .w{color:var(--mut);font-size:.9rem;margin-top:.2rem}
.contact{display:inline-block;margin-top:.4rem;direction:ltr}
.toast{position:fixed;left:50%;bottom:1rem;transform:translate(-50%,200%);opacity:0;background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:12px;transition:.3s;z-index:50;font-size:.95rem}
.toast.show{transform:translate(-50%,0);opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:15px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:520px){.units{grid-template-columns:1fr}.qt{font-size:1.15rem}.op{font-size:1.08rem}.opts.two{grid-template-columns:1fr}.hero h1{font-size:1.6rem}}
@media print{header,.acts,.nav{display:none!important}body{background:#fff}}
</style>
</head>

30.0\" y2=\"58\"/><line class=\"fl\" x1=\"330.0\" y1=\"42\" x2=\"330.0\" y2=\"58\"/><rect class=\"fbox1\" x=\"105.0\" y=\"36\" width=\"45.0\" height=\"28\"/><rect class=\"fbox2\" x=\"150.0\" y=\"36\" width=\"105.0\" height=\"28\"/><text class=\"ft sm\" x=\"30.0\" y=\"28\" text-anchor=\"middle\">35<\/text><text class=\"ft sm\" x=\"105.0\" y=\"28\" text-anchor=\"middle\">40<\/text><text class=\"ft sm\" x=\"150.0\" y=\"28\" text-anchor=\"middle\">43<\/text><text class=\"ft sm\" x=\"255.0\" y=\"28\" text-anchor=\"middle\">50<\/text><text class=\"ft sm\" x=\"330.0\" y=\"28\" text-anchor=\"middle\">55<\/text><line class=\"fl\" x1=\"16\" y1=\"88\" x2=\"344\" y2=\"88\"/><path class=\"fl\" d=\"M12 88 l9 -5 M12 88 l9 5 M348 88 l-9 -5 M348 88 l-9 5\"/><line class=\"fl\" x1=\"30.0\" y1=\"82\" x2=\"30.0\" y2=\"94\"/><text class=\"ft sm\" x=\"30.0\" y=\"112\" text-anchor=\"middle\">35<\/text><line class=\"fl\" x1=\"105.0\" y1=\"82\" x2=\"105.0\" y2=\"94\"/><text class=\"ft sm\" x=\"105.0\" y=\"112\" text-anchor=\"middle\">40<\/text><line class=\"fl\" x1=\"180.0\" y1=\"82\" x2=\"180.0\" y2=\"94\"/><text class=\"ft sm\" x=\"180.0\" y=\"112\" text-anchor=\"middle\">45<\/text><line class=\"fl\" x1=\"255.0\" y1=\"82\" x2=\"255.0\" y2=\"94\"/><text class=\"ft sm\" x=\"255.0\" y=\"112\" text-anchor=\"middle\">50<\/text><line class=\"fl\" x1=\"330.0\" y1=\"82\" x2=\"330.0\" y2=\"94\"/><text class=\"ft sm\" x=\"330.0\" y=\"112\" text-anchor=\"middle\">55<\/text><\/svg>", "sec": ""}, {"u": 4, "n": 16, "type": "mcq", "q": "إذا كان الترجيح لحدث ما يساوي 2 : 3 ، فإنّ احتمال وقوع هذا الحدث يساوي:", "o": ["<span class=\"fr\"><span class=\"nu\">2<\/span><span class=\"de\">5<\/span><\/span>", "<span class=\"fr\"><span class=\"nu\">2<\/span><span class=\"de\">3<\/span><\/span>", "<span class=\"fr\"><span class=\"nu\">3<\/span><span class=\"de\">2<\/span><\/span>", "<span class=\"fr\"><span class=\"nu\">3<\/span><span class=\"de\">5<\/span><\/span>"], "a": 0, "w": "الاحتمال = <span class=\"fr\"><span class=\"nu\">2<\/span><span class=\"de\">2 + 3<\/span><\/span> = <span class=\"fr\"><span class=\"nu\">2<\/span><span class=\"de\">5<\/span><\/span>.", "fig": "", "sec": ""}, {"u": 4, "n": 17, "type": "mcq", "q": "إذا كان احتمال وقوع حدث ما <span class=\"fr\"><span class=\"nu\">5<\/span><span class=\"de\">13<\/span><\/span> ، فإنّ ترجيح هذا الحدث هو:", "o": ["8 : 13", "5 : 18", "8 : 5", "5 : 8"], "a": 3, "w": "عدد مرات الوقوع 5 وعدم الوقوع 13 - 5 = 8 ⇐ الترجيح 5 : 8.", "fig": "", "sec": ""}, {"u": 4, "n": 18, "type": "mcq", "q": "ترجيح ظهور عدد يقبل القسمة على 3 عند رمي مكعّب منتظم مرقَّم من 1 إلى 6 مرّة واحدة هو:", "o": ["1 : 3", "1 : 2", "2 : 1", "3 : 1"], "a": 1, "w": "الأعداد {3 ، 6} عددان، وغيرها 4 أعداد ⇐ 2 : 4 = 1 : 2.", "fig": "", "sec": ""}]}}};</script>
<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const AR = '٠١٢٣٤٥٦٧٨٩';
const LET = ['أ','ب','جـ','د','هـ'];
const UN = {1:'الأولى',2:'الثانية',3:'الثالثة',4:'الرابعة'};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function localize(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), ns = [];
  while (w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n => { const p = n.parentNode; if (p && p.closest && p.closest('.nolocal')) return; let t = n.nodeValue; if (!/[0-9%]/.test(t)) return;
    n.nodeValue = t.replace(/(\d)\.(\d)/g, '$1٫$2').replace(/\d/g, d => AR[d]).replace(/%/g, '٪'); });
}
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- sounds (Web Audio API, no files) ---------- */
const Snd = { ctx:null, on: store.get('q_snd', true),
  init(){ if (!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  t(f, s, d, type='sine', g=.16, f2){ const c = this.ctx; if (!c) return; const o = c.createOscillator(), a = c.createGain(), t0 = c.currentTime + s;
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    a.gain.setValueAtTime(.0001, t0); a.gain.exponentialRampToValueAtTime(g, t0 + .012); a.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(a); a.connect(c.destination); o.start(t0); o.stop(t0 + d + .03); },
  play(n){ if (!this.on) return; this.init(); if (!this.ctx) return;
    if (n === 'tap') this.t(1250, 0, .05, 'sine', .07);
    if (n === 'start'){ this.t(330, 0, .3, 'sine', .08, 880); this.t(660, .22, .3, 'triangle', .08, 1320); }
    if (n === 'ok'){ [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => this.t(f, i*.07, .22, 'triangle', .15)); }
    if (n === 'bad'){ this.t(392, 0, .2, 'sine', .12, 330); this.t(311, .16, .3, 'sine', .1, 247); }
    if (n === 'next') this.t(880, 0, .07, 'triangle', .07, 1100);
    if (n === 'done'){ [523.25,659.25,783.99,659.25,783.99,1046.5].forEach((f,i) => this.t(f, i*.12, i === 5 ? .6 : .2, 'triangle', .15)); [261.63,329.63,392].forEach(f => this.t(f, .62, .7, 'sine', .06)); }
  } };
function sIco(){ $('#sIco').innerHTML = Snd.on ? '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"/>' : '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'; $('#bSnd').classList.toggle('off', !Snd.on); }
$('#bSnd').onclick = () => { Snd.on = !Snd.on; store.set('q_snd', Snd.on); sIco(); if (Snd.on){ Snd.init(); Snd.play('tap'); } toast(Snd.on ? '🔊 الصوت مفعّل' : '🔇 تم كتم الصوت'); };

/* ---------- state ---------- */
const qg = (new URLSearchParams(location.search)).get('g');
const S = { name: store.get('q_name_'+C.key, ''), g: (qg && C.grades[qg]) ? qg : store.get('q_g_'+C.key, Object.keys(C.grades)[0]), unit: 'all', list: [], i: 0, ans: [], screen: 'start' };
if (!C.grades[S.g]) S.g = Object.keys(C.grades)[0];
const GR = () => C.grades[S.g];
const subj = () => 'رياضيات ' + GR().label + ' • الفصل الدراسي الأول';

/* ---------- start ---------- */
function start(){
  S.screen = 'start';
  const app = $('#app'), Q = GR().q, units = Object.keys(GR().units).map(Number);
  const cnt = u => Q.filter(q => q.u === u).length;
  app.innerHTML = `<section class="card hero"><div class="big"><img src="${C.logo}" alt=""></div>
      <h1>الأسئلة الموضوعية</h1><p>رياضيات • الفصل الدراسي الأول • الوحدات ${units[0]} – ${units[units.length-1]}</p><span class="pill">صح وخطأ • اختيار من متعدد • من البنود الموضوعية في تقويم الوحدات</span></section>
    <div class="sec"><i>1</i>اكتب اسمك</div>
    <div class="card namebox"><input id="nm" class="nolocal" maxlength="40" placeholder="اسم الطالب الثلاثي" autocomplete="name" value="${esc(S.name)}"></div>
    <div class="sec"><i>2</i>اختر الصف</div>
    <div class="grades">${Object.keys(C.grades).map(g => `<button class="gr" data-g="${g}"><b>${g}</b><span>${C.grades[g].label}</span></button>`).join('')}</div>
    <div class="sec"><i>3</i>اختر الوحدة</div>
    <div class="units">
      <button class="unit all" data-u="all"><b>📚 جميع الوحدات</b><span>${GR().label}: البنود الموضوعية في تقويم الوحدات ${units.join(' و ')}</span><em>${Q.length} سؤالًا</em></button>
      ${units.map(u => `<button class="unit" data-u="${u}"><b>الوحدة ${UN[u]}</b><span>${GR().units[u]}</span><em>${cnt(u)} سؤالًا</em></button>`).join('')}
    </div>
    <button class="go" id="go">ابدأ ▶</button>
    <div class="foot">${C.footer}</div>`;
  const nm = $('#nm'), go = $('#go');
  const sync = () => { go.disabled = S.name.trim().length < 2;
    app.querySelectorAll('.unit').forEach(b => b.classList.toggle('on', b.dataset.u === String(S.unit)));
    app.querySelectorAll('.gr').forEach(b => b.classList.toggle('on', b.dataset.g === String(S.g))); };
  nm.oninput = () => { S.name = nm.value; sync(); };
  nm.onkeydown = e => { if (e.key === 'Enter' && !go.disabled) go.click(); };
  app.querySelectorAll('.gr').forEach(b => b.onclick = () => { Snd.play('tap'); S.g = b.dataset.g; S.unit = 'all'; store.set('q_g_'+C.key, S.g); const y = window.scrollY; start(); window.scrollTo(0, y); });
  app.querySelectorAll('.unit').forEach(b => b.onclick = () => { Snd.play('tap'); S.unit = b.dataset.u === 'all' ? 'all' : +b.dataset.u; sync(); });
  go.onclick = () => { if (S.name.trim().length < 2){ toast('اكتب اسمك أولًا'); nm.focus(); return; }
    S.name = S.name.trim(); store.set('q_name_'+C.key, S.name); Snd.init(); Snd.play('start');
    begin(S.unit === 'all' ? Q.slice() : Q.filter(q => q.u === S.unit)); };
  sync(); localize(app);
}
function begin(list){ S.list = list; S.i = 0; S.ans = new Array(list.length).fill(null); show(); }

/* ---------- question ---------- */
function show(){
  S.screen = 'q';
  const q = S.list[S.i], app = $('#app');
  const done = S.ans.filter(a => a !== null).length, right = S.ans.filter(a => a && a.ok).length;
  const two = q.type === 'tf';
  app.innerHTML = `<div class="top"><span class="chip">👤 ${esc(S.name)}</span><span class="chip">${GR().label}</span><span class="chip">السؤال ${S.i+1} من ${S.list.length}</span><span class="chip sc">✔ ${right} صحيحة</span><div class="prog"><i style="width:${done/S.list.length*100}%"></i></div></div>
    <section class="card qc">
      <div class="qtag"><span class="tag">الوحدة ${UN[q.u]}</span><span class="tag t2">${two ? 'صح أم خطأ' : 'اختيار من متعدد'}</span></div>
      ${q.sec ? `<div class="secnote">${q.sec}</div>` : ''}
      <div class="qt"><span class="qn">${q.n}</span>${q.q}</div>${q.fig || ''}
      <div class="opts${two ? ' two' : ''}">${q.o.map((o,k) => `<button class="op" data-k="${k}"><span class="k">${LET[k]}</span><span>${o}</span></button>`).join('')}</div>
      <div id="fb"></div>
      <div class="nav"><button class="nx ghost" id="prev" ${S.i === 0 ? 'disabled style="opacity:.4"' : ''}>→ السابق</button><button class="nx" id="next">${S.i + 1 < S.list.length ? 'التالي ←' : '🏁 النتيجة'}</button></div>
    </section>
    <div class="foot">${C.footer}</div>`;
  app.querySelectorAll('.op').forEach(b => b.onclick = () => choose(+b.dataset.k));
  $('#next').onclick = next; $('#prev').onclick = () => { if (S.i > 0){ Snd.play('next'); S.i--; show(); } };
  if (S.ans[S.i]) paint(false);
  localize(app); window.scrollTo({top:0, behavior:'smooth'});
}
function choose(k){
  if (S.ans[S.i]) return;
  const q = S.list[S.i], ok = k === q.a;
  S.ans[S.i] = {k, ok};
  Snd.play(ok ? 'ok' : 'bad');
  paint(true);
  const right = S.ans.filter(a => a && a.ok).length;
  $('.chip.sc').textContent = '✔ ' + right + ' صحيحة'; localize($('.top'));
  $('.prog i').style.width = (S.ans.filter(a => a !== null).length / S.list.length * 100) + '%';
}
function paint(anim){
  const q = S.list[S.i], a = S.ans[S.i];
  document.querySelectorAll('.op').forEach(b => { const k = +b.dataset.k; b.disabled = true;
    if (k === q.a) b.classList.add('right'); else if (k === a.k) b.classList.add('wrong'); else b.classList.add('dim'); });
  const fb = $('#fb');
  fb.className = 'fb ' + (a.ok ? 'good' : 'bad');
  fb.innerHTML = `<div class="v">${a.ok ? '✔ إجابة صحيحة، أحسنت!' : '✘ إجابة خاطئة'}</div>
    ${a.ok ? '' : `<div class="ca">الإجابة الصحيحة: <b>(${LET[q.a]})</b> ${q.o[q.a]}</div>`}
    <div class="why"><b>💡 التوضيح: </b>${q.w}</div>`;
  if (!anim) fb.style.animation = 'none';
  localize(fb);
  if (anim) setTimeout(() => fb.scrollIntoView({behavior:'smooth', block:'nearest'}), 60);
}
function next(){
  if (!S.ans[S.i]){ toast('اختر إجابة أولًا'); return; }
  Snd.play('next');
  if (S.i + 1 < S.list.length){ S.i++; show(); } else result();
}

/* ---------- result ---------- */
function result(){
  S.screen = 'r'; Snd.play('done');
  const n = S.list.length, right = S.ans.filter(a => a && a.ok).length, pct = Math.round(right / n * 100);
  const rate = pct >= 90 ? ['ممتاز 🏆','var(--ok)'] : pct >= 75 ? ['جيد جدًا 🌟','var(--p)'] : pct >= 60 ? ['جيد 👍','#c98a00'] : ['تحتاج إلى مراجعة 💪','var(--bad)'];
  if (pct >= 75) confetti();
  const units = [...new Set(S.list.map(q => q.u))];
  const circ = 2 * Math.PI * 70;
  const date = new Date().toLocaleDateString('ar-KW', {year:'numeric', month:'long', day:'numeric'});
  const wrong = S.list.map((q,i) => ({q, a:S.ans[i]})).filter(x => !x.a.ok);
  const app = $('#app');
  app.innerHTML = `<section class="card res">
      <div class="nm">اسم الطالب<br><b>${esc(S.name)}</b></div>
      <div class="ring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="70" stroke="#e8edf5"/><circle cx="85" cy="85" r="70" stroke="${rate[1]}" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct/100)}"/></svg><b>${pct}%<small>النسبة</small></b></div>
      <h2>درجتك: ${right} من ${n}</h2>
      <span class="rate" style="color:${rate[1]};border-color:${rate[1]}">${rate[0]}</span>
      <div class="stats"><div><b style="color:var(--ok)">${right}</b><small>صحيحة</small></div><div><b style="color:var(--bad)">${n-right}</b><small>خاطئة</small></div><div><b>${n}</b><small>عدد الأسئلة</small></div></div>
      <div class="foot" style="margin-top:.8rem">${subj()} • ${date}</div>
    </section>
    ${units.length > 1 ? `<div class="sec"><i>📊</i>النتيجة في كل وحدة</div><section class="card ub">${units.map(u => {
      const idx = S.list.map((q,i) => q.u === u ? i : -1).filter(i => i >= 0), r = idx.filter(i => S.ans[i].ok).length, p = Math.round(r / idx.length * 100);
      const c = p >= 75 ? 'var(--ok)' : p >= 60 ? '#e0a100' : 'var(--bad)';
      return `<div class="ur"><b>الوحدة ${UN[u]} <small>${GR().units[u]}</small></b><b style="color:${c}">${r} / ${idx.length}</b><div class="bar"><i style="width:${p}%;background:${c}"></i></div></div>`; }).join('')}</section>` : ''}
    <div class="acts">
      ${wrong.length ? `<button class="pri" id="rw">🔁 أعد الأسئلة الخاطئة فقط (${wrong.length})</button>` : ''}
      <button class="${wrong.length ? '' : 'pri'}" id="ra">↺ إعادة المحاولة من البداية</button>
      <button id="rh">📚 اختيار وحدة أخرى</button>
    </div>
    ${wrong.length ? `<div class="sec"><i>🧠</i>راجع أخطاءك</div>${wrong.map(x => `<div class="rv"><div class="q"><span class="qn" style="width:28px;height:28px;min-width:28px;font-size:.8rem">${x.q.n}</span>${x.q.q.replace(/<table[\s\S]*<\/table>/, '')}</div>
      <div class="y">✘ إجابتك: (${LET[x.a.k]}) ${x.q.o[x.a.k]}</div><div class="a">✔ الصحيحة: (${LET[x.q.a]}) ${x.q.o[x.q.a]}</div><div class="w">💡 ${x.q.w}</div></div>`).join('')}` : ''}
    <div class="foot">${C.footer}</div>`;
  if ($('#rw')) $('#rw').onclick = () => { Snd.play('start'); begin(wrong.map(x => x.q)); };
  $('#ra').onclick = () => { Snd.play('start'); begin(S.list.slice()); };
  $('#rh').onclick = () => { Snd.play('tap'); start(); };
  localize(app); window.scrollTo({top:0, behavior:'smooth'});
}
function confetti(){ const box = $('#conf'), cols = ['var(--p)','var(--acc)','#ffc857','#2ee59d'];
  for (let k = 0; k < 70; k++){ const i = document.createElement('i'); i.style.left = Math.random()*100 + 'vw'; i.style.background = cols[k % 4];
    i.style.animationDuration = (1.8 + Math.random()*1.6) + 's'; i.style.animationDelay = Math.random()*.4 + 's'; box.appendChild(i); setTimeout(() => i.remove(), 4000); } }
$('#bHome').onclick = () => { if (S.screen === 'q' && !confirm('العودة للبداية؟ ستفقد تقدّمك في هذه المحاولة.')) return; Snd.play('tap'); start(); };
sIco(); start(); window.scrollTo(0,0);
})();
</script>
